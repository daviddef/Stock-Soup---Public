<meta charset="utf-8">
<title>The Stock Soup — Tonight's Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,800&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#14100E; --surface:#1E1815; --surface-2:#271F1A; --line:#3A2F27;
    --broth:#FF6B1A; --buy:#23C267; --dont:#FF4D4D; --hold:#FFC53D;
    --ink:#F4EDE4; --muted:#A69A8C; --faint:#6E6154;
    --shadow:0 12px 40px -12px rgba(0,0,0,.7);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --disp:"Fraunces",Georgia,"Times New Roman",serif;
  }
  @media (prefers-color-scheme:light){
    :root{ --ground:#FBF6EF; --surface:#FFFFFF; --surface-2:#F3EADF; --line:#E4D7C6;
      --ink:#1E1815; --muted:#7A6C5C; --faint:#A99A88; --shadow:0 12px 40px -16px rgba(80,50,20,.25); }
  }
  :root[data-theme="dark"]{ --ground:#14100E; --surface:#1E1815; --surface-2:#271F1A; --line:#3A2F27;
    --ink:#F4EDE4; --muted:#A69A8C; --faint:#6E6154; --shadow:0 12px 40px -12px rgba(0,0,0,.7); }
  :root[data-theme="light"]{ --ground:#FBF6EF; --surface:#FFFFFF; --surface-2:#F3EADF; --line:#E4D7C6;
    --ink:#1E1815; --muted:#7A6C5C; --faint:#A99A88; --shadow:0 12px 40px -16px rgba(80,50,20,.25); }

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ground);color:var(--ink);font-family:var(--font);line-height:1.5;
    -webkit-font-smoothing:antialiased;padding:clamp(14px,3vw,40px)}
  .wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  .display{font-family:var(--disp);font-weight:900;letter-spacing:-.02em;text-wrap:balance;line-height:.98;text-transform:uppercase}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a.q{color:inherit;text-decoration:none;border-bottom:1px dotted transparent}
  a.q:hover{color:var(--broth);border-bottom-color:var(--broth)}
  a.q:focus-visible{outline:2px solid var(--broth);outline-offset:2px;border-radius:2px}

  /* #140: .hero only ever holds the compact brand row + market toggle — the rich Menu-tab headline/
     chef/meter actually lives in #tab-menu's own .tabhead.menuhead below it, not in here. .hero is
     also the ONE persistent header shown above every tab, so its old clamp(20px,3.5vw,38px) padding
     (up to 38px on all sides around just a brand row) read as an oversized, mostly-empty header on
     the lighter tabs (Reviews/Faves/Kitchen), whose own .tabhead is a much tighter 16px. Original
     diagnosis here was wrong about the mechanism (blamed the other tabs' own headers reusing this
     padding — they don't, they use .tabhead) but right that .hero itself was too generous for what
     it actually contains on every tab, not just the light ones. */
  .hero{background:radial-gradient(120% 140% at 100% 0%, rgba(255,107,26,.16), transparent 55%),var(--surface);
    border:1px solid var(--line);border-radius:20px;padding:clamp(14px,2.4vw,26px);position:relative;overflow:hidden}
  .brandrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-style:italic;font-weight:800;font-size:21px;letter-spacing:-.01em}
  .hpot{position:relative;display:inline-flex;font-size:24px;line-height:1;animation:hbob 4.2s ease-in-out infinite;transform-origin:50% 90%}
  .hpotbowl{filter:drop-shadow(0 4px 6px rgba(225,77,11,.3))}
  .hsteam{position:absolute;left:50%;top:-7px;transform:translateX(-50%);width:20px;height:14px;pointer-events:none}
  .hsteam i{position:absolute;bottom:0;width:3px;height:12px;border-radius:50%;background:linear-gradient(to top,rgba(255,180,120,0),rgba(255,190,130,.85));filter:blur(1.6px);opacity:0;animation:hsteam 3s ease-in-out infinite}
  .hsteam i:nth-child(1){left:4px;animation-delay:0s}
  .hsteam i:nth-child(2){left:9px;height:15px;animation-delay:.65s}
  .hsteam i:nth-child(3){left:14px;animation-delay:1.3s}
  @keyframes hsteam{0%{opacity:0;transform:translateY(3px) scaleX(1)}30%{opacity:.8}60%{transform:translateY(-8px) scaleX(1.4)}100%{opacity:0;transform:translateY(-15px) scaleX(.7)}}
  @keyframes hbob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2.5px) rotate(2deg)}}
  @media (prefers-reduced-motion:reduce){.hpot{animation:none}.hsteam{display:none}}
  .bowl{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 200deg,var(--broth),#FFB061,var(--broth));
    display:grid;place-items:center;font-size:20px;box-shadow:0 0 24px -4px var(--broth)}
  .live{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--buy);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(35,194,103,.55)}70%{box-shadow:0 0 0 8px rgba(35,194,103,0)}100%{box-shadow:0 0 0 0 rgba(35,194,103,0)}}
  .hero h1,.menuhead h1{font-size:clamp(34px,7vw,68px);margin:14px 0 6px}
  .hero h1 .hot,.menuhead h1 .hot{color:var(--broth)}
  .chef{font-size:clamp(15px,2.2vw,19px);color:var(--muted);max-width:60ch;text-wrap:pretty}
  .chef b{color:var(--ink)}
  /* chefByMkt is authored as multi-<p> HTML — .chef is a <div> (NOT a <p>, which can't legally nest <p>
     and would auto-close, spilling the note out of the clamp target). Tidy the inner paragraph rhythm. */
  .chef p{margin:0 0 .6em}
  .chef p:last-child{margin-bottom:0}
  /* chef-note collapse (user ask) — the chef intro can run several paragraphs; clamp it to a few lines with
     a soft fade + a "read the full note" toggle so it's punchy by default, never a wall of text. */
  .chefwrap{position:relative}
  .chefwrap:not(.open) .chef{max-height:7.4em;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent)}
  .chefmore{margin-top:2px;background:none;border:0;color:var(--broth);font-weight:800;font-size:13px;cursor:pointer;padding:3px 0;letter-spacing:.01em}
  .chefmore:hover{text-decoration:underline}
  /* expanded note uses the FULL width (user ask) — drop the 60ch measure once open; on wide screens
     flow it into two columns so the right half is used and each line still reads at a sane length. */
  .chefwrap.open .chef{max-width:none}
  @media(min-width:820px){ .chefwrap.open .chef{columns:2;column-gap:46px} .chefwrap.open .chef p{break-inside:avoid} }
  /* #295/#310 — "Tonight's one move" hero */
  .onemove{position:relative;margin:24px 0 4px;padding:18px 20px 16px;border-radius:18px;cursor:pointer;overflow:hidden;
    background:linear-gradient(135deg,rgba(255,140,0,.13),rgba(255,140,0,.03));border:1.5px solid rgba(255,140,0,.42);
    animation:omReveal .6s cubic-bezier(.2,.72,.2,1) both;transition:border-color .18s,transform .18s}
  .onemove:hover{border-color:rgba(255,140,0,.8);transform:translateY(-1px)}
  .onemove:focus-visible{outline:2px solid var(--broth);outline-offset:2px}
  .omeye{font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#FF8C00;margin-bottom:9px}
  .omtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .omsym{font-family:var(--disp);font-weight:900;font-size:clamp(30px,7.4vw,46px);line-height:.95;letter-spacing:-.02em;color:var(--ink);text-transform:uppercase}
  .omname{font-family:var(--font);font-size:13.5px;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:8px;text-transform:none}
  .omscores{display:flex;gap:7px;flex:0 0 auto}
  .omsc{font-weight:800;font-size:13px;padding:4px 9px;border-radius:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .omjuice{color:#FF8C00;background:rgba(255,140,0,.16);border:1px solid rgba(255,140,0,.4)}
  .omcherry{color:#d6283c;background:rgba(214,40,60,.14);border:1px solid rgba(214,40,60,.42)}
  .omverd{display:inline-block;margin:12px 0 0;font-weight:900;font-size:12.5px;padding:4px 11px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
  .onemove.v-buy .omverd,.onemove.v-yum .omverd{background:rgba(35,194,103,.17);color:var(--buy)}
  .onemove.v-dont .omverd,.onemove.v-nah .omverd{background:rgba(209,80,58,.15);color:var(--dont)}
  .omwhy{margin:11px 0 0;font-size:14.5px;line-height:1.5;color:var(--ink);max-width:62ch}
  .ombuy{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;flex-wrap:wrap}
  .ombz{font-size:12.5px;font-weight:800;color:var(--muted)}
  .omcta{font-size:12.5px;font-weight:900;color:#FF8C00;white-space:nowrap}
  @keyframes omReveal{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){.onemove{animation:none}.onemove:hover{transform:none}}
  .metastrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .chip{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
  /* #135: this now carries a full sentence, not a short label. Real bug (9 Aug 2026, user screenshot):
     .chip sets white-space:nowrap AFTER this rule in source order, so on equal specificity it won,
     forcing the button to never wrap and overflow the screen edge — button.mktheadline raises the
     specificity so this wins instead, regardless of source order. min-width:0 is the actual flexbox
     fix (a flex item's default min-width:auto refuses to shrink below its unwrapped text width,
     which is what was truly pushing it off-screen even with white-space set correctly). Also sets
     color explicitly rather than trusting inheritance, after the same bug showed the text rendering
     in an unintended blue.*/
  button.mktheadline{border-radius:14px;font-size:13.5px;font-weight:700;text-align:left;white-space:normal;
    line-height:1.4;padding:9px 13px;max-width:100%;min-width:0;flex:1 1 auto;box-sizing:border-box;color:var(--ink)}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .toggle{cursor:pointer;font-family:var(--font);color:var(--ink)}
  .toggle:focus-visible{outline:2px solid var(--broth);outline-offset:2px}
  /* #174/#238 — the per-indicator emoji labels sit ABOVE the track (top:-22px). padding-top reserves that
     space INSIDE the meter box so an ancestor's overflow:hidden (e.g. .hero) can't shave their tops off
     (user-caught: flag/VIX/oil emojis clipped in half). margin stays small since padding now does the spacing.
     #256 — that STILL clipped (an ancestor clips at the chef-prose baseline, above the meter box), so the
     emoji labels now render BELOW the track instead of above it — open space there, no top-clip possible. */
  .meter{margin-top:14px}
  .meter.tappable{cursor:pointer;border-radius:12px;padding:4px 8px 6px;margin-left:-8px;margin-right:-8px;transition:background .12s}   /* #197 — tap the whole meter → tonight's read */
  .meter.tappable:hover{background:var(--surface-2)}
  .meter.tappable:focus-visible{outline:2px solid var(--broth);outline-offset:2px}
  .metertap{text-align:center;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-top:10px}
  .meter .track{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--dont),var(--hold),var(--buy));position:relative;opacity:.9}
  /* #184 — the composite "now" reading is a good-sized round black dot (was a thin vertical line),
     labelled "Risk", with a gentle pulse so it clearly reads as the live overall reading vs the small
     per-indicator emoji ticks above the track. */
  .meter .needle{--rs:15px;position:absolute;top:-7px;width:24px;height:24px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--surface);left:50%;transform:translateX(-50%);transition:left .8s cubic-bezier(.2,.8,.2,1);z-index:4;animation:riskpulse 2.4s ease-out infinite}
  /* #276 follow-up (user ask, 12 Aug) — the "Risk" needle label collided with the pulse halo AND forced the
     factor emojis down into a clip. Dropped: the needle dot + the legend below already make it obvious. */
  .meter .needle::after{content:none}
  @keyframes riskpulse{0%{box-shadow:0 0 0 3px var(--surface),0 0 0 3px var(--rcp,rgba(120,120,120,.35))}70%{box-shadow:0 0 0 3px var(--surface),0 0 0 var(--rs) rgba(120,120,120,0)}100%{box-shadow:0 0 0 3px var(--surface),0 0 0 3px rgba(120,120,120,0)}}
  @media(prefers-reduced-motion:reduce){.meter .needle{animation:none}}
  /* #219 — on a narrow phone the 24px dot + big halo read as oversized/jittery; scale both down so the
     pulse stays a tasteful accent, not the loudest thing on the row. */
  @media(max-width:560px){ .meter .needle{--rs:9px;width:19px;height:19px;top:-4.5px;box-shadow:0 0 0 2.5px var(--surface)} .meter .needle::after{top:calc(100% + 2px)}
    /* #276 — on a phone the below-track emoji ticks + the Risk label were crowding/clipping: shrink the
       emojis, and give the meter box explicit bottom room so nothing is shaved off. */
    .factormark .fmi{font-size:13px;top:18px} .meter .lbls{margin-top:38px;font-size:10px} .meter.tappable{padding-bottom:8px} .factorleg{font-size:12px;gap:7px 12px} }
  .meter .lbls{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:42px;font-weight:800}
  .meterleg{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:10.5px;font-weight:700;color:var(--muted)}
  .meterleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .meterleg i.ink{background:var(--ink)} .meterleg i.vix{background:#9b6bff}
  /* #174 — per-indicator markers on the risk line (was just Risk + VIX). Each of the 5 composite
     inputs gets a tick at its own 0-100 sub-score WITH its emoji sitting right above it, so you can
     tell which is which on the line itself (not just in the legend). Plus an emoji+score legend below. */
  .factormark{position:absolute;top:0;bottom:0;width:0;transform:translateX(-50%);pointer-events:none}
  .factormark::after{content:'';position:absolute;top:-3px;bottom:-3px;left:0;width:2px;transform:translateX(-50%);border-radius:1px;background:var(--ink);opacity:.55}
  /* #276 final call (12 Aug) — the per-tick emoji ON the bar clipped no matter the offset (top #238, bottom
     #276) against a container edge that isn't a plain CSS overflow. Given the legend below already shows every
     factor's emoji + label + score cleanly, drop the on-bar emoji and keep just the position TICK — no more
     whack-a-mole. The tick shows WHERE each factor sits; the legend says WHAT it is. */
  .meter, .meter .track, .factormark{overflow:visible}   /* belt-and-suspenders: nothing in the chain may clip the on-bar emoji */
  .factormark .fmi{position:absolute;top:20px;left:0;transform:translateX(-50%);font-size:15px;line-height:1;white-space:nowrap}
  .factorleg{display:flex;flex-wrap:wrap;gap:9px 18px;justify-content:center;margin-top:12px;font-size:13.5px;font-weight:700;color:var(--muted)}
  .factorleg span{white-space:nowrap;display:inline-flex;align-items:center;gap:5px} .factorleg b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:800}
  .tagword{opacity:.7;font-weight:700}

  .pulsebar{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--broth);border-radius:14px;padding:14px 16px}
  .pulsebar .ph{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .pdot{width:8px;height:8px;border-radius:50%;background:var(--broth);animation:pulse 2.4s infinite}
  .psynth{font-size:14.5px;line-height:1.5;text-wrap:pretty;color:var(--muted)}
  .celastcheck{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;font-weight:700;color:var(--muted)}
  .psynth b{color:var(--ink)}
  .pmovers{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
  .pmv{font-size:12px;font-weight:800;font-family:var(--mono);padding:3px 9px;border-radius:7px;background:var(--surface-2)}
  .pmv.up{color:var(--buy)} .pmv.down{color:var(--dont)}
  .cenv{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
  @media(max-width:760px){.cenv{grid-template-columns:1fr}}
  .cetraj,.ceprox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
  .ceh{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .cechartwrap{position:relative;padding-right:52px}
  .cechart{width:100%;height:120px;display:block}
  .celab{position:absolute;right:0;transform:translateY(-50%);font-size:11.5px;font-weight:900;white-space:nowrap;letter-spacing:.02em}
  .ceflat{text-align:right;font-size:10.5px;font-weight:800;color:var(--muted);margin-top:7px;padding-right:6px;letter-spacing:.02em}
  .celegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;font-weight:700}
  .celeg{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
  .celeg i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .celeg b.up{color:var(--buy)} .celeg b.down{color:var(--dont)}
  .proxrow{display:flex;align-items:center;gap:10px;padding:6px 0}
  .pxs{font-weight:800;font-size:13px;flex:0 0 auto;min-width:120px;display:flex;gap:6px;align-items:baseline}
  .proxbar{flex:1;position:relative;height:8px;border-radius:999px;background:var(--surface-2)}
  .proxzone{position:absolute;left:0;top:0;bottom:0;width:19%;background:rgba(35,194,103,.32);border-radius:999px}
  .proxnow{position:absolute;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
  .pxg{min-width:78px;display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums}
  .pxnow{font-size:13px;font-weight:800;color:var(--ink)}
  .s-in .pxnow,.s-near .pxnow{color:var(--buy)} .s-close .pxnow{color:var(--hold)}
  .pxbuy{font-size:11px;font-weight:700;color:var(--muted)}
  .pxst{font-size:10px;font-weight:800;color:var(--muted)}
  .s-in .proxnow,.s-near .proxnow{background:var(--buy)} .s-in .pxst,.s-near .pxst{color:var(--buy)}
  .s-close .proxnow{background:var(--hold)} .s-close .pxst{color:var(--hold)}
  .s-wait .proxnow{background:var(--faint)}
  .proxpct{position:absolute;bottom:14px;transform:translateX(-50%);font-size:10px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
  .s-in .proxpct,.s-near .proxpct{color:var(--buy)} .s-close .proxpct{color:var(--hold)} .s-wait .proxpct{color:var(--muted)}
  .proxkey{font-size:10px;color:var(--faint);margin-top:10px}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:2px}
  .clickchip{cursor:pointer;transition:box-shadow .12s,transform .1s}
  .clickchip:hover{box-shadow:0 0 0 1.5px var(--broth) inset} .clickchip:active{transform:scale(.98)}
  .chipi{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid currentColor;opacity:.55;font-family:Georgia,serif;font-style:italic;font-size:9px;font-weight:700;margin-left:3px}
  .lastupd{background:none;border:0;color:var(--muted);font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;padding:0 2px;white-space:nowrap}
  .lastupd:hover{color:var(--broth)}
  .refreshbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:15px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .signinbtn{background:var(--broth);color:#fff;border:0;font-weight:800;font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .signinbtn:hover{filter:brightness(1.05)}
  .refreshbtn:hover{border-color:var(--broth);color:var(--broth)}
  .refreshbtn.spinning{animation:spin .8s linear infinite;color:var(--broth)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);font-family:var(--font);font-weight:700;font-size:13px;line-height:1.4;padding:11px 18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.28);z-index:9999;opacity:0;transition:opacity .25s,transform .25s;max-width:82vw;text-align:center;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .sfull{display:block;width:100%;text-align:center;background:transparent;border:1px dashed var(--line);color:var(--muted);
    font-family:var(--font);font-weight:800;font-size:14px;padding:14px;border-radius:14px;cursor:pointer}

  /* #146 — Villager View: big, round, colorful, zero jargon on the card face */

  .vmoodemoji{font-size:58px;line-height:1}
  .vmoodword{font-size:27px;font-weight:900;letter-spacing:.02em;margin-top:2px}
  .vmoodline{font-size:14.5px;color:var(--muted);margin-top:3px}
  .vtheme{text-align:center;font-size:14px;font-weight:800;margin:14px 0 0;color:var(--ink);text-wrap:pretty}
  /* #172/#247 — the 3×3 type × timeframe matrix (Villager view). Cols: Type3→Type2→Type1 (wild→safe). Rows:
     DAY/WEEK/MONTH. Now shares the .simple column width (no more 96vw breakout) so it aligns edge-to-edge
     with the hero/risk-chart above it. */
  /* #257 — wrap the 3×3 in the SAME bordered panel as the pot below it (bg + border + padding), so the two
     read as matching, equal-width cards with their contents inset the same — the alignment the user wanted. */
  .tmxwrap{width:100%;margin:6px 0 4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 12px}
  .tmx-title{text-align:center;font-size:14px;font-weight:900;letter-spacing:.01em;margin-bottom:10px}
  /* #260 — the verbose "The 3×3 — every type, every timeframe" banner is gone; each grid now carries just a
     light market label so the stacked AU + US grids stay distinguishable. */
  .tmx-mkt{font-size:13px;font-weight:800;color:var(--ink);letter-spacing:.01em;margin:2px 2px 9px;display:flex;align-items:center;gap:6px}
  .tmx-mkt small{font-weight:700;color:var(--muted);font-size:11px}
  .tmx{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:stretch}
  .tmx-rowh{grid-column:1/-1;justify-content:flex-start !important;padding:8px 2px 2px !important;font-size:11px}
  .tmx-colh{text-align:center;display:flex;flex-direction:column;gap:1px;padding:2px 0 5px;font-size:12px;font-weight:900;border-bottom:2px solid var(--line)}
  .tmx-colh span{font-size:9.5px;font-weight:700;color:var(--muted)}
  .tmx-colh-t3{border-bottom-color:var(--dont)} .tmx-colh-t2{border-bottom-color:var(--hold,#e0a92e)} .tmx-colh-t1{border-bottom-color:var(--buy)}
  /* risk strip under the headers — mirrors the risk slider (red=wilder/Tier 3 left → green=safer/Tier 1 right) */
  .tmx-riskbar{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--dont),var(--hold,#e0a92e),var(--buy));display:flex;justify-content:space-between;align-items:center;padding:0 8px;margin:2px 0 4px;position:relative}
  .tmx-rl{font-size:8.5px;font-weight:900;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.35);letter-spacing:.03em;white-space:nowrap}
  .tmx-rowh{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:900;letter-spacing:.06em;color:var(--muted)}
  /* #182/#247 — each cell is a compact mini card: mascot + ticker + %chg + YUM/NAH + 🍊. Uniform height
     (no per-cell chart — that was inconsistent + cluttered; the chart is one tap away in the detail),
     hairline borders + a whisper of tone tint instead of the old loud 1.5px coloured frames. */
  .tmx-cell{border-radius:13px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:11px 6px;border:1px solid var(--line);background:var(--card,var(--surface));font-family:inherit;line-height:1.1}
  .tmx-empty{color:var(--faint);background:transparent;justify-content:center;gap:4px}
  .tmx-zzz{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .tmx-vcell{cursor:pointer;transition:transform .1s;position:relative}
  .tmx-sugg{opacity:.82;border-style:dashed}
  .tmx-suggtag{position:absolute;top:5px;left:0;right:0;text-align:center;font-size:8.5px;font-weight:800;letter-spacing:.04em;color:var(--broth)}
  .tmx-vcell:hover{transform:translateY(-2px)}
  .tmx-masc{font-size:26px;line-height:1}
  .tmx-symrow{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;justify-content:center}
  .tmx-sym{font-weight:900;font-size:15px;letter-spacing:-.01em}
  .tmx-chg{font-size:11px;font-weight:900}
  .tmx-name{font-size:9px;font-weight:700;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
  .tmx-spark{width:100%;margin:3px 0 1px}
  .tmx-spark .misschart{min-height:26px} .tmx-spark .misschart-mm{display:none} .tmx-spark .misschart-flag{display:none} .tmx-spark .misschart-load{font-size:9px;color:var(--faint)}
  .tmx-botrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:auto}
  .tmx-stick{font-size:8.5px !important;padding:1px 7px !important}
  .tmx-jz{font-size:9px;font-weight:900;color:#e07b00;background:rgba(255,140,0,.13);border:1px solid rgba(255,140,0,.35);border-radius:6px;padding:1px 5px}
  .tmx-buy{border-color:rgba(35,194,103,.5);background:rgba(35,194,103,.06)} .tmx-buy .tmx-sym{color:var(--buy)}
  .tmx-skip{border-color:rgba(214,69,69,.4);background:rgba(214,69,69,.05)} .tmx-skip .tmx-sym{color:var(--dont)}
  .tmx-mid{border-color:rgba(224,169,46,.45);background:rgba(224,169,46,.05)}
  .tmx-legend{text-align:center;font-size:10px;color:var(--faint);margin-top:8px;letter-spacing:.02em}
  /* #193 — 3×3 polish: a touch more breathing room + consistent baseline so the 9 cells read as one tidy set */
  .tmx-cell{line-height:1.15}

  .tmx-mini-empty .tmx-mini-zzz{font-size:10px;font-weight:800;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
  /* tone tint + sym colour already defined on .tmx-buy/.tmx-skip/.tmx-mid — they apply to .tmx-mini too */
  .simplemeter{margin:2px 0 14px}   /* #263 — bare risk meter sits at the top of the type-cards panel */
  .simplemeter .needle::after{content:none}   /* #269 (user ask) — drop the "Risk" needle label in Simple */
  /* #199 — the Simple-view whole-pot: score-sorted, both markets, one threshold slider */
  /* #199 follow-up (user ask) — break out to the same full width as the 3×3 above, and lay the rows
     3-abreast (2 on tablet, 1 on phone) so the pot doesn't run as one tall narrow column. */
  .spotwrap{width:100%;margin:6px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 10px}
  .spot-h{text-align:center;font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:8px} .spot-h b{color:var(--broth)}
  .spot-ctl{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:10px}
  .spot-ctl b{color:var(--ink);min-width:34px;text-align:center} .spot-ctl input[type=range]{flex:1;max-width:220px;accent-color:var(--broth)}
  .potthr-ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 12px}
  /* #273 — Full Pot ranking-lens toggle (🍊 timing / 🍒 conviction) */
  .potlens-ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px;font-size:12px;color:var(--muted);font-weight:800}
  .potlens-ctl .pll-lbl{letter-spacing:.02em}
  .potlens-ctl .pll-sep{margin-left:8px;padding-left:8px;border-left:1px solid var(--line)}   /* #296 — divide Rank-by from View */
  .potboard{grid-template-columns:1fr}   /* #296 — Leaderboard = one clean ranked column (rank badges via .pmc-rank) */
  .potlensbtn{font-family:var(--font);font-size:12px;font-weight:800;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;transition:all .12s}
  .potlensbtn:hover{border-color:var(--broth)}
  .potlensbtn.on{color:var(--ink);border-color:var(--broth);background:color-mix(in srgb,var(--broth) 16%,transparent)}
  .potlensbtn:focus-visible{outline:2px solid var(--broth);outline-offset:2px}
  .potthr-ctl b{color:var(--ink);min-width:34px;text-align:center} .potthr-ctl input[type=range]{flex:1;max-width:260px;accent-color:var(--broth)}
  .potthr-none{color:var(--broth);font-weight:700}
  .spot-list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  @media(max-width:760px){.spot-list{grid-template-columns:1fr 1fr}}
  @media(max-width:480px){.spot-list{grid-template-columns:1fr}}
  .spot-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer;transition:border-color .12s}

  .spot-sym{flex:0 0 auto;font-weight:900;font-size:13.5px;min-width:44px}
  .spot-name{flex:1 1 auto;min-width:0;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .spot-px{flex:0 0 auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
  .spot-chip{flex:0 0 auto}

  .vgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:540px;margin:4px auto 0}

  .vcard{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:22px;

  /* MODAL */

// #212 — the moment a recommendation became actionable: the intraday chart marks the timestamp of the
// run that CONFIRMED this pick (the start of its current continuous streak on the menu), so you can see
// the earliest point you could have bought and how it's moved since. Reuses the miss-chart hydration
// (data-check-ts + data-hydrate-chart); the marker label reads "served" instead of "flagged".
function servedChartSlot(sym,region,cur,iso){

// Earliest ISO of the current UNBROKEN run of menus that still contain this ticker in this region —
// i.e. "we've served this continuously since HH:MM". menus[0] is newest; walk older until the streak
// breaks. Falls back to the current run's commit time (this pick is brand-new this run).
function pickServedISO(sym,regionId){
  var H=(LAST&&LAST.H)||{}, ms=H.menus||[], iso=null;
  for(var i=0;i<ms.length;i++){
    var arr=ms[i]&&ms[i][regionId]; if(!arr||arr.indexOf(sym)<0) break;
    iso=ms[i].iso||iso;
  }
  if(!iso){ var D=(LAST&&LAST.D)||{}; iso=D.generated||null; }
  return iso;
}

// #192 — split the movers into two honest buckets:
//   • "got away"  = big movers that were NEVER in our net (status 'missed') — a coverage gap.
//   • "wrong way" = movers that WERE in our net (scanned or served) but we didn't act on / didn't
//                   call the direction — we saw it, but didn't capitalise.
function _missRows(mi, tfLabel){
  var mktRows=(mi&&mi.rows||[]).filter(function(r){return (r.region||'us')===MKT;});
  // #235 — dedupe by sym (the source occasionally lists the same mover twice, e.g. BET/CAR/WBC showing as
  // duplicate cards). Keep the first occurrence.
  var _seen={}; mktRows=mktRows.filter(function(r){ if(_seen[r.sym])return false; _seen[r.sym]=1; return true; });
  // #225 — a big mover never in our net only "got away" if it went UP (missed upside). A big FALLER we
  // never touched isn't a miss — it's a dodge (good we weren't in it). Split the two so a −25% loser
  // stops being counted/labelled as a missed opportunity.
  var _pct=function(r){return (r.pct!=null?r.pct:(r.change!=null?r.change:0));};
  var away=mktRows.filter(function(r){return r.status==='missed' && _pct(r)>=0;});
  var dodged=mktRows.filter(function(r){return r.status==='missed' && _pct(r)<0;});
  var wrong=mktRows.filter(function(r){return r.status==='served'||r.status==='scanned';});
  var render=function(r){return _missRow(r, mi, tfLabel);};
  return {awayRows:away.map(render).join(''), wrongRows:wrong.map(render).join(''), dodgedRows:dodged.map(render).join(''),
          awayN:away.length, wrongN:wrong.length, dodgedN:dodged.length, missedN:away.length, mktRows:mktRows};
}

// ── Unified signal read (#73): one place that turns RSI/trend/EMA/Bollinger/relative-strength/news

// #131 (9 Aug 2026, user ask) — "vs index" only ever had a text line ("Beating by 11.58pts"); we don't
// have two full price series to overlay (only the differential the model computed), so the honest

function sigDiagRS(rs,idxNm){

function signalRows(p,region,opts){
  opts=opts||{};

  if(!opts.skipRsi&&p&&p.rsi!=null){
    var rsi=p.rsi, tone=rsi>=70?'neg':rsi<=35?'pos':'mix';
    rows.push({icon:'🌡️',label:'RSI '+rsi,tone:tone,
      read:rsi>=70?'Overheated — wait for it to cool':rsi<=35?'Cheap — bargain zone':'Comfortable, not stretched',
      explain:'Momentum gauge, 0–100. Above 70 = overbought (often pulls back); below 35 = oversold (often bounces).',
      diagram:sigDiagRSI(rsi)});
  }
  var t=p&&p.trend;
  if(t&&(t.adx!=null||t.macd_pos!=null)){
    var strong=t.adx!=null&&t.adx>=25, tone,read;
    if(t.macd_pos===true&&t.macd_rising===true){tone='pos';read=strong?'Confirmed uptrend':'Building momentum';}
    else if(t.macd_pos===false&&t.macd_rising===false){tone='neg';read=strong?'Confirmed downtrend':'Losing steam';}
    else if(t.adx!=null&&t.adx<20){tone='mix';read='Choppy, no clear trend';}
    else {tone='mix';read='Trend stalling';}
    rows.push({icon:'📊',label:'Trend'+(t.adx!=null?' · ADX '+t.adx:''),tone:tone,read:read,
      explain:'MACD shows direction, ADX shows strength — 25+ is a real trend, under 20 is choppy/no trend.',
      diagram:sigDiagTrend(tone,strong)});
  }
  var e=p&&p.ema;
  if(e&&e.ema20!=null){
    var tone=(e.above_ema20&&e.above_ema50)?'pos':(!e.above_ema20&&!e.above_ema50)?'neg':'mix';
    rows.push({icon:'📈',label:'EMA',tone:tone,
      read:tone==='pos'?'Above both the 20 & 50-day averages':tone==='neg'?'Below both the 20 & 50-day averages':'Between the 20/50-day averages',
      explain:'Fast-reacting moving averages. Above both = short-term strength; below both = short-term weakness.',
      diagram:sigDiagEMA(e.above_ema20,e.above_ema50)});
  }
  var b=p&&p.bb;
  if(b&&b.bb_pctb!=null){
    var pb=b.bb_pctb, tone=null, read='Mid-band — unremarkable';
    if(pb>1){tone='neg';read='Pierced the upper band — stretched';}
    else if(pb<0){tone='pos';read='Pierced the lower band — oversold';}
    else if(pb>0.8){tone='mix';read='Near the upper band';}
    else if(pb<0.2){tone='mix';read='Near the lower band';}
    if(tone) rows.push({icon:'〰️',label:'Bollinger',tone:tone,read:read,
      explain:'Volatility bands around the price. Piercing the upper band = stretched; piercing the lower = oversold.',
      diagram:sigDiagBB(pb)});
  }
  var rs=p&&p.relStrength;
  if(rs&&rs.rs!=null){
    var idxNm=region==='au'?'ASX 200':'S&P 500', lead=rs.rs>=0;
    rows.push({icon:lead?'🏆':'🐌',label:'Vs '+idxNm,tone:lead?'pos':'neg',
      read:(lead?'Beating':'Lagging')+' by '+Math.abs(rs.rs)+'pt'+(Math.abs(rs.rs)===1?'':'s'),
      explain:'Performance vs the broader index over the same stretch — is it actually leading, or just drifting with the market?',
      diagram:sigDiagRS(rs.rs,idxNm)});
  }
  var dz=p&&p.demand_zone, sz=p&&p.supply_zone;
  if((dz||sz)&&p.rsi!=null){   // needs a live price context (nNow) to say near/far, same gate as other rows
    var px=p.nNow!=null?p.nNow:null;
    if(px!=null){
      var nearD=dz&&Math.abs(px/dz.level-1)<=0.03, nearS=sz&&Math.abs(px/sz.level-1)<=0.03;
      var tone=nearD?'pos':nearS?'neg':'mix';
      var read=nearD?'Right at a recent demand zone ('+esc(String(dz.level))+') — real buying showed up here before'
        :nearS?'Right at a recent supply zone ('+esc(String(sz.level))+') — real selling showed up here before'
        :(dz&&sz?'Between recent demand ('+esc(String(dz.level))+') and supply ('+esc(String(sz.level))+') zones'
          :dz?'Recent demand zone at '+esc(String(dz.level)):'Recent supply zone at '+esc(String(sz.level)));
      rows.push({icon:'🧱',label:'Supply/demand',tone:tone,read:read,
        explain:'The most recent swing high/low that printed on above-average volume — a level where real buying or selling pressure showed up before, not just an ordinary wiggle.'});
    }
  }

function signalSummary(rows){
  var scored=rows.filter(function(r){return r.tone==='pos'||r.tone==='neg';});
  // #257 (11 Aug 2026, competitor research) — COVERAGE/CONFIDENCE: how many real signals actually back
  // this read. A verdict from 2 signals is not as trustworthy as one from 8, so we say so plainly rather
  // than presenting a thin read as if it were a full one. Extends the app's existing "insufficient
  // signal" honesty (the ASX-renorm ethos) to the display side. `thin` = fewer than 4 total signals.
  var cover=rows.length, thin=cover<4;
  if(scored.length<2) return {verdict:'limited',icon:'❔',label:'Limited signal data',coverage:cover};
  var pos=scored.filter(function(r){return r.tone==='pos';}).length;
  var neg=scored.filter(function(r){return r.tone==='neg';}).length;
  // User ask (9 Aug 2026): show the real tally, not just an adjective — "6 positive / 2 negative"
  // reads as evidence; "mixed" alone makes you open the breakdown just to find out what "mixed" means.
  var label=pos+' positive / '+neg+' negative'+(thin?' · limited coverage':'');
  if(pos-neg>=2&&pos>=2) return {verdict:'strong',icon:'✅',label:label,coverage:cover};
  if(neg-pos>=2&&neg>=2) return {verdict:'weak',icon:'⚠️',label:label,coverage:cover};
  return {verdict:'mixed',icon:'😐',label:label,coverage:cover};
}

function sigRowsHtml(rows,opts){

// #143 (user ask, scoped 9 Aug 2026): "how easily can we build a bargain alert — cheap, no real
// negative indicators right now." Answer: no pipeline change needed — score_candidates() (score-pot.py)
// already computes every field this needs onto every candidate (rsi, bb.bb_pctb, ema.above_ema20/50,
// score.detail.penalty_detail, score.detail.hard_excluded, news_sentiment via pulse.py's CAND_PULSE_FIELDS
// merge). This is a pure display-side filter over already-published data — real thresholds, not a
// vague vibe: genuinely oversold (RSI<=40 AND pierced/near the lower Bollinger band), NOT in a
// structural downtrend (must be above at least one of its 20/50-day EMAs — below both is a falling
// knife, not a bargain), no active harsh penalty (capital raise / insider selling / stale or
// already-priced-in catalyst), not hard-excluded, and news isn't actively negative.
function isBargain(c){
  if(!c||!c.score) return false;
  var d=c.score.detail||{};
  if(d.hard_excluded) return false;
  if(c.rsi==null||c.rsi>40) return false;
  var bb=c.bb&&c.bb.bb_pctb;
  if(bb==null||bb>=0.3) return false;
  var e=c.ema||{};
  if(e.above_ema20===false&&e.above_ema50===false) return false;
  var harsh=(d.penalty_detail||[]).filter(function(p){return /capital.raise|insider|stale|priced.in/i.test((p.k||'')+' '+(p.why||''));});
  if(harsh.length) return false;
  if(c.news_sentiment!=null&&c.news_sentiment<-0.1) return false;
  return true;
}

function announcementsHtml(items){

  var rows=items.slice(0,5).map(function(a){

    // #111 — admin-only hint: this filing fell through to the generic neutral read and is genuinely
    // price-sensitive, so a real WebSearch deep-read (signals_asx.py's deep_read_query()) usually finds

    var dr=(isAdmin()&&a.deepReadQuery)?'<div class="anndr" title="'+esc(a.deepReadQuery)+'">🔍 Needs deep-read — generic classification</div>':'';
    return '<div class="annrow '+t.cls+'"><div class="anntop"><span class="annic">'+t.ic+'</span>'+head+(a.date?'<span class="anndate">'+esc(String(a.date).slice(0,10))+'</span>':'')+'</div>'+
      '<div class="annwhy">'+esc(a.why||'')+'</div>'+dr+'</div>';
  }).join('');
  return '<div class="viz"><h4>📢 Key announcements</h4>'+rows+'</div>';
}
var SCORE_FLAB={pead:"Earnings",rev:"Analysts",hi:"Trend/High",news:"Catalyst",vol:"Volume",ins:"Insider"};

// below like we do the signals"). Plain-English "what it is + what makes it up" for each score factor.
var FACTOR_EXPLAIN={
  hi:{ic:'📈',what:'Is it trending up and trading near its recent highs?',makeup:'Built from where the price sits versus its 52-week high, plus whether it’s above its 20 / 50 / 200-day moving averages. Near the highs and above its averages = strong; well off the highs or below its averages = weak. Usually the model’s single biggest ingredient — momentum plus proximity to the highs.'},
  news:{ic:'📣',what:'A real-world EVENT that gives a fresh reason to move — this is the catalyst.',makeup:'A contract win, earnings beat, analyst upgrade or a price-sensitive announcement, weighted by how fresh it is and whether the price has already jumped on it. <b>Catalyst vs signal:</b> a catalyst is something that HAPPENED (news, a deal) — a reason to move; a signal is a technical read of the chart (RSI, trend, volatility) — the stock’s current state. A strong, fresh catalyst is what lets a name score high even when the short-term signals are mixed.'},
  pead:{ic:'🎯',what:'Earnings-beat drift — stocks tend to keep drifting up for weeks after a strong result.',makeup:'How much the last result beat expectations and how recently it reported. A big, recent beat scores high; no recent earnings, or a miss, scores low. US names only — there’s no ASX earnings-surprise feed on our plan.'},
  rev:{ic:'✍️',what:'Analyst revisions — are the professionals upgrading or downgrading their calls?',makeup:'The net direction and size of recent analyst rating and price-target changes. More upgrades than downgrades scores high. US names only.'},
  vol:{ic:'📊',what:'How much trading activity there is versus a normal day — the conviction behind a move.',makeup:'Today’s volume ÷ its 20-day average. Well above 1× means real interest and money backing the move (more trustworthy); near or below 1× means it’s quiet and the move is thin. Volume doesn’t pick a direction — it tells you how much weight to put on everything else.'},
  ins:{ic:'🧑‍💼',what:'Insider activity — are the company’s own directors buying or selling their stock?',makeup:'Recent director buys (a confidence signal) versus sells over the last ~90 days. Clustered buying scores high; heavy selling drags it down.'}
};

// is the compact face chip: 🍊 + the score, tapping opens the exact same full openJuice() breakdown.
// Reuses the JUICE_CACHE + the document-level .juicebtn delegated listener, so no extra wiring.
// #186 — the 🍊 chip is now the SINGLE entry to a consolidated breakdown (score bar + simple checklist +
// signal charts + raw derivation), replacing the old 3 separate chips (🍊 juice / 🧮 signals / 🧾 checklist).
// #266 — every card FACE should show both the 🍊 (timing) and 🍒 (overall conviction) chips, not just the
// orange. dualChip is the one-liner used across action cards, next-best, What's Coming Up, movers, misses,
// watchlists — same signature as juiceChip, so a call site just swaps the name.
function dualChip(score,sym,name,sigRows){
  if(!score||score.buy_now==null) return '';
  // #298 — face shows the LEADING score only (per user pref); the other stays reachable in the detail modal.
  var lead=curScoreLead();
  var j=juiceChip(score,sym,name,sigRows), c=cherryChip(score,sym,name,sigRows);
  if(lead==='orange') return j||c;
  if(lead==='both') return j+c;
  return c||j;   // 'cherry' (default) — 🍒 leads, fall back to 🍊 if conviction can't be computed
}
function juiceChip(score,sym,name,sigRows){
  // #orange-top fix (11 Aug 2026) — was requiring score.detail, so a pick WITHOUT detail (e.g. CPU) fell to
  // a dead <span>, and its 🍊 did nothing. Render the chip for ANY scored name; openJuice degrades cleanly

  if(!score||score.buy_now==null) return '';
  var jid=++JUICE_SEQ; JUICE_CACHE[jid]={score:score,sym:sym,name:name,sigRows:sigRows||[]};
  return '<button class="juicebtn" data-juice-id="'+jid+'" title="Tap for the full breakdown — '+esc(score.band||'')+'">🍊 '+score.buy_now+'</button>';
}

// technical reads that don't move the buy-now score on their own. A single, plain "all things considered,

// 🍊 (doesn't replace it): 🍊 = when to buy · 🍒 = overall strength.
var OV_FULL_COVERAGE=6;   // signals needed for the vote to carry full weight (below this it's shrunk toward neutral)

// pairwise correlation of tonight's picks' recent price paths (their sparklines — no new data) and warns when
// two picks have been moving in near-lockstep: that's effectively ONE bet, not two, so a single wrong call
// takes both down. The most useful risk lesson for a retail investor, and self-contained.
function _pearson(a,b){
  if(!a||!b) return null;
  var n=Math.min(a.length,b.length); if(n<8) return null;
  a=a.slice(-n); b=b.slice(-n);
  var ma=0,mb=0,i; for(i=0;i<n;i++){ma+=a[i];mb+=b[i];} ma/=n; mb/=n;
  var num=0,da=0,db=0; for(i=0;i<n;i++){var x=a[i]-ma,y=b[i]-mb; num+=x*y; da+=x*x; db+=y*y;}
  if(da<=0||db<=0) return null;
  return num/Math.sqrt(da*db);
}

function overallScore(buyNow, rows){

  var neg=scored.filter(function(r){return r.tone==='neg';}).length;

// Plain-English "what happened" for one graded call — the honesty of that exact pick on that run.
function openGrade(key){
  key=String(key).replace(/\*$/,'');
  // key may be a plain sym (T1, legacy) or a composite "SYM|T2|date" (#218 tier picks) — resolve either.
  var o=OUTCOMES&&OUTCOMES.outcomes&&(OUTCOMES.outcomes[key]||OUTCOMES.outcomes[key.split('|')[0]]); if(!o)return;
  var sym=o.sym||key.split('|')[0];
  LASTFOCUS=document.activeElement;
  var nm=((LAST&&LAST.H&&LAST.H.names)||{})[sym]||'';
  var cur=o.region==='au'?'A$':'$', mkt=o.region==='au'?'the ASX 200':'the S&P 500';
  var tfWord={Day:'a <b>day-trade</b> — checked the very next trading day',
              Week:'a <b>week pick</b> — checked after about a week',
              Long:'a <b>long hold</b> — checked after about a month'};
  var tfEmoji=tfB(o.tf);
  var vc,verd,body;
  var line1='We put <b>'+esc(sym)+'</b>'+(nm?' ('+esc(nm)+')':'')+' on the menu as '+tfWord[o.tf]+', on <b>'+esc(fmtDate(o.date))+'</b>'+(o.entry!=null?' at <b>'+cur+o.entry+'</b>':'')+'.';
  if(o.status!=='graded'){
    vc='v-hold'; verd='⏳ Still cooking';
    body='<p class="mtake">'+line1+'</p><div class="gexp"><p>Its window hasn\'t finished yet, so we <b>haven\'t marked it right or wrong</b>. That\'s the whole point of doing this honestly — no scoring a pick until its clock is actually up.</p></div>';
  }else{
    var up=o.ret>=0, retPct=Math.abs(Math.round(o.ret*1000)/10);
    vc=o.correct?'v-buy':'v-dont'; verd=o.correct?'✓ We got this one right':'✗ This one didn\'t work';
    var line2='When its time was up'+(o.exitDate?', on <b>'+esc(fmtDate(o.exitDate))+'</b>':'')+', it was'+(o.exit!=null?' <b>'+cur+o.exit+'</b> — ':' ')+'<b class="'+(up?'up':'down')+'">'+(up?'up ':'down ')+retPct+'%</b> from where we called it.';
    var line3='';
    if(o.excess!=null){var bret=Math.round((o.ret-o.excess)*1000)/10, exc=Math.abs(Math.round(o.excess*1000)/10);
      line3='<p>Over the same days '+mkt+' '+(bret>=0?'went up':'went down')+' '+Math.abs(bret)+'%, so this pick <b>'+(o.correctVsIndex?'did better than the market':'did worse than the market')+'</b> by '+exc+'%.</p>';}
    var line4='<p class="gverdict">'+(o.correct?'It <b>made money</b> over its window → counts as a <b>win ✓</b>.':'It <b>lost money</b> over its window → counts as a <b>loss ✗</b>.')+' We only call a pick right if it actually went up in its own timeframe — win or lose, it goes on the record.</p>';
    body='<p class="mtake">'+line1+'</p><div class="gexp"><p>'+line2+'</p>'+line3+line4+'</div>';
  }
  var m=document.getElementById('modal'); m.className='modal';
  m.innerHTML='<div class="mhead '+(vc==='v-buy'?'buy':vc==='v-dont'?'don':'hold')+'"><button class="mclose" id="mClose" aria-label="Close">✕</button>'+
    '<div class="mtf">'+tfEmoji+' '+(o.region==='au'?'🇦🇺 ASX':'🇺🇸 US')+(o.tier&&o.tier!=='T1'?' · '+esc(o.tier)+' whole-market scan':'')+' · scored honestly</div>'+
    '<div class="mtop"><div class="msym">'+esc(sym)+'</div></div>'+
    '<span class="mverd '+vc+'">'+esc(verd)+'</span></div>'+
    '<div class="mbody">'+body+'</div>';
  var ov=document.getElementById('overlay'); ov.classList.add('open'); ov.setAttribute('aria-hidden','false');
  document.getElementById('mClose').focus();
}
// Tap a Day/Week/Long tile → every win & loss in that timeframe.
function openTimeframe(tf){
  if(!(OUTCOMES&&OUTCOMES.outcomes))return;
  LASTFOCUS=document.activeElement;
  var all=Object.keys(OUTCOMES.outcomes).map(function(k){return OUTCOMES.outcomes[k];}).filter(function(o){return o.tf===tf;});
  var graded=all.filter(function(o){return o.status==='graded';}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var pending=all.filter(function(o){return o.status!=='graded';});
  var wins=graded.filter(function(o){return o.correct;}).length, n=graded.length;
  var TL={Day:'Day trades',Week:'Week holds',Long:'Long holds'};
  var TW={Day:'each checked the next trading day',Week:'each checked after about a week',Long:'each checked after about a month'};
  var wr=n?Math.round(wins/n*100):0, vc=wr>=60?'buy':wr>=40?'hold':'don';
  function row(o){
    var pct=(o.ret>=0?'+':'')+(Math.round(o.ret*1000)/10)+'%';
    if(o.status!=='graded') return '<div class="tfrow"><span class="tfr-v jg-pend">⏳</span><span class="tfr-sym">'+esc(o.sym)+'</span><span class="tfr-date">'+esc(fmtDate(o.date))+'</span><span class="tfr-ret muted">still open</span></div>';
    return '<div class="tfrow graderow" data-gsym="'+esc(o.sym)+'" role="button" tabindex="0" title="Tap for the full story"><span class="tfr-v '+(o.correct?'jg-win':'jg-loss')+'">'+(o.correct?'✓':'✗')+'</span><span class="tfr-sym">'+esc(o.sym)+'</span><span class="tfr-date">'+esc(fmtDate(o.date))+'</span><span class="tfr-ret '+(o.ret>=0?'up':'down')+'">'+esc(pct)+(o.correctVsIndex?' <span class="idxbeat">beat mkt</span>':'')+'</span></div>';
  }
  var TN={Day:'day-trade',Week:'week',Long:'long-hold'};
  var body='<p class="mtake">Every <b>'+TN[tf]+'</b> call we\'ve made — '+TW[tf]+'. <b class="'+(wr>=50?'up':'down')+'">Right '+wins+' of '+n+'</b> ('+wr+'%).</p>'+
    '<div class="tflist">'+(graded.map(row).join('')||'<p class="muted">No graded calls yet.</p>')+
    (pending.length?'<div class="tfpend-h">Still open</div>'+pending.map(row).join(''):'')+'</div>'+
    '<p style="font-size:11.5px;color:var(--faint);margin-top:12px">Green ✓ = it made money in its window. <span class="idxbeat">beat mkt</span> = also beat the market. Tap any row for the full story.</p>';
  var m=document.getElementById('modal'); m.className='modal';
  m.innerHTML='<div class="mhead '+vc+'"><button class="mclose" id="mClose" aria-label="Close">✕</button>'+
    '<div class="mtf">📊 Scored honestly</div><div class="mtop"><div class="msym" style="font-size:22px">'+tfB(tf)+' '+esc(TL[tf])+'</div></div>'+
    '<span class="mverd '+(vc==='buy'?'v-buy':vc==='don'?'v-dont':'v-hold')+'">'+wr+'% right</span></div>'+
    '<div class="mbody">'+body+'</div>';
  var ov=document.getElementById('overlay'); ov.classList.add('open'); ov.setAttribute('aria-hidden','false');
  document.getElementById('mClose').focus();
  m.querySelectorAll('.tfrow.graderow').forEach(function(r){
    function go(){ openGrade(r.dataset.gsym); }
    r.addEventListener('click',go);
    r.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
}

// Verdict-pill glossary (#82) — the one-line verdict ("Accumulate before results", "Great bank, rich
// price — dips only") is punchy on purpose, but punchy reads as jargon if you don't already trade.
// Verdicts are free text (a different phrase per pick, not a fixed list), so this can't be one lookup
// per phrase — instead it's a small vocabulary of the actual trading terms that keep showing up,
// matched against whatever phrase this pick happens to use. Scales to any future verdict for free.
var VERDICT_GLOSSARY=[
  [/accumulate/i,'Accumulate','Buy gradually, a bit at a time, instead of all in one go.'],
  [/before results|ahead of the number|catalyst ahead|catalyst coming/i,'Before results / catalyst ahead','A real event (earnings, a contract decision) is coming up. There\'s a genuine reason for the price to move — but that also means real risk if the news disappoints.'],
  [/dips only|on.{0,3}dip|pullback/i,'Dips only','Only worth buying if the price drops back — don\'t pay today\'s price, wait for a cheaper entry.'],
  [/rich price|richly valued|expensive/i,'Rich price','Already trading above what it\'s normally worth — you\'d be paying a premium at today\'s price.'],
  [/cheap on good news|hasn.t caught up/i,'Cheap on good news','Good news already came out, but the price hasn\'t moved up to reflect it yet — the opportunity is the gap between the two.'],
  [/momentum/i,'Momentum','The price is already moving strongly in one direction — the theory is it keeps going, at least for a while.'],
  [/breakout/i,'Breakout','The price just pushed through a level it had struggled to get past before — often read as a bullish signal.'],
  [/get in|buy now/i,'Get in','Our system rates this a buy right now, at today\'s price.'],
  [/wait|too late/i,'Wait / too late','It already moved a lot — buying now means chasing a price that\'s run ahead of the news.'],
  [/great bank|quality (long|hold)/i,'Quality hold','A genuinely good business — the caution is about the PRICE you pay for it, not the company itself.']
];
function verdictExplainHtml(verdict){
  var v=String(verdict||''), hits=VERDICT_GLOSSARY.filter(function(g){return g[0].test(v);});
  if(!hits.length) return '<p style="font-size:13px;color:var(--muted);margin:0">This is our one-line verdict — the short version of the full "why this call" read below it on the card.</p>';
  return '<div class="sigdetail">'+hits.map(function(g){
    return '<div class="sigrow"><div class="sigrow-top"><b>'+esc(g[1])+'</b></div><div class="sigexplain">'+esc(g[2])+'</div></div>';
  }).join('')+'</div>';
}
function openVerdictExplain(verdict){
  LASTFOCUS=document.activeElement;
  var m=document.getElementById('modal'); m.className='modal';
  m.innerHTML='<div class="mhead"><button class="mclose" id="mClose" aria-label="Close">✕</button><div class="mtf">💬 In plain English</div>'+
    '<div class="mtop"><div class="msym" style="font-size:20px;line-height:1.2">'+esc(verdict)+'</div></div></div>'+
    '<div class="mbody">'+verdictExplainHtml(verdict)+'</div>';
  var ov=document.getElementById('overlay'); ov.classList.add('open'); ov.setAttribute('aria-hidden','false');
  document.getElementById('mClose').onclick=closeModal; document.getElementById('mClose').focus();
}

    (newsUrl?'<a href="'+esc(newsUrl)+'" target="_blank" rel="noopener">'+esc(news)+' ↗</a>':esc(news))+
    (age?'<span class="mnews-age">'+age+'</span>':'')+'</div>';

// #127 (9 Aug 2026) — the analyst card's 5 signal chips (Trend/RSI/Volatility/vs-20-day/52wk) were
// plain dead spans: no description of what the metric means, no diagram, no source, nothing happened
// on tap (user screenshot + explicit ask: "I want to see details, descriptions, sources"). This is
// the SAME class of gap signalRows() already solved for pick/candidate cards (#73/#83) — but the
// /analyst endpoint's a.signals is a flatter, differently-shaped payload (s.trend is a plain string,
// no s.bb/s.ema/s.relStrength exist here), so it needs its own row-builder rather than reusing
// signalRows() directly. Once built into the same {icon,label,tone,read,explain,diagram} shape,
// everything downstream (sigRowsHtml, SIG_CACHE, openSignalBreakdown, the global .sigsum listener)
// is reused as-is.
function analystSignalRows(a){
  var s=a.signals||{}, rows=[];
  if(s.trend){
    var up=/up/.test(s.trend), down=/down/.test(s.trend), tone=up?'pos':down?'neg':'mix', strong=s.adx!=null&&s.adx>=25;
    rows.push({icon:'📊',label:'Trend'+(s.adx!=null?' · ADX '+s.adx:''),tone:tone,
      read:s.trend.charAt(0).toUpperCase()+s.trend.slice(1),
      explain:'MACD shows direction, ADX shows trend strength — 25+ is a real trend, under 20 is choppy/no trend. Source: daily price history.',
      diagram:sigDiagTrend(tone,strong)});
  }
  if(s.rsi!=null){
    var tone=s.rsi>=70?'neg':s.rsi<=30?'pos':'mix';
    rows.push({icon:'🌡️',label:'RSI '+s.rsi,tone:tone,
      read:s.rsi>=70?'Overheated — wait for it to cool':s.rsi<=30?'Cheap — bargain zone':'Comfortable, not stretched',
      explain:'Momentum gauge, 0–100. Above 70 = overbought (often pulls back); below 30 = oversold (often bounces). Source: 14-day RSI off daily closes.',
      diagram:sigDiagRSI(s.rsi)});
  }
  if(s.atrPct!=null){
    var tone=s.atrPct>=4?'neg':s.atrPct<=1.5?'pos':'mix';
    rows.push({icon:'📶',label:'Volatility',tone:tone,
      read:'~'+s.atrPct+'% average daily swing',
      explain:'Average true range as a % of price — how much this name typically moves in a single day, up or down. Bigger swings mean bigger risk (and bigger potential reward) on any given trade. Source: recent daily high/low/close range.'});
  }
  if(s.ext20!=null){
    var tone=s.ext20>=15?'neg':s.ext20<=-5?'pos':'mix';
    rows.push({icon:'📏',label:'vs 20-day',tone:tone,
      read:(s.ext20>=0?'+':'')+s.ext20+'% vs its 20-day average',
      explain:'How far the price has run above (or below) its own recent average. 15%+ above usually means it’s extended and due to cool off; well below can mean it’s cheap, or that its recent story is bad. Source: 20-day simple moving average.'});
  }
  if(s.near52!=null){
    var pct=Math.round(s.near52*100), tone=pct>=95?'neg':pct<=70?'pos':'mix';
    rows.push({icon:'🏔️',label:'52-week range',tone:tone,
      read:pct+'% of the way to its 52-week high',
      explain:'Where the price sits between its 52-week low and high. Right at the top can mean real strength — or exactly the kind of overheated stretch that’s hardest to buy safely. Source: trailing 52 weeks of daily closes.'});
  }
  return rows;
}

function openUserGuide(){

     '<p class="sub">The key thing: <b>nothing is hand-picked.</b> A model ranks every candidate on the same evidence, so a pick earns its place — it isn’t someone’s hunch.</p></section>'+

     '<div class="dptier">'+
       '<div class="dpt t1"><h3>🛡️ Type 1 · Catalyst</h3><p>Backed by a real reason <b>today</b> — news, a deal, a result. The most grounded picks.</p></div>'+

     '</div>'+
     '<p class="sub">You choose which type you’re looking at with the T1 / T2 / T3 toggle. Same scoring model behind all three — just different ways of finding candidates.</p></section>'+
   '<section id="g-time"><h2><span class="dpn">3</span>Day, Week &amp; Month</h2>'+
     '<ul><li><b>⚡ Day</b> — act around <b>today</b>; only offered when there’s a fresh trigger the price hasn’t already run on.</li>'+

   '<section id="g-score"><h2><span class="dpn">4</span>The 🍊 score</h2>'+
     '<p>Every idea carries a <b>0–100 score</b> — the model’s honest read of how attractive it looks right now:</p>'+

   '<section id="g-signals"><h2><span class="dpn">5</span>The signals we read</h2>'+

function openExpertBrief(){
  var b=''+
   '<p class="dplede">A short methodology brief for someone who reads markets for a living. The Stock Soup is a systematic, evidence-weighted screen-and-score engine across ASX + US equities, with an open accountability loop. Sources are described by category, not vendor.</p>'+
   toc([['m-model','The scoring model'],['m-guard','Guardrails'],['m-nudge','Layered nudges'],['m-tiers','The three tiers'],['m-disc','Discovery'],['m-time','Timeframe routing'],['m-risk','Risk framework'],['m-acct','Accountability & learning'],['m-cad','Cadence & limits']])+
   '<section id="m-model"><h2><span class="dpn">1</span>The scoring model</h2>'+
     '<p>A <b>0–100 evidence-weighted score</b> across weighted factors: trend / proximity-to-52-week-high, catalyst &amp; news-sentiment, post-earnings-announcement drift (PEAD), analyst-revision breadth, volume expansion, and insider activity. Category weights <b>renormalise</b> when a factor has no data for a market (e.g. ASX carries no analyst-rating or earnings-surprise feed, so those categories are dropped and the remainder re-weighted rather than structurally capping the score). Bands: <b>Strong Buy-Now / Buy / Watch / Pass</b>.</p></section>'+

     '<li><b>Penalties</b> — LATE / already-priced-in entries, overbought RSI, elevated or fast-rising short interest, and capital raises.</li>'+
     '<li><b>Volume/ADX-aware softening</b> — a breakout confirmed by heavy volume and a rising trend isn’t punished as hard as an exhausted, low-conviction run.</li></ul></section>'+
   '<section id="m-nudge"><h2><span class="dpn">3</span>Layered nudges</h2>'+
     '<p>On top of the weighted factors, bounded adjustments for: MACD+ADX trend quality, Bollinger %B band pierces, relative strength vs the name’s own index, EMA20/50 confirmation, directional news-sentiment, a leading <b>credit/macro-regime</b> read, and a <b>pre-position bonus</b> for a known, dated upcoming catalyst.</p></section>'+

   '<section id="m-time"><h2><span class="dpn">6</span>Timeframe routing</h2>'+
     '<p><b>Day</b> requires a strict, fresh, not-yet-priced catalyst; <b>Week</b> is the default; the <b>monthly</b> slot is quality-tilted with tighter extension guards. This reflects a backtest in which the week horizon was the only positive-expectancy one and an unguarded monthly cohort was the weakest — so the routing is empirical, not stylistic.</p></section>'+

   '<section id="m-acct"><h2><span class="dpn">8</span>Accountability &amp; learning</h2>'+
     '<p>Every <b>served pick and the entire scored pot</b> are graded against the relevant index over each pick’s own horizon. A <b>per-session post-mortem</b> attributes each miss/dodge to the model’s own factor detail (e.g. “hard-excluded as extended” vs “no pre-scan signal — catalyst fired intraday”). Outcomes feed a weight-tuning loop, and every candidate’s feature vector + realised return is logged as the training set for a forthcoming learn-to-rank model that will <b>blend with, not replace,</b> the rules.</p></section>'+

function _timeHM(sec){ var d=new Date(sec*1000), h=d.getHours(), m=d.getMinutes(); var ap=h>=12?'pm':'am'; h=h%12; if(h===0)h=12; return h+':'+(m<10?'0':'')+m+ap; }
// Marker-aware sparkline: draws a dashed line + dot at markIdx (when we flagged the miss), so the
// chart reads as "here's what happened AFTER we checked", not a disconnected generic 24h window.
function missSparkSVG(vals,markIdx){
  var w=100,h=30,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1;
  var xy=vals.map(function(v,i){return [(i/(vals.length-1))*w,h-((v-mn)/rng)*(h-4)-2];});
  var poly=xy.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');
  var up=vals[vals.length-1]>=vals[0], last=xy[xy.length-1];
  var mark='';
  if(markIdx!=null&&markIdx>=0&&markIdx<xy.length){
    var mp=xy[markIdx];
    mark='<line x1="'+mp[0].toFixed(1)+'" y1="0" x2="'+mp[0].toFixed(1)+'" y2="'+h+'" class="mchk-line"/>'+
      '<circle cx="'+mp[0].toFixed(1)+'" cy="'+mp[1].toFixed(1)+'" r="2.4" class="mchk-dot"/>';
  }
  return '<svg class="spark '+(up?'up':'down')+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<polygon points="0,'+h+' '+poly+' '+w+','+h+'"/><polyline points="'+poly+'"/>'+mark+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.2"/></svg>';
}
function hydrateMissCharts(){
  document.querySelectorAll('.misschart[data-hydrate-chart]').forEach(function(slot){
    var sym=slot.dataset.sym, reg=slot.dataset.region, cur=slot.dataset.cur||'', checkTs=slot.dataset.checkTs?+slot.dataset.checkTs:null;
    fetch(API_BASE+'/intraday?sym='+encodeURIComponent(sym)+'&region='+encodeURIComponent(reg)).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j||!j.closes||j.closes.length<2){ slot.innerHTML=''; return; }
      var vals=j.closes, times=j.timestamps||[], mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
      var lastSec=times.length?times[times.length-1]:null;
      var markIdx=null;
      if(checkTs&&times.length){
        var target=Math.round(checkTs/1000);
        // Only draw the marker if the confirm/flag time actually falls within this chart's window
        // (with ~1h grace). A pick served days ago would otherwise clamp to the chart start and
        // mislabel it as "served 09:30" — better to show no marker than a wrong one. (#212)
        if(target>=times[0]-3600){
          var best=0, bestDiff=Infinity;
          times.forEach(function(t,i){ var diff=Math.abs(t-target); if(diff<bestDiff){bestDiff=diff;best=i;} });
          markIdx=best;
        }
      }
      var isLive=lastSec&&(Date.now()/1000-lastSec)<20*60;   // last bar is fresh → really "now"; else say when it's from
      var rightLbl=(isLive?'now':_timeHM(lastSec))+' '+cur+vals[vals.length-1].toFixed(2);
      var mlab=slot.dataset.markLabel||'flagged';   // #212 — pick cards mark "served", misses mark "flagged"
      // #220 — anchor the label at the marker line but keep it inside the chart: near the left edge it
      // extends right (transform none), near the right edge it extends left (translateX(-100%)), else centred.
      // A whole-integer left% also sat a touch off the line — use one decimal so label + line agree.
      var flagLbl='';
      if(markIdx!=null){
        var mpct=(markIdx/(vals.length-1))*100, tx=(mpct<15)?'0':(mpct>85)?'-100%':'-50%';
        flagLbl='<div class="misschart-flag" style="left:'+mpct.toFixed(1)+'%;transform:translateX('+tx+')">'+mlab+' '+_timeHM(times[markIdx])+'</div>';
      }
      slot.innerHTML='<div class="misschart-wrap">'+missSparkSVG(vals,markIdx)+flagLbl+'</div>'+
        '<div class="misschart-mm"><span>'+cur+mn.toFixed(2)+'</span><span class="misschart-now">'+rightLbl+'</span><span>'+cur+mx.toFixed(2)+'</span></div>';
    }).catch(function(){ slot.innerHTML=''; });
  });
}

function placeNeedle(id,lvl){
  var n=document.getElementById(id); if(!n) return;
  // #219 — keep the dot a hair inside the track ends so it never clips off the edge on a narrow screen
  n.style.left=Math.max(2.5,Math.min(97.5,lvl))+'%';

  var RC=lvl>=67?['#1fb862','rgba(31,184,98,.55)']:lvl>=34?['#f2a33d','rgba(242,163,61,.6)']:['#ff4d4d','rgba(255,77,77,.55)'];
  n.style.background=RC[0]; n.style.setProperty('--rcp',RC[1]);
}

var VILLAGER_MASCOTS=['🐷','🐢','🦁','🦊','🐸','🦉','🐨','🐙','🐝','🦄','🐻','🐰'];
function villagerMascot(sym){
  var h=0; for(var i=0;i<(sym||'').length;i++) h=(h*31+sym.charCodeAt(i))>>>0;
  return VILLAGER_MASCOTS[h%VILLAGER_MASCOTS.length];
}
function villagerSticker(p){
  var v=(p.verdict||'').toLowerCase();
  if(p.sym==='NONE') return {word:'ZZZ',cls:'v-zzz',emoji:'😴'};
  if(/wait|late|hold|skip|avoid|pass|don.t|steer/.test(v)) return {word:'NAH',cls:'v-nah',emoji:'🙅'};
  if(/get in|buy/.test(v)) return {word:'YUM!',cls:'v-yum',emoji:'🥣'};
  return {word:'HMM',cls:'v-hmm',emoji:'🤔'};
}
function villagerLine(p){
  if(p.sym==='NONE') return 'Nothing to serve here right now — check back soon! 👀';
  var v=(p.verdict||'').toLowerCase(), buy=/get in|buy/.test(v);
  if(buy&&p.rsi!=null&&p.rsi>=70) return 'On a hot streak — might need a little nap, but still tasty!';
  if(buy&&p.rsi!=null&&p.rsi<=35) return 'Total bargain right now — like a sale on your favourite snack!';
  if(buy) return 'Steady as she goes — quietly doing its thing.';
  return 'Sitting this one out for now — already had its big moment today.';
}
function villagerCard(p,rid,idx){

  if(p.sym==='NONE'){
    return '<article class="vcard vcard-zzz" tabindex="0" role="button" data-region="'+rid+'" data-idx="'+idx+'" aria-label="No pick this run"><div class="vmasc">😴</div><div class="vsticker '+s.cls+'">'+s.emoji+' '+s.word+'</div><div class="vline">'+esc(line)+'</div></article>';
  }
  return '<article class="vcard" tabindex="0" role="button" data-region="'+rid+'" data-idx="'+idx+'" aria-label="Details for '+esc(p.sym)+'">'+

  tfs.forEach(function(tf){ var p=picks.filter(function(x){return x&&(x.tf||'').indexOf(tf)>=0;})[0]; map[tf]=(p&&p.sym&&p.sym!=='NONE')?p:null; });

    .sort(function(a,b){ return (b.score.buy_now||0)-(a.score.buy_now||0); });

      '<span class="rtmeta"><b>'+esc(t.name)+'</b><small>'+esc(t.sub)+'</small></span><span class="rtgo">Request →</span></button>';
  }).join('');
  m.innerHTML='<div class="mhead"><button class="mclose" id="mClose" aria-label="Close">✕</button><div class="mtf">🍳 Trigger a run</div>'+
    '<div class="mtop"><div class="msym" style="font-size:19px">Kitchen controls <span class="adminbadge" style="vertical-align:middle">ADMIN</span></div></div></div>'+
    '<div class="mbody"><p class="mtake" style="margin-top:0">Pick which run to kick off. Each one is <b>queued</b> on the Run Schedule and marked <b>Manual</b> — it runs when a session next picks it up, not instantly (there\'s no 24/7 compute yet).</p>'+
    '<div class="runtriglist">'+rows+'</div></div>';
  document.getElementById('mClose').onclick=closeModal;
  m.querySelectorAll('.runtrigrow').forEach(function(b){ b.onclick=function(){requestRun(b.dataset.rt,b);}; });
  var ov=document.getElementById('overlay'); ov.classList.add('open'); ov.setAttribute('aria-hidden','false');
  document.getElementById('mClose').focus();
}
function requestRun(runType,btn){
  if(btn){ btn.classList.add('spinning'); btn.disabled=true; }
  var label=(RUN_TRIGGER_TYPES.find(function(t){return t.rt===runType;})||{}).name||'Run';
  fetch(API_BASE+'/me/request-run',{method:'POST',headers:apiHdr(),body:JSON.stringify({runType:runType})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(btn){ btn.classList.remove('spinning'); btn.disabled=false; }
      if(res.ok&&res.j.ok){
        closeModal();
        flashToast('🍳 <b>'+esc(label)+'</b> requested — queued on the Run Schedule as <b>Manual</b>.<br><span style="opacity:.7;font-weight:600">Runs when a session next picks it up, not instantly — no 24/7 compute yet.</span>');
        refreshPrices();
      } else if(res.j&&res.j.error){
        flashToast('Couldn\'t queue it: '+esc(res.j.error));
      } else {
        flashToast('Couldn\'t reach the server — try again shortly.');
      }
    }).catch(function(){ if(btn){ btn.classList.remove('spinning'); btn.disabled=false; } flashToast('Couldn\'t reach the server — try again shortly.'); });
}
// capture the magic-link session handed back in the redirect hash (#session=…), then sync the list
(function(){var m=(location.hash||'').match(/session=([^&]+)/);if(m){sessSet(decodeURIComponent(m[1]));try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}})();
if(signedIn()) syncFromBackend(function(){ if(document.getElementById('wlPills')){renderWatchlist();syncWatchButtons();} });
// The picks bundle is members-only — fetched from the Worker with the session token, never a public file.
function loadGated(cb){
  fetch(API_BASE+'/data',{headers:{'Authorization':'Bearer '+sessGet()},cache:'no-store'})
    .then(function(r){ if(r.status===401){ sessSet(''); location.replace('index.html'); throw 0; } return r.ok?r.json():null; })
    .then(function(b){ cb(b||null); }).catch(function(){ cb(null); });
}
function applyBundle(b){
  if(!b) return false;
  var d=b.latest, h=b.menuHistory, pu=b.pulseHistory, tr=b.trackRecord, oc=b.outcomes;
  if(pu&&pu.pulses&&pu.pulses.length>1) PULSES=pu.pulses;
  if(tr&&tr.record) TRACK=tr;
  if(oc&&oc.outcomes) OUTCOMES=oc;
  RUNNING=b.running||null; RUNLOG=b.runLog||[];
  if((d&&d.regions)||(h&&h.menus)||PULSES||TRACK||OUTCOMES){
    // Wrap boot() so a render throw can't be silently swallowed by loadGated's .catch — that turned a
    // single malformed field (hotTags as a list, 10 Aug 2026) into a blank page with ZERO signal, which
    // is what made it so hard to diagnose. Now it at least screams in the console, and we keep whatever
    // was on screen rather than pretending the load simply "returned nothing".
    try{ boot(d&&d.regions?d:EMBEDDED, h&&h.menus?h:HIST_EMBED); watchRun(); return true; }
    catch(err){ console.error('applyBundle: render threw — the page could not update with fresh data:', err); return false; }
  }
  return false;
}
// While a run is cooking, quietly re-poll /data so the finished menu (and its cleared marker) appears on its own.
var _runPoll=null;
function watchRun(){
  if(_runPoll){clearTimeout(_runPoll);_runPoll=null;}
  if(!RUNNING||!RUNNING.startedAt) return;
  var age=Date.now()-new Date(RUNNING.startedAt).getTime();
  if(age>25*60*1000){ RUNNING=null; return; }        // stale marker — stop watching
  _runPoll=setTimeout(function(){
    var sc=window.pageYOffset;                        // preserve scroll — a full re-render must never jump you to the top
    loadGated(function(b){ if(b) applyBundle(b); window.scrollTo(0,sc); });
  }, 40000);
}
boot(EMBEDDED,HIST_EMBED);
loadGated(applyBundle);
</script>
