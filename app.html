<meta charset="utf-8">
<title>The Stock Soup — Tonight's Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,800&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#14100E; --surface:#1E1815; --surface-2:#271F1A; --line:#3A2F27;
    --broth:#FF6B1A; --buy:#23C267; --dont:#FF4D4D; --hold:#FFC53D;
    --ink:#F4EDE4; --muted:#A69A8C; --faint:#6E6154;
    --shadow:0 12px 40px -12px rgba(0,0,0,.7);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --disp:"Fraunces",Georgia,"Times New Roman",serif;
  }
  @media (prefers-color-scheme:light){
    :root{ --ground:#FBF6EF; --surface:#FFFFFF; --surface-2:#F3EADF; --line:#E4D7C6;
      --ink:#1E1815; --muted:#7A6C5C; --faint:#A99A88; --shadow:0 12px 40px -16px rgba(80,50,20,.25); }
  }
  :root[data-theme="dark"]{ --ground:#14100E; --surface:#1E1815; --surface-2:#271F1A; --line:#3A2F27;
    --ink:#F4EDE4; --muted:#A69A8C; --faint:#6E6154; --shadow:0 12px 40px -12px rgba(0,0,0,.7); }
  :root[data-theme="light"]{ --ground:#FBF6EF; --surface:#FFFFFF; --surface-2:#F3EADF; --line:#E4D7C6;
    --ink:#1E1815; --muted:#7A6C5C; --faint:#A99A88; --shadow:0 12px 40px -16px rgba(80,50,20,.25); }

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ground);color:var(--ink);font-family:var(--font);line-height:1.5;
    -webkit-font-smoothing:antialiased;padding:clamp(14px,3vw,40px)}
  .wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  .display{font-family:var(--disp);font-weight:900;letter-spacing:-.02em;text-wrap:balance;line-height:.98;text-transform:uppercase}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a.q{color:inherit;text-decoration:none;border-bottom:1px dotted transparent}
  a.q:hover{color:var(--broth);border-bottom-color:var(--broth)}
  a.q:focus-visible{outline:2px solid var(--broth);outline-offset:2px;border-radius:2px}

  /* #140: .hero only ever holds the compact brand row + market toggle — the rich Menu-tab headline/
     chef/meter actually lives in #tab-menu's own .tabhead.menuhead below it, not in here. .hero is
     also the ONE persistent header shown above every tab, so its old clamp(20px,3.5vw,38px) padding
     (up to 38px on all sides around just a brand row) read as an oversized, mostly-empty header on
     the lighter tabs (Reviews/Faves/Kitchen), whose own .tabhead is a much tighter 16px. Original
     diagnosis here was wrong about the mechanism (blamed the other tabs' own headers reusing this
     padding — they don't, they use .tabhead) but right that .hero itself was too generous for what
     it actually contains on every tab, not just the light ones. */
  .hero{background:radial-gradient(120% 140% at 100% 0%, rgba(255,107,26,.16), transparent 55%),var(--surface);
    border:1px solid var(--line);border-radius:20px;padding:clamp(14px,2.4vw,26px);position:relative;overflow:hidden}
  .brandrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-style:italic;font-weight:800;font-size:21px;letter-spacing:-.01em}
  .hpot{position:relative;display:inline-flex;font-size:24px;line-height:1;animation:hbob 4.2s ease-in-out infinite;transform-origin:50% 90%}
  .hpotbowl{filter:drop-shadow(0 4px 6px rgba(225,77,11,.3))}
  .hsteam{position:absolute;left:50%;top:-7px;transform:translateX(-50%);width:20px;height:14px;pointer-events:none}
  .hsteam i{position:absolute;bottom:0;width:3px;height:12px;border-radius:50%;background:linear-gradient(to top,rgba(255,180,120,0),rgba(255,190,130,.85));filter:blur(1.6px);opacity:0;animation:hsteam 3s ease-in-out infinite}
  .hsteam i:nth-child(1){left:4px;animation-delay:0s}
  .hsteam i:nth-child(2){left:9px;height:15px;animation-delay:.65s}
  .hsteam i:nth-child(3){left:14px;animation-delay:1.3s}
  @keyframes hsteam{0%{opacity:0;transform:translateY(3px) scaleX(1)}30%{opacity:.8}60%{transform:translateY(-8px) scaleX(1.4)}100%{opacity:0;transform:translateY(-15px) scaleX(.7)}}
  @keyframes hbob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2.5px) rotate(2deg)}}
  @media (prefers-reduced-motion:reduce){.hpot{animation:none}.hsteam{display:none}}
  .bowl{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 200deg,var(--broth),#FFB061,var(--broth));
    display:grid;place-items:center;font-size:20px;box-shadow:0 0 24px -4px var(--broth)}
  .live{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--buy);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(35,194,103,.55)}70%{box-shadow:0 0 0 8px rgba(35,194,103,0)}100%{box-shadow:0 0 0 0 rgba(35,194,103,0)}}
  .hero h1,.menuhead h1{font-size:clamp(34px,7vw,68px);margin:14px 0 6px}
  .hero h1 .hot,.menuhead h1 .hot{color:var(--broth)}
  .chef{font-size:clamp(15px,2.2vw,19px);color:var(--muted);max-width:60ch;text-wrap:pretty}
  .chef b{color:var(--ink)}
  .metastrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .chip{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
  /* #135: this now carries a full sentence, not a short label. Real bug (9 Aug 2026, user screenshot):
     .chip sets white-space:nowrap AFTER this rule in source order, so on equal specificity it won,
     forcing the button to never wrap and overflow the screen edge — button.mktheadline raises the
     specificity so this wins instead, regardless of source order. min-width:0 is the actual flexbox
     fix (a flex item's default min-width:auto refuses to shrink below its unwrapped text width,
     which is what was truly pushing it off-screen even with white-space set correctly). Also sets
     color explicitly rather than trusting inheritance, after the same bug showed the text rendering
     in an unintended blue.*/
  button.mktheadline{border-radius:14px;font-size:13.5px;font-weight:700;text-align:left;white-space:normal;
    line-height:1.4;padding:9px 13px;max-width:100%;min-width:0;flex:1 1 auto;box-sizing:border-box;color:var(--ink)}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .toggle{cursor:pointer;font-family:var(--font);color:var(--ink)}
  .toggle:focus-visible{outline:2px solid var(--broth);outline-offset:2px}
  .meter{margin-top:28px}  /* #174 — extra top room so the per-indicator emoji labels above the track don't crowd the row above */
  .meter.tappable{cursor:pointer;border-radius:12px;padding:4px 8px 6px;margin-left:-8px;margin-right:-8px;transition:background .12s}   /* #197 — tap the whole meter → tonight's read */
  .meter.tappable:hover{background:var(--surface-2)}
  .meter.tappable:focus-visible{outline:2px solid var(--broth);outline-offset:2px}
  .metertap{text-align:center;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-top:10px}
  .meter .track{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--dont),var(--hold),var(--buy));position:relative;opacity:.9}
  /* #184 — the composite "now" reading is a good-sized round black dot (was a thin vertical line),
     labelled "Risk", with a gentle pulse so it clearly reads as the live overall reading vs the small
     per-indicator emoji ticks above the track. */
  .meter .needle{--rs:15px;position:absolute;top:-7px;width:24px;height:24px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--surface);left:50%;transform:translateX(-50%);transition:left .8s cubic-bezier(.2,.8,.2,1);z-index:4;animation:riskpulse 2.4s ease-out infinite}
  .meter .needle::after{content:"Risk";position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;letter-spacing:.03em;color:var(--ink);background:var(--surface);padding:0 4px;border-radius:4px;white-space:nowrap}
  @keyframes riskpulse{0%{box-shadow:0 0 0 3px var(--surface),0 0 0 3px var(--rcp,rgba(120,120,120,.35))}70%{box-shadow:0 0 0 3px var(--surface),0 0 0 var(--rs) rgba(120,120,120,0)}100%{box-shadow:0 0 0 3px var(--surface),0 0 0 3px rgba(120,120,120,0)}}
  @media(prefers-reduced-motion:reduce){.meter .needle{animation:none}}
  /* #219 — on a narrow phone the 24px dot + big halo read as oversized/jittery; scale both down so the
     pulse stays a tasteful accent, not the loudest thing on the row. */
  @media(max-width:560px){ .meter .needle{--rs:9px;width:19px;height:19px;top:-4.5px;box-shadow:0 0 0 2.5px var(--surface)} .meter .needle::after{top:calc(100% + 2px)} }
  .meter .lbls{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:20px;font-weight:800}
  .meterleg{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:10.5px;font-weight:700;color:var(--muted)}
  .meterleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .meterleg i.ink{background:var(--ink)} .meterleg i.vix{background:#9b6bff}
  /* #174 — per-indicator markers on the risk line (was just Risk + VIX). Each of the 5 composite
     inputs gets a tick at its own 0-100 sub-score WITH its emoji sitting right above it, so you can
     tell which is which on the line itself (not just in the legend). Plus an emoji+score legend below. */
  .factormark{position:absolute;top:0;bottom:0;width:0;transform:translateX(-50%);pointer-events:none}
  .factormark::after{content:'';position:absolute;top:-3px;bottom:-3px;left:0;width:2px;transform:translateX(-50%);border-radius:1px;background:var(--ink);opacity:.55}
  .factormark .fmi{position:absolute;top:-22px;left:0;transform:translateX(-50%);font-size:18px;line-height:1;white-space:nowrap}
  .factorleg{display:flex;flex-wrap:wrap;gap:9px 18px;justify-content:center;margin-top:12px;font-size:13.5px;font-weight:700;color:var(--muted)}
  .factorleg span{white-space:nowrap;display:inline-flex;align-items:center;gap:5px} .factorleg b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:800}
  .tagword{opacity:.7;font-weight:700}

  .pulsebar{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--broth);border-radius:14px;padding:14px 16px}
  .pulsebar .ph{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .pdot{width:8px;height:8px;border-radius:50%;background:var(--broth);animation:pulse 2.4s infinite}
  .psynth{font-size:14.5px;line-height:1.5;text-wrap:pretty;color:var(--muted)}
  .celastcheck{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;font-weight:700;color:var(--muted)}
  .psynth b{color:var(--ink)}
  .pmovers{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
  .pmv{font-size:12px;font-weight:800;font-family:var(--mono);padding:3px 9px;border-radius:7px;background:var(--surface-2)}
  .pmv.up{color:var(--buy)} .pmv.down{color:var(--dont)}
  .cenv{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
  @media(max-width:760px){.cenv{grid-template-columns:1fr}}
  .cetraj,.ceprox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
  .ceh{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .cechartwrap{position:relative;padding-right:52px}
  .cechart{width:100%;height:120px;display:block}
  .celab{position:absolute;right:0;transform:translateY(-50%);font-size:11.5px;font-weight:900;white-space:nowrap;letter-spacing:.02em}
  .ceflat{text-align:right;font-size:10.5px;font-weight:800;color:var(--muted);margin-top:7px;padding-right:6px;letter-spacing:.02em}
  .celegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;font-weight:700}
  .celeg{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
  .celeg i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .celeg b.up{color:var(--buy)} .celeg b.down{color:var(--dont)}
  .proxrow{display:flex;align-items:center;gap:10px;padding:6px 0}
  .pxs{font-weight:800;font-size:13px;flex:0 0 auto;min-width:120px;display:flex;gap:6px;align-items:baseline}
  .proxbar{flex:1;position:relative;height:8px;border-radius:999px;background:var(--surface-2)}
  .proxzone{position:absolute;left:0;top:0;bottom:0;width:19%;background:rgba(35,194,103,.32);border-radius:999px}
  .proxnow{position:absolute;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
  .pxg{min-width:78px;display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums}
  .pxnow{font-size:13px;font-weight:800;color:var(--ink)}
  .s-in .pxnow,.s-near .pxnow{color:var(--buy)} .s-close .pxnow{color:var(--hold)}
  .pxbuy{font-size:11px;font-weight:700;color:var(--muted)}
  .pxst{font-size:10px;font-weight:800;color:var(--muted)}
  .s-in .proxnow,.s-near .proxnow{background:var(--buy)} .s-in .pxst,.s-near .pxst{color:var(--buy)}
  .s-close .proxnow{background:var(--hold)} .s-close .pxst{color:var(--hold)}
  .s-wait .proxnow{background:var(--faint)}
  .proxpct{position:absolute;bottom:14px;transform:translateX(-50%);font-size:10px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
  .s-in .proxpct,.s-near .proxpct{color:var(--buy)} .s-close .proxpct{color:var(--hold)} .s-wait .proxpct{color:var(--muted)}
  .proxkey{font-size:10px;color:var(--faint);margin-top:10px}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:2px}
  .clickchip{cursor:pointer;transition:box-shadow .12s,transform .1s}
  .clickchip:hover{box-shadow:0 0 0 1.5px var(--broth) inset} .clickchip:active{transform:scale(.98)}
  .chipi{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid currentColor;opacity:.55;font-family:Georgia,serif;font-style:italic;font-size:9px;font-weight:700;margin-left:3px}
  .lastupd{background:none;border:0;color:var(--muted);font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;padding:0 2px;white-space:nowrap}
  .lastupd:hover{color:var(--broth)}
  .refreshbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:15px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .signinbtn{background:var(--broth);color:#fff;border:0;font-weight:800;font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .signinbtn:hover{filter:brightness(1.05)}
  .refreshbtn:hover{border-color:var(--broth);color:var(--broth)}
  .refreshbtn.spinning{animation:spin .8s linear infinite;color:var(--broth)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);font-family:var(--font);font-weight:700;font-size:13px;line-height:1.4;padding:11px 18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.28);z-index:9999;opacity:0;transition:opacity .25s,transform .25s;max-width:82vw;text-align:center;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .infobtn{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);background:none;color:var(--muted);font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:12px;line-height:1;cursor:pointer;align-self:center;transition:border-color .12s,color .12s}
  .infobtn:hover{border-color:var(--broth);color:var(--broth)}
  .mktbar{display:flex;gap:8px;margin:16px 0 2px;flex-wrap:wrap}
  .mktflags{display:inline-flex;gap:11px;align-items:center}
  .mkf{position:relative;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:17px;line-height:1;padding:0;opacity:.5;transition:opacity .15s,transform .15s,box-shadow .3s}
  .mkf:hover{opacity:.85}
  .mkf.active{opacity:1;transform:scale(1.06)}
  .mkf.active{transform:scale(1.12)}
  .mkf.phase-closed{box-shadow:0 0 0 2px rgba(255,77,77,.55)}
  .mkf.phase-open{box-shadow:0 0 0 2px var(--buy)}
  .mkf.phase-opening{box-shadow:0 0 0 2px var(--buy);animation:mkpulseG 1.5s ease-in-out infinite}
  .mkf.phase-closing{box-shadow:0 0 0 2px var(--hold);animation:mkpulseO 1.5s ease-in-out infinite}
  @keyframes mkpulseG{0%,100%{box-shadow:0 0 0 2px var(--buy)}50%{box-shadow:0 0 0 6px rgba(35,194,103,.30)}}
  @keyframes mkpulseO{0%,100%{box-shadow:0 0 0 2px var(--hold)}50%{box-shadow:0 0 0 6px rgba(255,197,61,.32)}}
  @media (prefers-reduced-motion:reduce){.mkf.phase-opening,.mkf.phase-closing{animation:none}}
  .mktwrap{position:relative;display:inline-flex;align-items:center}
  .mktcap{margin-left:10px;font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap;letter-spacing:.02em;line-height:1;pointer-events:none}
  .toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}
  .mktcap.mc-open,.mktcap.mc-opening{color:var(--buy)} .mktcap.mc-closing{color:var(--hold)} .mktcap.mc-closed{color:var(--dont)}
  .toprail{display:flex;gap:12px;align-items:center}
  .burgerwrap{position:relative}
  .burger{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .burger:hover{border-color:var(--broth)}
  /* #174 (10 Aug 2026, user ask) — a round Full/Simple toggle icon next to the burger, surfacing the
     view switch that was buried in the burger menu. Same 38px footprint as the burger, round. */
  .viewtoggle{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface-2);font-size:17px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;margin-right:7px}
  .viewtoggle:hover{border-color:var(--broth)}
  .burgermenu{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:7px;min-width:214px;max-width:calc(100vw - 24px);display:flex;flex-direction:column;gap:1px}
  .burgermenu[hidden]{display:none}
  .bmhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 9px 9px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .bmadmin{display:flex;align-items:center;gap:7px;padding:6px 11px;font-size:11px;font-weight:700;color:var(--muted)}   /* #203 — ADMIN badge relocated from header into the burger */
  .bmupd{border:0;background:transparent;color:var(--muted);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;padding:0}
  .bmupd:hover{color:var(--broth)}
  .bmitem{display:flex;align-items:center;gap:9px;text-align:left;width:100%;border:0;background:transparent;color:var(--ink);font-family:var(--font);font-size:14px;font-weight:700;padding:10px 9px;border-radius:9px;cursor:pointer}
  .bmitem:hover{background:var(--surface-2)}
  .tabhead{padding:16px 0 4px;margin-bottom:6px;border-bottom:1px solid var(--line)}
  .tabhead .theyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--broth);margin-bottom:9px}
  .tabhead .thead{font-size:clamp(23px,5vw,36px);line-height:1.04;letter-spacing:-.01em;margin:0 0 9px;text-wrap:balance}
  .tabhead .tsub{font-size:14px;color:var(--muted);line-height:1.5;margin:0 0 13px;max-width:62ch}
  .tabhead .tsub b{color:var(--ink)}
  /* #155 (user ask, caught via screenshot — a ragged pill-wrap of uneven widths) — a clean, evenly
     gridded "kanban card" layout instead: fixed 2-up on narrow screens (no more one lone pill per
     row just because its text happened to be long), more columns as space allows. */
  .tabstats{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .wrow{display:flex;flex-direction:column;gap:7px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--faint);border-radius:12px;padding:12px 13px;height:100%;min-width:0}

function marketStatus(region){
  // #96 — real holiday awareness first: pure time-of-day math can't know a Monday is Australia Day.
  var ms=(LAST&&LAST.D&&LAST.D.marketStatus)||null, hs=ms&&ms[region];
  if(hs&&hs.holiday) return {phase:'closed',open:false,txt:(region==='au'?'ASX':'US')+' closed · '+(hs.holidayName||'public holiday')};
  var d=new Date(), day=d.getDay(), h=d.getHours()+d.getMinutes()/60, wd=day>=1&&day<=5;
  function mins(to){return Math.max(1,Math.round((to-h)*60));}
  if(region==='au'){
    if(!wd) return {phase:'closed',open:false,txt:'ASX closed · weekend'};
    if(h>=10&&h<16) return h>=15?{phase:'closing',open:true,txt:'ASX closes in '+mins(16)+'m'}:{phase:'open',open:true,txt:'ASX open now'};
    if(h>=9&&h<10) return {phase:'opening',open:false,txt:'ASX opens in '+mins(10)+'m'};
    if(h<9) return {phase:'closed',open:false,txt:'ASX opens in '+Math.round(10-h)+'h'};
    return {phase:'closed',open:false,txt:'ASX closed for the day'};
  }
  // US markets, converted to AEST (~23:30 → 06:00 next day). #159 fix (real bug, caught live on a
  // Sunday evening — showed "US opens in 53m"): this used to be pure hour-of-day math with NO
  // day-of-week check at all, unlike the ASX branch above. Because the US session crosses midnight
  // AEST, the evening portion (>=22.5, still today) represents TODAY's session about to start, but
  // the early-morning portion (<6, already tomorrow) represents the TAIL END of YESTERDAY's session
  // — each needs the right day checked, not just "today."
  var yestWd=((day+6)%7)>=1&&((day+6)%7)<=5;
  if(h>=23.5||h<6){
    if(!(h<6?yestWd:wd)) return {phase:'closed',open:false,txt:'US closed · weekend'};
    return (h>=5&&h<6)?{phase:'closing',open:true,txt:'US closes in '+mins(6)+'m'}:{phase:'open',open:true,txt:'US open now'};
  }
  if(h>=22.5&&h<23.5){
    if(!wd) return {phase:'closed',open:false,txt:'US closed · weekend'};
    return {phase:'opening',open:false,txt:'US opens in '+mins(23.5)+'m'};
  }
  return {phase:'closed',open:false,txt:wd?'US opens tonight':'US closed · weekend'};
}

// #192 — split the movers into two honest buckets:
//   • "got away"  = big movers that were NEVER in our net (status 'missed') — a coverage gap.
//   • "wrong way" = movers that WERE in our net (scanned or served) but we didn't act on / didn't
//                   call the direction — we saw it, but didn't capitalise.
function _missRows(mi, tfLabel){
  var mktRows=(mi&&mi.rows||[]).filter(function(r){return (r.region||'us')===MKT;});
  // #225 — a big mover never in our net only "got away" if it went UP (missed upside). A big FALLER we
  // never touched isn't a miss — it's a dodge (good we weren't in it). Split the two so a −25% loser
  // stops being counted/labelled as a missed opportunity.
  var _pct=function(r){return (r.pct!=null?r.pct:(r.change!=null?r.change:0));};
  var away=mktRows.filter(function(r){return r.status==='missed' && _pct(r)>=0;});
  var dodged=mktRows.filter(function(r){return r.status==='missed' && _pct(r)<0;});
  var wrong=mktRows.filter(function(r){return r.status==='served'||r.status==='scanned';});
  var render=function(r){return _missRow(r, mi, tfLabel);};
  return {awayRows:away.map(render).join(''), wrongRows:wrong.map(render).join(''), dodgedRows:dodged.map(render).join(''),

function signalSummary(rows){

function holdingAction(sym,region,D){

// #143 (user ask, scoped 9 Aug 2026): "how easily can we build a bargain alert — cheap, no real
// negative indicators right now." Answer: no pipeline change needed — score_candidates() (score-pot.py)
// already computes every field this needs onto every candidate (rsi, bb.bb_pctb, ema.above_ema20/50,
// score.detail.penalty_detail, score.detail.hard_excluded, news_sentiment via pulse.py's CAND_PULSE_FIELDS
// merge). This is a pure display-side filter over already-published data — real thresholds, not a
// vague vibe: genuinely oversold (RSI<=40 AND pierced/near the lower Bollinger band), NOT in a
// structural downtrend (must be above at least one of its 20/50-day EMAs — below both is a falling
// knife, not a bargain), no active harsh penalty (capital raise / insider selling / stale or
// already-priced-in catalyst), not hard-excluded, and news isn't actively negative.
function isBargain(c){
  if(!c||!c.score) return false;
  var d=c.score.detail||{};
  if(d.hard_excluded) return false;
  if(c.rsi==null||c.rsi>40) return false;
  var bb=c.bb&&c.bb.bb_pctb;
  if(bb==null||bb>=0.3) return false;
  var e=c.ema||{};
  if(e.above_ema20===false&&e.above_ema50===false) return false;
  var harsh=(d.penalty_detail||[]).filter(function(p){return /capital.raise|insider|stale|priced.in/i.test((p.k||'')+' '+(p.why||''));});
  if(harsh.length) return false;
  if(c.news_sentiment!=null&&c.news_sentiment<-0.1) return false;
  return true;
}

  news:{ic:'📣',what:'A real-world EVENT that gives a fresh reason to move — this is the catalyst.',makeup:'A contract win, earnings beat, analyst upgrade or a price-sensitive announcement, weighted by how fresh it is and whether the price has already jumped on it. <b>Catalyst vs signal:</b> a catalyst is something that HAPPENED (news, a deal) — a reason to move; a signal is a technical read of the chart (RSI, trend, volatility) — the stock’s current state. A strong, fresh catalyst is what lets a name score high even when the short-term signals are mixed.'},

// Verdict-pill glossary (#82) — the one-line verdict ("Accumulate before results", "Great bank, rich
// price — dips only") is punchy on purpose, but punchy reads as jargon if you don't already trade.
// Verdicts are free text (a different phrase per pick, not a fixed list), so this can't be one lookup
// per phrase — instead it's a small vocabulary of the actual trading terms that keep showing up,
// matched against whatever phrase this pick happens to use. Scales to any future verdict for free.
var VERDICT_GLOSSARY=[
  [/accumulate/i,'Accumulate','Buy gradually, a bit at a time, instead of all in one go.'],
  [/before results|ahead of the number|catalyst ahead|catalyst coming/i,'Before results / catalyst ahead','A real event (earnings, a contract decision) is coming up. There\'s a genuine reason for the price to move — but that also means real risk if the news disappoints.'],
  [/dips only|on.{0,3}dip|pullback/i,'Dips only','Only worth buying if the price drops back — don\'t pay today\'s price, wait for a cheaper entry.'],
  [/rich price|richly valued|expensive/i,'Rich price','Already trading above what it\'s normally worth — you\'d be paying a premium at today\'s price.'],
  [/cheap on good news|hasn.t caught up/i,'Cheap on good news','Good news already came out, but the price hasn\'t moved up to reflect it yet — the opportunity is the gap between the two.'],
  [/momentum/i,'Momentum','The price is already moving strongly in one direction — the theory is it keeps going, at least for a while.'],
  [/breakout/i,'Breakout','The price just pushed through a level it had struggled to get past before — often read as a bullish signal.'],
  [/get in|buy now/i,'Get in','Our system rates this a buy right now, at today\'s price.'],
  [/wait|too late/i,'Wait / too late','It already moved a lot — buying now means chasing a price that\'s run ahead of the news.'],
  [/great bank|quality (long|hold)/i,'Quality hold','A genuinely good business — the caution is about the PRICE you pay for it, not the company itself.']
];

    return '<div class="sigrow"><div class="sigrow-top"><b>'+esc(g[1])+'</b></div><div class="sigexplain">'+esc(g[2])+'</div></div>';
  }).join('')+'</div>';

    '<p>Sets which of your own picks get flagged as riskier than you\'d like — every pick still shows, nothing\'s hidden, this just adds a ⚠️ note where it applies.</p>'+
    '<h4>How risk is measured</h4><p>Real volatility and price-extension signals — daily ATR% (typical swing), penny/micro price level, how stretched the RSI is, and whether the model itself already flagged the stock as overextended. <b>Not market cap</b> — this app has no data source for that, so it isn\'t faked.</p>'+
    '<ul class="infoul"><li>🛡️ <b>Low</b> tolerance — flags anything above Low risk.</li><li>⚖️ <b>Balanced</b> (default) — flags High and Speculative only.</li><li>🎢 <b>High</b> tolerance — nothing gets flagged, you\'ve told us you\'re fine with volatility.</li></ul>'+
    '<p class="infofoot">Tap the 🎢 risk-tier row on any card\'s signal breakdown to see exactly why it\'s classed the way it is.</p>'},
  actions:{icon:'🎯',title:'How the actions engine works',body:
    '<p>“Ready right now” is the sharp end — the tickers where <b>three things line up at once</b>:</p>'+
    '<ul class="infoul"><li><b>Sensible</b> — our model rates it a buy on a <i>real catalyst</i> (earnings beat, analyst upgrade, confirmed news), not just chart momentum.</li>'+
    '<li><b>Signalling</b> — the trend &amp; news point the right way, and it isn\'t overheated (not too extended, not risk-off).</li>'+
    '<li><b>At your price</b> — it\'s trading at or below the <b>ideal-buy</b> zone we\'ve been waiting for (within ~1.5%).</li></ul>'+
    '<p>Only picks that clear <i>all three</i> appear here, ranked by how close they sit to your ideal buy, capped at the top 3 so it stays a shortlist.</p>'+
    '<h4>🌅 The timing verdict</h4><p>Each tells you <b>whether to place a night-before order or wait</b>: we measure how much of the stock\'s daily move happens at the open vs during the day. <i>“Gets away at the open”</i> → set a limit tonight; <i>“no rush”</i> → watch it and buy in the session.</p>'+
    '<h4>📦 Your holdings</h4><p>Mark what you own (📦) and this block also says what to <b>do with it</b>: <b>take profit</b> (hit our target), <b>reassess</b> (thesis cooled or a sharp drop), or <b>hold</b> (still on track).</p>'+
    '<p class="infofoot">It re-checks every hour as prices move. Nothing here is a recommendation to trade — it\'s our read; the call is yours.</p>'},
  watchlist:{icon:'⭐',title:'Your Watchlist',body:
    '<p><b>Your personal shortlist</b> — stocks you want the Chef to keep an eye on. Add any ticker below, or tap <b>＋ Watch</b> on any pick to track it with its ideal-buy price remembered.</p>'+
    '<h4>What makes it smart</h4><p>For anything we already analyse, each card carries a live read:</p>'+
    '<ul class="infoul"><li><b>🎯 Buy zone</b> — the ideal price to buy: a pullback toward its recent average, or its current price if already cheap.</li>'+
    '<li><b>Target</b> — a realistic upside: its 52-week high, or +12% if it\'s already near it.</li>'+
    '<li><b>Score / verdict</b> — our Buy-Now read. US names get the full model score; ASX names get a technical trend read (uptrend, RSI, distance to high) until we add ASX analyst data.</li>'+
    '<li><b>Status + alert</b> — how far today\'s price is from your buy zone, with a 🎯 flag the moment it hits it.</li></ul>'+
    '<h4>The honest limits</h4><p>It\'s saved in <b>this browser only</b> (no account yet), and we can fully assess only tickers that pass through our scan or the shared watchlist. Assessing <i>anything</i> you type, on any device, with push reminders, needs sign-in — that\'s on the roadmap.</p>'+
    '<p class="infofoot">No black box: every number comes from live market data and the same engine behind the recommendation cards.</p>'},
  schedule:{icon:'⏱️',title:'The run schedule',body:
    '<p>The Stock Soup runs on two clocks — one heavy, one light.</p>'+
    '<div class="callout" style="margin:10px 0 16px">⚠️ <b>Major runs fire automatically on a schedule now</b> — 4 times a day, at the target windows below. The one durability gap: it\'s currently a <b>session-scoped</b> schedule (runs while the pipeline\'s coding session stays open; a fully persistent, reboot-proof version is still on the roadmap), so a run can occasionally slip if that session isn\'t live. Ask any time regardless and a fresh menu gets cooked on demand.</div>'+
    '<h4>🍳 Major runs — a fresh menu</h4><p>The full re-cook: re-scan the market (all 4 discovery nets), re-score every candidate through the real model, pick 6 new stocks. This is what advances <b>The Journey</b>. Aimed at <b>~30 minutes before each market opens</b>, so the menu is fresh when you can act:</p>'+
    '<ul class="infoul"><li>🇦🇺 <b>~09:00 AEST</b> — before the ASX opens (10:00).</li>'+
    '<li>☀️ <b>~12:00 AEST</b> — a midday check while the ASX trades.</li>'+
    '<li>🌆 <b>~16:00 AEST</b> — late-arvo re-scan, catches ASX-close and pre-US-evening moves.</li>'+
    '<li>🇺🇸 <b>~22:45 AEST</b> — before the US opens (9:30am New York).</li></ul>'+
    '<h4>⏱️ Minor runs — a re-price</h4><p>Every 10 minutes during AU awake hours we re-price the current 6 picks + your watchlist and read the change — <i>same menu, fresh numbers</i>. These fill <b>Tonight\'s hourly runs</b> and the change-environment chart. They don\'t pick new stocks.</p>'+
    '<p class="infofoot">So: <b>majors</b> change <i>what\'s on the menu</i> (4×/day, market-open-timed); <b>minors</b> keep <i>the prices</i> live (~10 min). The time up top is the next run — tap it any time to see this.</p>'},
  menu:{icon:'🍽️',title:'Tonight\'s Menu',body:
    '<p>The <b>6 picks</b> this run — <b>3 Australian + 3 international</b>, in three time horizons:</p>'+
    '<ul class="infoul"><li>⚡ <b>Day</b> — a quick trade off a fresh catalyst.</li><li>📅 <b>Week</b> — simmer a few days.</li><li>📈 <b>Long</b> — slow-cooked conviction.</li></ul>'+
    '<h4>How a pick is chosen</h4><p>Every candidate is scored 0–100 by the <b>Buy-Now engine</b>: fresh catalyst, earnings surprise, analyst moves, 52-week-high proximity, volume and trend — minus an <b>overheating penalty</b> so we don\'t chase what already ran. The verdict (Get in / Wait / Too late) and the <b>ideal-buy price</b> come straight from that score. Tap a card for the full breakdown.</p>'+
    '<p class="infofoot">The market toggle (🇦🇺/🇺🇸) switches which three you\'re looking at.</p>'},
  changeenv:{icon:'📈',title:'Change Environment',body:
    '<p>What\'s <b>moved</b> since the picks were chosen, and <b>how close each is to its ideal buy</b> — the "should I act yet?" view.</p>'+
    '<h4>Trajectories</h4><p>Each line is a pick\'s price change <b>from the first hourly run tonight</b> to now (not the daily move). Flat names collapse to a note.</p>'+
    '<h4>Ready to buy?</h4><p>The bar shows today\'s price vs <b>your ideal buy</b>. <span style="color:var(--buy)">Green</span> = at/below it → act. <b>Grey</b> = above → wait for the dip; the % is how far it still needs to fall.</p>'+
    '<p class="infofoot">Rebuilt every hourly (minor) run.</p>'},
  journey:{icon:'🧭',title:'The Journey',body:
    '<p>How the menu has <b>changed across major runs</b> — each card is one full re-cook. <span style="color:var(--buy)">Green</span> = a pick we kept, <span style="color:var(--dont)">red/✕</span> = dropped, <b>NEW</b> = fresh that run.</p>'+
    '<p>It only advances on a <b>major</b> run (new picks). Hourly re-prices are the <b>minor</b> runs below it. Tap the time up top for the full schedule.</p>'},
  fullpot:{icon:'🍲',title:'The Full Pot',body:
    '<p>Every candidate the scan <b>shortlisted</b> this run — the names we chose the 6 picks from. Each is priced, charted and scored.</p>'+
    '<h4>How candidates are sourced</h4><p>Each run casts a wide net across the same set of feeds — <b>live news, market movers, analyst upgrades/downgrades</b> — plus your watchlists. The queries use <b>signal words</b> (upgrade, contract, breakout, squeeze…), never ticker names, so we surface what\'s <i>actually moving</i>, not a fixed list. Every distinct ticker they turn up goes into the raw pool.</p>'+
    '<h4>How they\'re chosen</h4><p>The raw pool is scored 0–100 by the <b>Buy-Now engine</b> (fresh catalyst, earnings surprise, analyst moves, 52-week-high proximity, volume, trend — minus an overheating penalty). The strongest survive into <b>this pot</b>; the very top become the <b>6 picks</b>. So: <i>wide scan → shortlist (here) → picks</i>.</p>'+
    '<h4>The colour</h4><ul class="infoul"><li>🔥 <b>sizzling</b> — hottest setups</li><li>✅ <b>tasty</b> — solid</li><li>➖ <b>maybe</b> — mixed</li><li>⛔ <b>send it back</b> — avoid (falling knife / downgrade)</li></ul>'+
    '<p>Tap any card for the full read — company, day move, ~6-week chart, the news, and (for ASX) short interest.</p>'+
    '<p class="infofoot">The exact scan → shortlist → served funnel is in "How we got here".</p>'},
  world:{icon:'🌍',title:'World & Sectors',body:
    '<p>The <b>macro backdrop</b> — geopolitical themes and sector heat that tilt the picks.</p>'+
    '<p>Each card is a <b>Buy the theme / Watch / Skip</b> call with the tickers leading it. <b>Tap one</b> to see the leaders and our read on each. These themes feed the "why" behind individual picks (e.g. AUKUS → defence names).</p>'},
  commodities:{icon:'🛢️',title:'Commodities',body:
    '<p>The raw-material backdrop — <b>bullish vs bearish</b> across metals, energy and the emerging plays (rare earths, uranium, lithium). Australia is resource-heavy, so this often drives the ASX picks (e.g. a gold breakout lifts the miners).</p>'},
  upcoming:{icon:'📅',title:"What's coming up",body:
    '<p>Real, dated events in the next few weeks for names we watch — not predictions, just a calendar.</p>'+
    '<h4>📊 Earnings (next 7 days)</h4><p>When a company is due to report its results. Prices often move a lot right after — a stock can jump or drop 5-20% same-day depending on whether results beat or missed what analysts expected. Worth knowing before you buy right before one.</p>'+
    '<h4>💰 Dividends (next 30 days) — the confusing bit, explained plainly</h4>'+
    '<ul class="infoul">'+
    '<li><b>Ex-dividend date</b> — the cutoff. Own the stock the day <i>before</i> this date and you get the dividend; buy <i>on or after</i> it and you miss this round (you\'d get the next one). The stock price typically drops by roughly the dividend amount on this exact day — that\'s not a real loss, it\'s just the payout leaving the share price.</li>'+
    '<li><b>Dividend yield</b> — the payout as a % of the share price. A "4% yield" means $4 a year for every $100 invested, roughly.</li>'+
    '<li><b>Franking credits</b> (Australian shares only) — the company already paid 30% company tax on that profit before paying you the dividend. A "fully franked" dividend comes with a credit for that tax already paid, which you claim back at tax time (fully or partly, depending on your own tax rate) so you\'re not taxed on it twice. "0% franked" means no credit — you\'re taxed on the full amount as normal income.</li>'+
    '</ul>'+
    '<h4>🆕 New listings / IPOs (next 30 days)</h4><p>Companies about to start trading on the ASX for the first time. Very new listings have no price history yet, so our usual trend/RSI checks can\'t apply — treat these as higher-risk, "watch first" territory.</p>'+
    '<p class="infofoot">Sourced by bulk-fetching real reporting-season and dividend calendars each run — see Inside the Kitchen → Data-source health for exactly which ones.</p>'},
  topnews:{icon:'📰',title:"Tonight's news, consolidated",body:
    '<p>Every real, useful headline tonight\'s discovery net actually read — company news, broker moves, and geopolitical/macro events — ranked in one place, not scattered one-per-pick.</p>'+
    '<p>Green = we read it as good news for the stock/theme, red = bad, grey = the headline alone doesn\'t say either way, 🌍 = macro/geopolitical (not tied to one ticker).</p>'+
    '<p class="infofoot">Built from the same real reads that feed picks, candidates and the geo/sector cards — this is just all of it in one consolidated list.</p>'},
  topmovers:{icon:'🔥',title:'Top Movers',body:
    '<p>The whole market\'s real biggest gainers and losers today — not just names in tonight\'s picks or Full Pot. A quick reality check on what\'s actually happening out there.</p>'+
    '<p>This is different from <b>The Misses</b> below: Misses checks movers against what we <i>scanned</i>; Top Movers is just the raw list, no judgement about whether we should have caught it.</p>'+
    '<p class="infofoot">Refreshed each FULL run (not every 10-minute price update) — a live top-movers-by-volume feed needs a paid data source we don\'t have; the free/keyless sources this list comes from need a fresh read each time, not a cheap repeat call.</p>'},
  archive:{icon:'🗂️',title:'The Archive',body:
    '<p>Every menu we\'ve served, newest first — the real picks, verdicts and reasoning as they were written at the time, not a frozen price that goes stale. Runs from before this was added show as "no snapshot captured" rather than guessing.</p>'},
  misses:{icon:'😬',title:'The Misses',body:
    '<p>Every run we check the real biggest movers — <b>Day, Week and Month</b> (tap the tabs above) — against what our discovery process actually scanned — honestly, including the ones that got away.</p>'+
    '<ul class="infoul"><li>✅ <b>Served</b> — it was one of tonight\'s 6 picks.</li><li>👀 <b>Scanned, not served</b> — it was in the full-pot scan but scored below the cut.</li><li>❌ <b>Missed</b> — it wasn\'t in our search at all this run.</li></ul>'+
    '<h4>Why a real mover gets missed</h4><p>We search two ways: a <b>news &amp; catalyst search</b> (contracts, upgrades, earnings beats) every run, and a <b>whole-market technical scan</b> — a full sweep of every liquid stock for chart-based setups, which catches quiet momentum moves with no headline behind them. The technical scan is heavier and doesn\'t run on every single pass yet — when it\'s skipped, a name moving purely on chart momentum (no news) can slip through. Each miss below says exactly which of these applies.</p>'+
    '<p class="infofoot">This is the same accountability spirit as the grading ledger — we\'d rather show you the gap than hide it. A high miss count on a given day flags where the search needs to widen.</p>'},
  pricealerts:{icon:'🔔',title:'Price alerts — what actually happens',body:
    '<p>When a stock on your table hits (or drops below) its ideal-buy price, you\'ll see a <b>banner on the Favourites tab</b> — and as of 8 Aug 2026, we also <b>email you</b> (checked hourly, fires once per stock, never repeats).</p>'+
    '<p>Tap the <b>Price alerts</b> pill to turn the email off — the in-app banner still works either way, this only controls whether we also email you.</p>'+
    '<p class="infofoot">Emails come from thestocksoup@gmail.com and always link straight back to the stock — never a marketing list, just this one trigger.</p>'}
};
function infoBtn(key){ return '<button class="infobtn" data-info="'+esc(key)+'" aria-label="What is this?">i</button>'; }
// ── Per-tab "what you need to know" headers ─────────────────────────────────
function tabHead(eyebrow,title,sub,stats){
  return '<div class="tabhead">'+
    '<div class="theyebrow">'+eyebrow+'</div>'+
    '<h2 class="thead display">'+title+'</h2>'+
    (sub?'<p class="tsub">'+sub+'</p>':'')+
    (stats&&stats.length?'<div class="tabstats">'+stats.join('')+'</div>':'')+
  '</div>';
}
function tstat(k,v,cls){return '<span class="tabstat"><span class="tk">'+esc(k)+'</span> <b'+(cls?' class="'+cls+'"':'')+'>'+esc(v)+'</b></span>';}
function reviewsHead(){
  var o=(typeof OUTCOMES!=='undefined'&&OUTCOMES)?OUTCOMES:null;
  if(!o||!o.outcomes) return tabHead('🍽️ The scorecard','How good were we?','We grade <b>every</b> past pick after its own timeframe — no cherry-picking. Numbers fill in as calls mature.',[]);
  var rec=o.record||'—', wr=Math.round((o.winRate||0)*100), bt=o.byTimeframe||{}, best=null;
  ['Day','Week','Long'].forEach(function(tf){var a=bt[tf];if(a&&a.n&&(!best||(a.winRate||0)>best.wr))best={tf:tf,wr:(a.winRate||0)};});
  var stats=[tstat('Record',rec),tstat('Win rate',wr+'%',wr>=50?'gd':'bd'),tstat('Best',best?tfB(best.tf)+' '+Math.round(best.wr*100)+'%':'—','gd')];
  var verdict=wr>=55?'Cooking with gas 🔥':wr>=45?'Honest and middling':'A humbling month — nothing hidden';
  return tabHead('🍽️ The scorecard',verdict,'We check <b>every</b> pick after its own timeframe — a day-trade the next day, a week pick after a week, a month pick after a month. Tap any call below for the story.',stats);
}
function updateOwnCount(){ var el=document.getElementById('ownCount'); if(el){ try{ el.textContent=wlGet().filter(function(w){return w.own;}).length; }catch(e){} } }
function favesHead(){
  // #228 (user ask) — dropped the WATCHING / YOU OWN header stat pills: the counts already show in the
  // section titles below ("Things you own (17)" / "What you could have owned"), so these were a third,
  // redundant copy of the same numbers. The all/own split is still conveyed by those two summary cards.
  var n=0; try{ n=wlGet().filter(function(w){return (w.region||'au')===MKT;}).length; }catch(e){}
  var t=n?('You\'re watching '+n+(n===1?' name':' names')):'Your table is empty — for now';
  return tabHead('⭐ Your table',t,'Tap <b>＋ Watch</b> on any pick and we\'ll remember its ideal-buy price, then flag it the moment it gets there. Add your own below too.',[]);
}
function lastFilled(slotIdx){
  // Most recent menuHistory entry (current MKT) where the Day/Week (0/1) or Long (2) slot wasn't "NONE".
  var H=(LAST&&LAST.H)||{}, menus=H.menus||[], key=MKT==='au'?'au':'us';
  for(var i=0;i<menus.length;i++){
    var arr=menus[i][key]||[];
    if(arr[slotIdx]&&arr[slotIdx]!=='NONE'){
      // Only append the time if the stamp doesn't already carry one — some menuHistory stamps already
      // include "HH:MM AEST", so blindly appending `· time` double-printed it ("09:00 · 09:00 AEST").
      var s=menus[i].stamp||'';
      if(!/\d{1,2}:\d{2}/.test(s) && menus[i].time) s+=' · '+menus[i].time;
      return s;
    }
  }
  return null;
}
// #132 (user ask) — real per-run snapshot instead of a bare, frozen price string fetched from a
// static reports/report-index.json (duplicated what Run Schedule already showed, gone stale the
// moment it was captured). commit-run.py now stamps auSnap/usSnap (real sym/tf/verdict/price/plain
// reasoning) into each menuHistory entry AT PUBLISH TIME — this just renders it, synchronously, no
// fetch needed. Older runs (before this fix) won't have a snapshot — shown honestly, not silently.
function archiveHtml(H){
  var menus=(H&&H.menus)||[];
  // #176 (user caught it, 10 Aug 2026 — "if no archives, why do these cards show?"): the Archive is
  // about REAL captured per-run snapshots (#132), which only exist for runs published after that landed.
  // Older runs carry no snapshot, so a card for them was just a wall of "No detailed snapshot captured".
  // Only show runs that actually have a captured snapshot on at least one side — no empty placeholder cards.
  function hasSnap(m){ return (m&&m.auSnap&&m.auSnap.length) || (m&&m.usSnap&&m.usSnap.length); }
  menus=menus.filter(hasSnap);
  if(!menus.length) return '<div class="wlempty">No snapshot-captured menus yet — the Archive fills in as new runs are published.</div>';
  function pickBlock(p){
    if(!p||!p.sym||p.sym==='NONE') return '';
    var tfShort=(p.tf||'').split(' ')[1]||p.tf||'';
    return '<div class="archpick"><span class="archtf">'+esc(tfShort)+'</span><span class="archsym">'+esc(p.sym)+'</span>'+
      (p.verdict?'<span class="verdict '+esc(p.vclass||'')+'" style="font-size:9.5px;padding:3px 7px">'+esc(p.verdict)+'</span>':'')+
      (p.price?'<span class="archpx mono">'+esc(p.price)+'</span>':'')+'</div>'+
      (p.plain?'<div class="archwhy">'+esc(p.plain)+'</div>':'');
  }
  function side(snap){
    if(!snap||!snap.length) return '<div class="archnone">No detailed snapshot captured for this run.</div>';
    var out=snap.map(pickBlock).join('');
    return out||'<div class="archnone">No picks this run.</div>';
  }
  var cards=menus.slice(0,20).map(function(m){
    return '<div class="archcard2"><div class="archwhen">'+esc(m.stamp)+' · '+esc(m.time)+' AEST</div>'+
      '<div class="archcols"><div><div class="archcolh">🇦🇺 AU</div>'+side(m.auSnap)+'</div>'+
      '<div><div class="archcolh">🌏 US</div>'+side(m.usSnap)+'</div></div></div>';
  }).join('');
  return '<div class="archgrid2">'+cards+'</div>';
}
function kitchenHead(D){
  // "Re-prices today" must be TODAY's count, not PULSES.length — PULSES is a capped list (~24), so it
  // read a constant "24" for days (user caught it). Count only pulses whose AEST date is today.
  // #219 (user ask) — tier-aware run timing: for BOTH Type 1 (the catalyst menu) and Type 2/3 (the daily
  // whole-market scan) show the last run's real time + duration, red if it failed, plus the next run and
  // a live countdown. Every card is badged with which tier it belongs to.
  function _hm(iso){try{return new Date(iso).toLocaleTimeString('en-AU',{timeZone:'Australia/Sydney',hour:'2-digit',minute:'2-digit',hour12:false});}catch(e){return '';}}
  function _dm(ms){return ms?Math.round(ms/60000)+'m':'';}
  function _until(s){var m=(s||'').match(/(\d{1,2}):(\d{2})/);if(!m)return '';var now=new Date();var t=new Date(now);t.setHours(+m[1],+m[2],0,0);if(t<=now)t.setDate(t.getDate()+1);var mins=Math.round((t-now)/60000);var h=Math.floor(mins/60),mm=mins%60;return 'in '+(h?h+'h ':'')+mm+'m';}
  function _kstat(label,value,tier,cls){var badge=tier?' <span class="rltier rltier-'+(tier==='T1'?'1':'23')+'">'+esc(tier)+'</span>':'';return '<span class="tabstat"><span class="tk">'+esc(label)+badge+'</span> <b'+(cls?' class="'+cls+'"':'')+'>'+esc(value)+'</b></span>';}
  // #221 (user ask) — a card can now carry TWO lines: either two tiers (T1 + T2·3 cook/scan in one card)
  // or a last/next pair. Each line shows its own tier badge OR a small last/next sub-label.
  function _kmline(o){
    var lead=o.tier?'<span class="rltier rltier-'+(o.tier==='T1'?'1':'23')+'">'+esc(o.tier)+'</span>':(o.sub?'<span class="kmsub">'+esc(o.sub)+'</span>':'');
    return '<span class="kmrow">'+lead+' <b'+(o.cls?' class="'+o.cls+'"':'')+'>'+esc(o.val)+'</b></span>';
  }
  function _kmulti(label,lines,tier){
    var badge=tier?' <span class="rltier rltier-'+(tier==='T1'?'1':'23')+'">'+esc(tier)+'</span>':'';
    return '<span class="tabstat tabstat-multi"><span class="tk">'+esc(label)+badge+'</span><span class="kml">'+lines.map(_kmline).join('')+'</span></span>';
  }
  var _today=null; try{_today=new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Sydney'});}catch(e){}
  var P=(typeof PULSES!=='undefined'&&PULSES)?PULSES:[];
  var n=P.filter(function(pu){ if(!pu||!pu.iso) return false; try{return new Date(pu.iso).toLocaleDateString('en-CA',{timeZone:'Australia/Sydney'})===_today;}catch(e){return false;} }).length;
  var lastP=P.length?P[P.length-1].iso:null;
  var rl=(typeof RUNLOG!=='undefined'&&RUNLOG)?RUNLOG:[];
  var mh=(LAST&&LAST.H&&LAST.H.menus)||[];
  // Last cook (T1): the most recent menu run — a committed menu (menuHistory), unless a NEWER attempt
  // failed/cancelled (runLog), in which case show that in red so a bad last run is obvious.
  var cook=mh[0]?{t:mh[0].iso,dur:mh[0].durMs,bad:false}:null;
  var lastAtt=rl.filter(function(e){return e&&e.kind==='menu';})[0];
  if(lastAtt&&(lastAtt.status==='failed'||lastAtt.status==='cancelled')){ var at=lastAtt.finishedAt||lastAtt.startedAt; if(!cook||new Date(at)>new Date(cook.t)) cook={t:at,dur:lastAtt.durMs,bad:true,st:lastAtt.status}; }

function themeTickers(item){
  if(item.tickers) return item.tickers;
  var text=(item.title||item.name||'')+' '+(item.note||'');   // keep original case — real tickers are UPPERCASE
  var STOP={ASX:1,AI:1,US:1,EU:1,UK:1,BUY:1,SKIP:1,WATCH:1,THE:1,AND:1,AUKUS:1,ETF:1,IPO:1,CEO:1,USD:1,AUD:1,RSI:1,NYSE:1,FDA:1,GDP:1,NEW:1,LOW:1,HIGH:1,BTC:1,EV:1};
  var found=(text.match(/\b[A-Z]{2,5}\b/g)||[]).filter(function(t){return !STOP[t];});

// Real, recommendation-backed leaders: our scored picks that fit the theme FIRST, then hot
// full-pot candidates, then any names mentioned. So a theme leads with what we actually rate.
function themeLeaders(item,src,D){
  D=D||{};
  // Generic connector/descriptor words that show up in almost ANY pick's blurb — must be excluded or
  // they false-match unrelated picks (e.g. "Uranium term price 18-yr high" was matching CBA/F on "price"/"high").
  var GEN={build:1,into:1,with:1,from:1,asx:1,the:1,and:1,for:1,out:1,play:1,plays:1,names:1,stock:1,stocks:1,
    theme:1,sector:1,tonight:1,this:1,that:1,price:1,prices:1,priced:1,high:1,highs:1,low:1,lows:1,term:1,
    terms:1,near:1,year:1,years:1,week:1,weeks:1,month:1,months:1,level:1,levels:1,rate:1,rates:1,record:1,
    records:1,above:1,below:1,target:1,targets:1,rich:1,cheap:1,good:1,great:1,news:1,rally:1,rallies:1};
  var kws=(((item.title||item.name||'')+'').toLowerCase().match(/[a-z]{4,}/g)||[]).filter(function(w){return !GEN[w];});
  // With 2+ real keywords left, require 2 hits (not just any single overlap) — precision over recall,
  // since a wrong "leader" actively misleads while an empty list just says "no clear leaders tonight".
  function matches(txt){
    txt=(txt||'').toLowerCase();
    var hits=kws.filter(function(k){return txt.indexOf(k)>=0;}).length;
    return kws.length<=1 ? hits>=1 : hits>=2;
  }
  var ordered=[],seen={};
  function add(s){ if(s&&!seen[s]){seen[s]=1;ordered.push(s);} }
  // #116 fix (9 Aug 2026): theme-leaders.py already scored a REAL leader for this exact card
  // (item.leader = {sym,name,buy_now,band,verdict}) — put it first, ahead of the keyword-fuzzy-match
  // guesses below. Real incident: fuzzy matching alone showed the wrong ticker on a Strait of Hormuz
  // card because no pick/candidate's prose happened to share 2+ keywords with the theme title.
  if(item.leader&&item.leader.sym) add(item.leader.sym);
  (D.regions||[]).forEach(function(rg){(rg.picks||[]).forEach(function(p){ if(matches((p.catalysts||[]).join(' ')+' '+(p.plain||'')+' '+(p.name||''))) add(p.sym); });});
  var rank={hot:0,good:1,mid:2,cold:3};
  (D.candidates||[]).filter(function(c){return matches((c.note||'')+' '+(c.name||''));})
    .sort(function(a,b){return (rank[a.heat]==null?3:rank[a.heat])-(rank[b.heat]==null?3:rank[b.heat]);})
    .forEach(function(c){add(c.sym);});
  (item.tickers||[]).forEach(add);
  themeTickers(item).forEach(add);
  return ordered;
}
function themeIntel(sym,D){
  var res=null;
  (D.regions||[]).forEach(function(rg){(rg.picks||[]).forEach(function(p,i){if(p.sym===sym&&!res)res={kind:'pick',p:p,region:rg.id,idx:i,cur:rg.cur||'$'};});});
  if(res)return res;
  var ci=-1,c=null; (D.candidates||[]).forEach(function(x,i){ if(x.sym===sym&&!c){c=x;ci=i;} }); if(c)return {kind:'cand',c:c,idx:ci};
  var wi=(D.watchlistIntel||{})[sym]; if(wi&&!wi.error)return {kind:'intel',wi:wi};
  return {kind:'none'};

    fetch(API_BASE+'/history?sym='+encodeURIComponent(sym)+'&region='+encodeURIComponent(reg)).then(function(r){return r.ok?r.json():null;}).then(function(h){
      var slot=card.querySelector('.tsc-sparkslot'); if(!slot||!h||!h.closes||h.closes.length<3)return;

function timeAgo(iso){

// News Staleness rule (CLAUDE.md): article >7 days old with no fresher update -> flag OLD, never

// was 14 months stale while the same card's ASX announcements were hours old, with no age shown

function newsLineHtml(news, newsUrl, newsDate){
  if(!news) return '';
  var days=null;
  if(newsDate){ try{ days=Math.floor((Date.now()-new Date(newsDate).getTime())/86400000); }catch(e){} }
  var old = days!=null && days>7;
  var age = days==null ? '' : (days<1?'today':days===1?'1d ago':days+'d ago');
  return '<div class="mnews'+(old?' mnews-old':'')+'">📰 <span class="lead">In the news'+(old?' ⚠️ OLD':'')+':</span> '+
    (newsUrl?'<a href="'+esc(newsUrl)+'" target="_blank" rel="noopener">'+esc(news)+' ↗</a>':esc(news))+
    (age?'<span class="mnews-age">'+age+'</span>':'')+'</div>';

function _timeHM(sec){ var d=new Date(sec*1000), h=d.getHours(), m=d.getMinutes(); var ap=h>=12?'pm':'am'; h=h%12; if(h===0)h=12; return h+':'+(m<10?'0':'')+m+ap; }
// Marker-aware sparkline: draws a dashed line + dot at markIdx (when we flagged the miss), so the
// chart reads as "here's what happened AFTER we checked", not a disconnected generic 24h window.
function missSparkSVG(vals,markIdx){
  var w=100,h=30,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1;
  var xy=vals.map(function(v,i){return [(i/(vals.length-1))*w,h-((v-mn)/rng)*(h-4)-2];});
  var poly=xy.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');
  var up=vals[vals.length-1]>=vals[0], last=xy[xy.length-1];
  var mark='';
  if(markIdx!=null&&markIdx>=0&&markIdx<xy.length){
    var mp=xy[markIdx];
    mark='<line x1="'+mp[0].toFixed(1)+'" y1="0" x2="'+mp[0].toFixed(1)+'" y2="'+h+'" class="mchk-line"/>'+
      '<circle cx="'+mp[0].toFixed(1)+'" cy="'+mp[1].toFixed(1)+'" r="2.4" class="mchk-dot"/>';
  }
  return '<svg class="spark '+(up?'up':'down')+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<polygon points="0,'+h+' '+poly+' '+w+','+h+'"/><polyline points="'+poly+'"/>'+mark+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.2"/></svg>';
}
function hydrateMissCharts(){
  document.querySelectorAll('.misschart[data-hydrate-chart]').forEach(function(slot){
    var sym=slot.dataset.sym, reg=slot.dataset.region, cur=slot.dataset.cur||'', checkTs=slot.dataset.checkTs?+slot.dataset.checkTs:null;
    fetch(API_BASE+'/intraday?sym='+encodeURIComponent(sym)+'&region='+encodeURIComponent(reg)).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j||!j.closes||j.closes.length<2){ slot.innerHTML=''; return; }
      var vals=j.closes, times=j.timestamps||[], mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
      var lastSec=times.length?times[times.length-1]:null;
      var markIdx=null;
      if(checkTs&&times.length){
        var target=Math.round(checkTs/1000);
        // Only draw the marker if the confirm/flag time actually falls within this chart's window
        // (with ~1h grace). A pick served days ago would otherwise clamp to the chart start and
        // mislabel it as "served 09:30" — better to show no marker than a wrong one. (#212)
        if(target>=times[0]-3600){
          var best=0, bestDiff=Infinity;
          times.forEach(function(t,i){ var diff=Math.abs(t-target); if(diff<bestDiff){bestDiff=diff;best=i;} });
          markIdx=best;
        }
      }
      var isLive=lastSec&&(Date.now()/1000-lastSec)<20*60;   // last bar is fresh → really "now"; else say when it's from
      var rightLbl=(isLive?'now':_timeHM(lastSec))+' '+cur+vals[vals.length-1].toFixed(2);
      var mlab=slot.dataset.markLabel||'flagged';   // #212 — pick cards mark "served", misses mark "flagged"
      // #220 — anchor the label at the marker line but keep it inside the chart: near the left edge it
      // extends right (transform none), near the right edge it extends left (translateX(-100%)), else centred.
      // A whole-integer left% also sat a touch off the line — use one decimal so label + line agree.
      var flagLbl='';
      if(markIdx!=null){
        var mpct=(markIdx/(vals.length-1))*100, tx=(mpct<15)?'0':(mpct>85)?'-100%':'-50%';
        flagLbl='<div class="misschart-flag" style="left:'+mpct.toFixed(1)+'%;transform:translateX('+tx+')">'+mlab+' '+_timeHM(times[markIdx])+'</div>';
      }
      slot.innerHTML='<div class="misschart-wrap">'+missSparkSVG(vals,markIdx)+flagLbl+'</div>'+
        '<div class="misschart-mm"><span>'+cur+mn.toFixed(2)+'</span><span class="misschart-now">'+rightLbl+'</span><span>'+cur+mx.toFixed(2)+'</span></div>';
    }).catch(function(){ slot.innerHTML=''; });
  });
}

var VILLAGER_MASCOTS=['🐷','🐢','🦁','🦊','🐸','🦉','🐨','🐙','🐝','🦄','🐻','🐰'];
function villagerMascot(sym){
  var h=0; for(var i=0;i<(sym||'').length;i++) h=(h*31+sym.charCodeAt(i))>>>0;
  return VILLAGER_MASCOTS[h%VILLAGER_MASCOTS.length];

function villagerSticker(p){
  var v=(p.verdict||'').toLowerCase();
  if(p.sym==='NONE') return {word:'ZZZ',cls:'v-zzz',emoji:'😴'};
  if(/wait|late|hold|skip|avoid|pass|don.t|steer/.test(v)) return {word:'NAH',cls:'v-nah',emoji:'🙅'};
  if(/get in|buy/.test(v)) return {word:'YUM!',cls:'v-yum',emoji:'🥣'};
  return {word:'HMM',cls:'v-hmm',emoji:'🤔'};
}
function villagerLine(p){
  if(p.sym==='NONE') return 'Nothing to serve here right now — check back soon! 👀';
  var v=(p.verdict||'').toLowerCase(), buy=/get in|buy/.test(v);
  if(buy&&p.rsi!=null&&p.rsi>=70) return 'On a hot streak — might need a little nap, but still tasty!';
  if(buy&&p.rsi!=null&&p.rsi<=35) return 'Total bargain right now — like a sale on your favourite snack!';
  if(buy) return 'Steady as she goes — quietly doing its thing.';
  return 'Sitting this one out for now — already had its big moment today.';
}

function villagerMood(r){
  var off=r.label&&r.label.indexOf('OFF')>=0, on=r.label&&r.label.indexOf('ON')>=0;
  if(off) return {emoji:'🙈',word:'HIDE!',line:'Markets are grumpy today — playing it safe.'};
  if(on) return {emoji:'🚀',word:'GO TIME!',line:'Markets are happy — good day to be brave.'};
  return {emoji:'😌',word:'CHILL',line:'Nothing wild happening — just a normal day.'};
}
function villagerThemeLine(D){
  var parts=(D.hotTags||'').split('·').map(function(s){return s.trim();}).filter(Boolean);
  var gold=false, rest=[];

  var names=rest.map(stripHeatWord).filter(Boolean);
  if(gold) names.unshift('Gold');

  });

  wireInfo();
  var lvl=(D.risk&&D.risk.level!=null)?D.risk.level:50;
  requestAnimationFrame(function(){var n=document.getElementById('sneedle');if(n)n.style.left=lvl+'%';});
}

function flashToast(msg){
  var t=document.createElement('div'); t.className='toast'; t.innerHTML=msg;
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ if(t.parentNode)t.remove(); },300); }, 2400);
}
var _refreshing=false;
function refreshPrices(btn){
  if(_refreshing) return; _refreshing=true;
  if(btn){ btn.classList.add('spinning'); }
  var beforeIso=(PULSES&&PULSES.length)?PULSES[PULSES.length-1].iso:null;
  var started=Date.now();
  return new Promise(function(resolve){
    loadGated(function(b){
      var d=b&&b.latest, h=b&&b.menuHistory;
      if(b&&b.pulseHistory&&b.pulseHistory.pulses&&b.pulseHistory.pulses.length>1) PULSES=b.pulseHistory.pulses;
      if(b&&b.trackRecord&&b.trackRecord.record) TRACK=b.trackRecord;
      if(b&&b.outcomes&&b.outcomes.outcomes) OUTCOMES=b.outcomes;
      RUNNING=(b&&b.running)||null; RUNLOG=(b&&b.runLog)||[]; watchRun();
      var afterIso=(PULSES&&PULSES.length)?PULSES[PULSES.length-1].iso:null;
      var fresh=afterIso&&afterIso!==beforeIso;
      setTimeout(function(){
        var sc=window.pageYOffset;
        boot(d&&d.regions?d:EMBEDDED, h&&h.menus?h:HIST_EMBED);
        window.scrollTo(0,sc);
        _refreshing=false;
        flashToast(fresh?'✓ Prices refreshed — updated just now':'Already up to date · last run '+(afterIso?timeAgo(afterIso):'—')+'<br><span style="opacity:.7;font-weight:600">New prices publish each hourly run.</span>');
        resolve();
      }, Math.max(0, 450-(Date.now()-started)));
    });
  });
}
// #91 — admin-only "Refresh full": requests a fresh full re-cook, distinct from refreshPrices() above
// which just re-fetches whatever's already published. This can't run synchronously (no persistent 24/7
// compute) — it queues a "requested" row on the Run Schedule that a live/next-scheduled session picks
// up. Be honest about that in the toast; never imply it's instant.
function requestFullRun(btn){
  if(btn) btn.classList.add('spinning');
  fetch(API_BASE+'/me/request-run',{method:'POST',headers:apiHdr()})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(res){
      if(btn) btn.classList.remove('spinning');
      if(res.ok&&res.j.ok){
        flashToast('🍳 Full re-cook requested — queued on the Run Schedule.<br><span style="opacity:.7;font-weight:600">Runs when a session next picks it up, not instantly — no 24/7 compute yet.</span>');
        refreshPrices();
      } else if(res.j&&res.j.error){
        flashToast('Couldn\'t queue it: '+esc(res.j.error));
      } else {
        flashToast('Couldn\'t reach the server — try again shortly.');
      }
    }).catch(function(){ if(btn) btn.classList.remove('spinning'); flashToast('Couldn\'t reach the server — try again shortly.'); });
}
// capture the magic-link session handed back in the redirect hash (#session=…), then sync the list
(function(){var m=(location.hash||'').match(/session=([^&]+)/);if(m){sessSet(decodeURIComponent(m[1]));try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}})();
if(signedIn()) syncFromBackend(function(){ if(document.getElementById('wlPills')){renderWatchlist();syncWatchButtons();} });
// The picks bundle is members-only — fetched from the Worker with the session token, never a public file.
function loadGated(cb){
  fetch(API_BASE+'/data',{headers:{'Authorization':'Bearer '+sessGet()},cache:'no-store'})
    .then(function(r){ if(r.status===401){ sessSet(''); location.replace('index.html'); throw 0; } return r.ok?r.json():null; })
    .then(function(b){ cb(b||null); }).catch(function(){ cb(null); });
}
function applyBundle(b){
  if(!b) return false;
  var d=b.latest, h=b.menuHistory, pu=b.pulseHistory, tr=b.trackRecord, oc=b.outcomes;
  if(pu&&pu.pulses&&pu.pulses.length>1) PULSES=pu.pulses;
  if(tr&&tr.record) TRACK=tr;
  if(oc&&oc.outcomes) OUTCOMES=oc;
  RUNNING=b.running||null; RUNLOG=b.runLog||[];
  if((d&&d.regions)||(h&&h.menus)||PULSES||TRACK||OUTCOMES){
    // Wrap boot() so a render throw can't be silently swallowed by loadGated's .catch — that turned a
    // single malformed field (hotTags as a list, 10 Aug 2026) into a blank page with ZERO signal, which
    // is what made it so hard to diagnose. Now it at least screams in the console, and we keep whatever
    // was on screen rather than pretending the load simply "returned nothing".
    try{ boot(d&&d.regions?d:EMBEDDED, h&&h.menus?h:HIST_EMBED); watchRun(); return true; }
    catch(err){ console.error('applyBundle: render threw — the page could not update with fresh data:', err); return false; }
  }
  return false;
}
// While a run is cooking, quietly re-poll /data so the finished menu (and its cleared marker) appears on its own.
var _runPoll=null;
function watchRun(){
  if(_runPoll){clearTimeout(_runPoll);_runPoll=null;}
  if(!RUNNING||!RUNNING.startedAt) return;
  var age=Date.now()-new Date(RUNNING.startedAt).getTime();
  if(age>25*60*1000){ RUNNING=null; return; }        // stale marker — stop watching
  _runPoll=setTimeout(function(){
    var sc=window.pageYOffset;                        // preserve scroll — a full re-render must never jump you to the top
    loadGated(function(b){ if(b) applyBundle(b); window.scrollTo(0,sc); });
  }, 40000);
}
boot(EMBEDDED,HIST_EMBED);
loadGated(applyBundle);
</script>
