<meta charset="utf-8">
<title>Stock Soup — Tonight's Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<style>
  :root{
    --ground:#14100E; --surface:#1E1815; --surface-2:#271F1A; --line:#3A2F27;
    --broth:#FF6B1A; --buy:#23C267; --dont:#FF4D4D; --hold:#FFC53D;
    --ink:#F4EDE4; --muted:#A69A8C; --faint:#6E6154;
    --shadow:0 12px 40px -12px rgba(0,0,0,.7);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:light){
    :root{ --ground:#FBF6EF; --surface:#FFFFFF; --surface-2:#F3EADF; --line:#E4D7C6;
      --ink:#1E1815; --muted:#7A6C5C; --faint:#A99A88; --shadow:0 12px 40px -16px rgba(80,50,20,.25); }
  }
  :root[data-theme="dark"]{ --ground:#14100E; --surface:#1E1815; --surface-2:#271F1A; --line:#3A2F27;
    --ink:#F4EDE4; --muted:#A69A8C; --faint:#6E6154; --shadow:0 12px 40px -12px rgba(0,0,0,.7); }
  :root[data-theme="light"]{ --ground:#FBF6EF; --surface:#FFFFFF; --surface-2:#F3EADF; --line:#E4D7C6;
    --ink:#1E1815; --muted:#7A6C5C; --faint:#A99A88; --shadow:0 12px 40px -16px rgba(80,50,20,.25); }

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ground);color:var(--ink);font-family:var(--font);line-height:1.5;
    -webkit-font-smoothing:antialiased;padding:clamp(14px,3vw,40px)}
  .wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  .display{font-weight:900;letter-spacing:-.02em;text-wrap:balance;line-height:.98;text-transform:uppercase}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a.q{color:inherit;text-decoration:none;border-bottom:1px dotted transparent}
  a.q:hover{color:var(--broth);border-bottom-color:var(--broth)}
  a.q:focus-visible{outline:2px solid var(--broth);outline-offset:2px;border-radius:2px}

  .hero{background:radial-gradient(120% 140% at 100% 0%, rgba(255,107,26,.16), transparent 55%),var(--surface);
    border:1px solid var(--line);border-radius:20px;padding:clamp(20px,3.5vw,38px);position:relative;overflow:hidden}
  .brandrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:20px;letter-spacing:-.01em}
  .bowl{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 200deg,var(--broth),#FFB061,var(--broth));
    display:grid;place-items:center;font-size:20px;box-shadow:0 0 24px -4px var(--broth)}
  .live{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--buy);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(35,194,103,.55)}70%{box-shadow:0 0 0 8px rgba(35,194,103,0)}100%{box-shadow:0 0 0 0 rgba(35,194,103,0)}}
  .hero h1{font-size:clamp(34px,7vw,68px);margin:14px 0 6px}
  .hero h1 .hot{color:var(--broth)}
  .chef{font-size:clamp(15px,2.2vw,19px);color:var(--muted);max-width:60ch;text-wrap:pretty}
  .chef b{color:var(--ink)}
  .metastrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .chip{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .toggle{cursor:pointer;font-family:var(--font);color:var(--ink)}
  .toggle:focus-visible{outline:2px solid var(--broth);outline-offset:2px}
  .meter{margin-top:18px}
  .meter .track{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--dont),var(--hold),var(--buy));position:relative;opacity:.9}
  .meter .needle{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 3px var(--surface);left:50%;transition:left .8s cubic-bezier(.2,.8,.2,1)}
  .meter .lbls{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:6px;font-weight:700}

  .pulsebar{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--broth);border-radius:14px;padding:14px 16px}
  .pulsebar .ph{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .pdot{width:8px;height:8px;border-radius:50%;background:var(--broth);animation:pulse 2.4s infinite}
  .psynth{font-size:14.5px;line-height:1.5;text-wrap:pretty;color:var(--muted)}
  .celastcheck{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;font-weight:700;color:var(--muted)}
  .psynth b{color:var(--ink)}
  .pmovers{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
  .pmv{font-size:12px;font-weight:800;font-family:var(--mono);padding:3px 9px;border-radius:7px;background:var(--surface-2)}
  .pmv.up{color:var(--buy)} .pmv.down{color:var(--dont)}
  .cenv{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
  @media(max-width:760px){.cenv{grid-template-columns:1fr}}
  .cetraj,.ceprox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
  .ceh{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .cechartwrap{position:relative;padding-right:52px}
  .cechart{width:100%;height:120px;display:block}
  .celab{position:absolute;right:0;transform:translateY(-50%);font-size:11.5px;font-weight:900;white-space:nowrap;letter-spacing:.02em}
  .ceflat{text-align:right;font-size:10.5px;font-weight:800;color:var(--muted);margin-top:7px;padding-right:6px;letter-spacing:.02em}
  .celegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;font-weight:700}
  .celeg{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
  .celeg i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .celeg b.up{color:var(--buy)} .celeg b.down{color:var(--dont)}
  .proxrow{display:flex;align-items:center;gap:10px;padding:6px 0}
  .pxs{font-weight:800;font-size:13px;flex:0 0 auto;min-width:120px;display:flex;gap:6px;align-items:baseline}
  .proxbar{flex:1;position:relative;height:8px;border-radius:999px;background:var(--surface-2)}
  .proxzone{position:absolute;left:0;top:0;bottom:0;width:19%;background:rgba(35,194,103,.32);border-radius:999px}
  .proxnow{position:absolute;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
  .pxg{min-width:78px;display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums}
  .pxnow{font-size:13px;font-weight:800;color:var(--ink)}
  .s-in .pxnow,.s-near .pxnow{color:var(--buy)} .s-close .pxnow{color:var(--hold)}
  .pxbuy{font-size:11px;font-weight:700;color:var(--muted)}
  .pxst{font-size:10px;font-weight:800;color:var(--muted)}
  .s-in .proxnow,.s-near .proxnow{background:var(--buy)} .s-in .pxst,.s-near .pxst{color:var(--buy)}
  .s-close .proxnow{background:var(--hold)} .s-close .pxst{color:var(--hold)}
  .s-wait .proxnow{background:var(--faint)}
  .proxpct{position:absolute;bottom:14px;transform:translateX(-50%);font-size:10px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
  .s-in .proxpct,.s-near .proxpct{color:var(--buy)} .s-close .proxpct{color:var(--hold)} .s-wait .proxpct{color:var(--muted)}
  .proxkey{font-size:10px;color:var(--faint);margin-top:10px}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:2px}
  .clickchip{cursor:pointer;transition:box-shadow .12s,transform .1s}
  .clickchip:hover{box-shadow:0 0 0 1.5px var(--broth) inset} .clickchip:active{transform:scale(.98)}
  .chipi{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid currentColor;opacity:.55;font-family:Georgia,serif;font-style:italic;font-size:9px;font-weight:700;margin-left:3px}
  .lastupd{background:none;border:0;color:var(--muted);font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;padding:0 2px;white-space:nowrap}
  .lastupd:hover{color:var(--broth)}
  .refreshbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:15px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .signinbtn{background:var(--broth);color:#fff;border:0;font-weight:800;font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .signinbtn:hover{filter:brightness(1.05)}
  .refreshbtn:hover{border-color:var(--broth);color:var(--broth)}
  .refreshbtn.spinning{animation:spin .8s linear infinite;color:var(--broth)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);font-family:var(--font);font-weight:700;font-size:13px;line-height:1.4;padding:11px 18px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.28);z-index:9999;opacity:0;transition:opacity .25s,transform .25s;max-width:82vw;text-align:center;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .infobtn{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);background:none;color:var(--muted);font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:12px;line-height:1;cursor:pointer;align-self:center;transition:border-color .12s,color .12s}
  .infobtn:hover{border-color:var(--broth);color:var(--broth)}
  .schedlink{cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .schedi{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1.2px solid var(--muted);font-family:Georgia,serif;font-style:italic;font-size:9.5px;font-weight:700}
  .schedlink:hover .schedi{border-color:var(--broth);color:var(--broth)}
  .infobody h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--broth);font-weight:800;margin:16px 0 6px}
  .infobody p{font-size:14px;line-height:1.55;color:var(--ink);margin:0 0 10px;text-wrap:pretty}
  .infobody .infoul{margin:0 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.5}
  .infobody .infofoot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
  .sec-head h2{font-size:clamp(20px,3.4vw,30px)}
  .sec-head .k{color:var(--broth)}
  .sec-sub{color:var(--muted);font-size:14px;margin-bottom:16px}

  /* 4-tab navigation */
  .tabbar{position:sticky;top:0;z-index:50;display:flex;gap:6px;background:var(--bg);backdrop-filter:saturate(1.3) blur(8px);border-bottom:2px solid var(--line);padding:10px 0 0;margin:6px 0 24px}
  .tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:6px 4px 13px;cursor:pointer;color:var(--muted);font-weight:900;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;line-height:1.12;text-align:center;font-family:var(--font);position:relative;transition:color .15s,transform .12s}
  .tabbtn .ti{font-size:24px;line-height:1;filter:grayscale(.5) opacity(.72);transition:filter .15s,transform .15s}
  .tabbtn.active{color:var(--broth)}
  .tabbtn.active .ti{filter:none;transform:scale(1.14) rotate(-3deg)}
  .tabbtn.active::after{content:"";position:absolute;left:14%;right:14%;bottom:-2px;height:3.5px;border-radius:3px;background:linear-gradient(90deg,var(--broth),#ffb347);box-shadow:0 0 12px rgba(255,107,26,.65)}
  .tabbtn:hover{color:var(--ink)} .tabbtn:active{transform:scale(.96)}
  .tabview{display:none;animation:tabin .22s ease}
  .tabview.active{display:block}
  .tabview > section{margin-top:44px} .tabview > section:first-child{margin-top:8px}   /* breathing room between sections */
  .tabview .hourlysec{margin-top:44px}
  @keyframes tabin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @media(max-width:640px){
    .tabbar{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-top:2px solid var(--line);border-bottom:0;padding:9px 6px calc(9px + env(safe-area-inset-bottom));box-shadow:0 -8px 26px -10px rgba(60,40,20,.45);border-radius:20px 20px 0 0}
    .tabbtn{font-size:10px;padding:4px 2px 5px;letter-spacing:.02em}
    .tabbtn .ti{font-size:23px}
    .tabbtn.active::after{bottom:auto;top:-9px;left:32%;right:32%;height:3px}
    body{padding-bottom:82px}
  }
  .tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
  .tab{border:0;background:transparent;color:var(--muted);font-family:var(--font);font-weight:800;font-size:13px;
    padding:8px 16px;border-radius:9px;cursor:pointer;letter-spacing:.02em;transition:.15s}
  .tab[aria-selected="true"]{background:var(--broth);color:#1a0f06}
  .tab:disabled{opacity:.45;cursor:not-allowed}
  .tab:focus-visible{outline:2px solid var(--broth);outline-offset:2px}

  .menu{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:760px){.menu{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;
    box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease;cursor:pointer}
  .card:hover{transform:translateY(-4px);border-color:var(--broth)}
  .card:focus-visible{outline:2px solid var(--broth);outline-offset:3px}
  .card .tf{display:flex;align-items:center;justify-content:space-between}
  .tf .name{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .verdict{font-size:12px;font-weight:900;padding:5px 11px;border-radius:8px;letter-spacing:.04em;text-transform:uppercase}
  .v-buy{background:rgba(35,194,103,.16);color:var(--buy);border:1px solid rgba(35,194,103,.4)}
  .v-hold{background:rgba(255,197,61,.16);color:var(--hold);border:1px solid rgba(255,197,61,.4)}
  .v-dont{background:rgba(255,77,77,.16);color:var(--dont);border:1px solid rgba(255,77,77,.4)}
  .card .tick{display:flex;align-items:baseline;gap:10px}
  .tick .symwrap{display:flex;flex-direction:column}
  .tick .sym{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1}
  .tick .co{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
  .tick .px{margin-left:auto;text-align:right}
  .px .p{font-weight:800;font-size:19px}
  .px .c{font-size:12px;font-weight:700}
  .up{color:var(--buy)} .down{color:var(--dont)}
  .card .plain{font-size:14px;color:var(--ink);text-wrap:pretty}
  .card .lvls{display:flex;gap:6px;font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;flex-wrap:wrap}
  .lvls b{color:var(--ink)}
  .card .more{font-size:11px;font-weight:800;color:var(--broth);letter-spacing:.02em}
  .buyat{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-weight:800;font-size:13px;padding:6px 8px 6px 12px;border-radius:9px;width:100%;flex-wrap:wrap}
  .buyat.ba-in{background:rgba(35,194,103,.11);border-color:rgba(35,194,103,.36);color:var(--buy)}
  .buyat.ba-close{background:rgba(240,180,0,.10);border-color:rgba(240,180,0,.34);color:var(--hold)}
  .buyat.ba-wait{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
  .baact{font-weight:800;font-size:12px}
  .tonight{display:flex;align-items:center;gap:7px;margin:2px 0 2px}
  .tnl{text-transform:uppercase;letter-spacing:.07em;font-size:9.5px;font-weight:800;color:var(--faint)}
  .tonight svg{flex:0 0 auto;display:block}
  .mtpct{font-family:var(--mono);font-weight:800;font-size:11.5px}
  .mtn{font-size:10px;color:var(--faint);font-weight:700}
  .buyat .bl{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .storyrow{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .storyrow:last-child{border-bottom:0}
  .storyrow .slbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .storyrow b{color:var(--broth)}
  .pickcol{display:flex;flex-direction:column;gap:12px}
  .rucard{background:linear-gradient(180deg,rgba(255,107,26,.10),rgba(255,107,26,.03));border:1px solid rgba(255,107,26,.4);border-left:4px solid var(--broth);border-radius:14px;padding:15px 16px}
  .rutag{font-size:13px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--broth);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .rutop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .rusym{font-size:24px;font-weight:900;text-decoration:none;color:var(--ink);letter-spacing:-.02em}
  .rusym:hover{color:var(--broth)}
  .runame{font-size:13px;color:var(--muted);font-weight:700}
  .rupx{margin-left:auto;font-size:14px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .ruline{font-size:14px;color:var(--ink);margin-top:9px;text-wrap:pretty;line-height:1.5}
  .rucard.tappable{cursor:pointer;transition:transform .15s,box-shadow .15s}
  .rucard.tappable:hover{transform:translateY(-2px);box-shadow:0 8px 24px -12px var(--broth)}
  .rucard.tappable:focus-visible{outline:2px solid var(--broth);outline-offset:3px}
  .rumore{font-size:11px;font-weight:800;color:var(--broth);margin-top:9px}
  .spark{width:100%;height:46px;display:block;margin:4px 0 2px}
  .spark.up{--sc:var(--buy)} .spark.down{--sc:var(--dont)}
  .spark polyline{fill:none;stroke:var(--sc);stroke-width:1.5;vector-effect:non-scaling-stroke}
  .spark polygon{fill:var(--sc);opacity:.14}
  .spark circle{fill:var(--sc)}
  .mrange{margin-top:2px}
  .mrlbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:6px}
  .mrbar{position:relative;height:7px;border-radius:999px;background:linear-gradient(90deg,var(--buy),var(--hold) 55%,var(--dont))}
  .mrnow{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--surface);z-index:2}
  .mrbuy{position:absolute;top:50%;transform:translate(-50%,-50%);width:3px;height:15px;border-radius:2px;background:var(--buy);box-shadow:0 0 0 1.5px var(--surface);z-index:1}
  .mrends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;gap:8px}
  .mrends span:nth-child(2){color:var(--ink);font-weight:800}
  .mrunner{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:13px;line-height:1.5}
  .mrunner .rh{font-weight:800;color:var(--broth);margin-bottom:4px}
  .mrunner a{color:var(--ink);text-decoration:none}.mrunner a:hover{color:var(--broth)}

  /* JOURNEY */
  .chef-note{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:14px;margin-bottom:14px;color:var(--ink)}
  .chef-note b{color:var(--broth)}
  .journey{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}  /* flex-start = cards size to content, no dead space */

var CE_COLORS=['#FF6B1A','#23C267','#4C9AFF','#FFC53D','#B692FF','#FF4D4D'];
function renderChangeEnv(D, pulses, mkt){
  if(!pulses || pulses.length<2) return pulseBanner(D);

  var n=pulses.length, W=300, H=96;

  });
  var allp=[]; series.forEach(function(s){s.pct.forEach(function(v){if(v!=null)allp.push(v);});});

  var lines=series.map(function(s){
    var pts=[]; s.pct.forEach(function(v,i){if(v!=null)pts.push(X(i).toFixed(1)+','+Y(v).toFixed(1));});
    var last=pts[pts.length-1]?pts[pts.length-1].split(','):null;

  // Endpoint labels = the ticker on the line (replaces the bottom legend). Only MOVERS get a label;

  var _all=series.map(function(s){var lv=s.pct[s.pct.length-1];return {sym:s.sym,color:s.color,last:s.last,y:lv!=null?(Y(lv)/H*100):null};}).filter(function(x){return x.y!=null;});
  var _labs=_all.filter(function(l){return Math.abs(l.last)>=0.15;});
  var _flatL=_all.filter(function(l){return Math.abs(l.last)<0.15;});
  _labs.sort(function(a,b){return a.y-b.y;});
  var MINGAP=12;
  for(var _i=1;_i<_labs.length;_i++){ if(_labs[_i].y-_labs[_i-1].y<MINGAP) _labs[_i].y=_labs[_i-1].y+MINGAP; }
  var _over=(_labs.length?_labs[_labs.length-1].y:0)-96;
  if(_over>0){ for(_i=0;_i<_labs.length;_i++) _labs[_i].y-=_over; }

  var prox=picks.filter(function(pk){return pk.nEntry&&pk.now;}).sort(function(a,b){return (a.now/a.nEntry)-(b.now/b.nEntry);}).map(function(pk){

      '<span class="pxg"><span class="pxbuy">Buy @ '+esc(pk.cur)+pk.nEntry+'</span></span></div>';
  }).join('');
  var latest=pulses[pulses.length-1];
  return '<section><div class="sec-head"><h2 class="display"><span class="k">01½</span> Change environment</h2>'+infoBtn('changeenv')+'</div>'+
    '<p class="sec-sub">How each pick moved across the last '+n+' runs (since '+esc(pulses[0].stamp)+'), and how close each is to its ideal buy — where to act.</p>'+
    '<div class="cenv"><div class="cetraj"><div class="ceh">📈 Trajectories · % from first run</div>'+
      '<div class="cechartwrap"><svg class="cechart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+zero+lines+'</svg>'+labHtml+'</div>'+flatHtml+'</div>'+
      '<div class="ceprox"><div class="ceh">🎯 Ready to buy? · distance to ideal buy</div>'+(prox||'<div class="pxg">No entry levels.</div>')+
      '<div class="proxkey"><b style="color:var(--buy)">green</b> = at/below your buy price → act · <b>grey</b> = above → wait for it to dip to your entry. A “too late — wait” pick (e.g. PLTR) shows the dip it still needs.</div></div></div>'+
    '<div class="celastcheck"><span class="pdot"></span>Last checked '+esc(latest.stamp)+' · '+n+' runs tonight · re-priced hourly. The overall risk read is up top.</div></section>';

function pulseBanner(D){

function sparkSVG(vals){
  if(!vals||vals.length<2) return '';

  var up=vals[vals.length-1]>=vals[0], poly=pts.join(' '), last=pts[pts.length-1].split(',');

    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.2"/></svg>';
}
// Inline mini-trajectory: the price path across our hourly runs, FIRST run → now.
// Hidden when there's no real movement (e.g. market closed) so it never shows a meaningless 0.0%.
function miniTraj(sym){
  if(!PULSES||PULSES.length<2) return '';
  var vals=PULSES.map(function(pu){return (pu.snap&&pu.snap[sym]?pu.snap[sym].price:null);}).filter(function(v){return v!=null;});
  if(vals.length<2) return '';
  var first=vals[0], last=vals[vals.length-1], pct=(last/first-1)*100;
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  var spread=first?((mx-mn)/first*100):0;
  if(spread<0.2) return '';                     // essentially flat (market closed / dead quiet) — don't show
  var rng=(mx-mn)||1, W=52, H=15;
  var pts=vals.map(function(v,i){return (i/(vals.length-1)*W).toFixed(1)+','+(H-((v-mn)/rng)*(H-3)-1.5).toFixed(1);}).join(' ');
  var col=pct>0.05?'var(--buy)':pct<-0.05?'var(--dont)':'var(--muted)';
  var since=String(PULSES[0].stamp||'').split(' ').pop();   // e.g. "23:33" — the window start
  return '<div class="tonight" title="Change across our hourly runs since '+esc(since)+' — separate from the daily move up top">'+
    '<span class="tnl">since '+esc(since)+'</span>'+
    '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>'+
    '<span class="mtpct" style="color:'+col+'">'+(pct>=0?'+':'')+pct.toFixed(1)+'%</span></div>';
}
function rangeBar(spark,cur,tf,entry){
  if(!spark||spark.length<3) return '';
  // Window matches the pick's horizon: Day→recent, Week→~1 week, Long→~1 month.
  var t=String(tf||'').toLowerCase();
  var win, lbl;
  if(t.indexOf('day')>=0){ win=5; lbl='5-day range'; }
  else if(t.indexOf('week')>=0){ win=10; lbl='2-week range'; }
  else { win=Math.min(spark.length,22); lbl='1-month range'; }
  var s=spark.slice(-win); if(s.length<2) s=spark.slice(-3);
  var mn=Math.min.apply(null,s),mx=Math.max.apply(null,s),c=s[s.length-1];
  // include the ideal-buy in the scale so its marker always lands on the bar
  if(entry!=null){ mn=Math.min(mn,entry); mx=Math.max(mx,entry); }
  var span=(mx-mn)||1;
  var pos=Math.max(3,Math.min(97,((c-mn)/span)*100));
  var buyPos=(entry!=null)?Math.max(2,Math.min(98,((entry-mn)/span)*100)):null;
  return '<div class="mrange"><div class="mrlbl">'+lbl+' · low → high</div>'+
    '<div class="mrbar">'+(buyPos!=null?'<span class="mrbuy" style="left:'+buyPos.toFixed(0)+'%" title="ideal buy '+cur+entry+'"></span>':'')+'<span class="mrnow" style="left:'+pos.toFixed(0)+'%"></span></div>'+
    '<div class="mrends"><span>'+cur+mn.toFixed(2)+'</span><span>now '+cur+c.toFixed(2)+'</span><span>'+cur+mx.toFixed(2)+'</span></div></div>';
}
function ruCard(ru,region,idx){var da=(region!=null?' data-region="'+region+'" data-idx="'+idx+'" tabindex="0" role="button"':'');
  var rv=ru.verdict||'Get in', rvc=ru.vclass||(/wait|late|skip/i.test(rv)?'hold':'buy');
  return '<article class="rucard'+(region!=null?' tappable':'')+'"'+da+'><div class="rutag">🥈 Runner-up<span class="verdict '+esc(rvc)+'" style="margin-left:auto">'+esc(rv)+'</span></div>'+
  '<div class="rutop"><span class="rusym">'+esc(ru.sym)+'</span>'+

  '<div class="ruline">'+esc(ru.line)+'</div></article>';}
function money(cur,n){return cur+(Math.abs(n%1)<1e-9?String(n):n.toFixed(2));}

// Action that moves with the ideal-buy price: at/below → get in, above → wait for the dip.
// The real discovery funnel (only shown once a full run logs D.discovery — makes "48" real & inspectable)
function discoveryFunnel(D){
  var dv=D.discovery; if(!dv||!dv.scanned) return '';
  var m=(D.candidates||[]).length;
  var list=(dv.tickers||[]).map(function(t){return '<span class="dvpill"><b>'+esc(t.sym)+'</b>'+(t.signal?' <small>'+esc(t.signal)+'</small>':'')+'</span>';}).join('');
  return '<div class="funnel"><div class="fnrow"><span class="fnn">'+dv.scanned+'</span> scanned <span class="fnar">→</span> <span class="fnn">'+m+'</span> shortlisted <span class="fnar">→</span> <span class="fnn">6</span> served</div>'+
    (list?'<details class="dvdet"><summary>see the '+dv.scanned+' we scanned this run</summary><div class="dvlist">'+list+'</div></details>':'')+'</div>';
}
function buyState(p){ if(p.nEntry==null||p.nNow==null) return ''; var g=(p.nNow/p.nEntry-1)*100; return g<=1.5?'in':(g<=4?'close':'wait'); }
function buyAction(p){

  var s=buyState(p); if(!s) return '';

function render(D,H){
  LAST={D:D,H:H};

  var menus=(D.regions||[]).map(function(rg,i){

        (p.spark?rangeBar(p.spark,rg.cur||'$',p.tf,p.nEntry):'')+'</article>'+

  var names=(H&&H.names)||{}, ms=(H&&H.menus)||[];

    var pct=(o.ret>=0?'+':'')+(Math.round(o.ret*1000)/10)+'%';
    var tip=(o.correct?'✓ we got this right':'✗ this one missed')+' · '+pct+' — tap to see what happened';
    return '<span class="jg '+(o.correct?'jg-win':'jg-loss')+'" data-gsym="'+esc(key)+'" role="button" tabindex="0" title="'+esc(tip)+'">'+(o.correct?'✓':'✗')+'</span>';
  }
  function jcol(m,older,isNow){
    function grp(label,arr,region){
      var olderSet=older?older[region]:null;
      var rows=(arr||[]).map(function(sym,idx){
        var isNew=olderSet?olderSet.indexOf(sym)<0:false;
        var nm=names[String(sym).replace(/\*$/,'')]||'';

      });

    function tally(arr){

function openTimeframe(tf){
  if(!(OUTCOMES&&OUTCOMES.outcomes))return;
  LASTFOCUS=document.activeElement;
  var all=Object.keys(OUTCOMES.outcomes).map(function(k){return OUTCOMES.outcomes[k];}).filter(function(o){return o.tf===tf;});
  var graded=all.filter(function(o){return o.status==='graded';}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var pending=all.filter(function(o){return o.status!=='graded';});
  var wins=graded.filter(function(o){return o.correct;}).length, n=graded.length;
  var TL={Day:'Day trades',Week:'Week holds',Long:'Long holds'};
  var TW={Day:'each checked the next trading day',Week:'each checked after about a week',Long:'each checked after about a month'};
  var wr=n?Math.round(wins/n*100):0, vc=wr>=60?'buy':wr>=40?'hold':'don';

  }
  var TN={Day:'day-trade',Week:'week',Long:'long-hold'};
  var body='<p class="mtake">Every <b>'+TN[tf]+'</b> call we\'ve made — '+TW[tf]+'. <b class="'+(wr>=50?'up':'down')+'">Right '+wins+' of '+n+'</b> ('+wr+'%).</p>'+
    '<div class="tflist">'+(graded.map(row).join('')||'<p class="muted">No graded calls yet.</p>')+
    (pending.length?'<div class="tfpend-h">Still open</div>'+pending.map(row).join(''):'')+'</div>'+
    '<p style="font-size:11.5px;color:var(--faint);margin-top:12px">Green ✓ = it made money in its window. <span class="idxbeat">beat mkt</span> = also beat the market. Tap any row for the full story.</p>';
  var m=document.getElementById('modal'); m.className='modal';
  m.innerHTML='<div class="mhead '+vc+'"><button class="mclose" id="mClose" aria-label="Close">✕</button>'+
    '<div class="mtf">📊 Scored honestly</div><div class="mtop"><div class="msym" style="font-size:22px">'+tfB(tf)+' '+esc(TL[tf])+'</div></div>'+
    '<span class="mverd '+(vc==='buy'?'v-buy':vc==='don'?'v-dont':'v-hold')+'">'+wr+'% right</span></div>'+
    '<div class="mbody">'+body+'</div>';
  var ov=document.getElementById('overlay'); ov.classList.add('open'); ov.setAttribute('aria-hidden','false');
  document.getElementById('mClose').focus();
  m.querySelectorAll('.tfrow.graderow').forEach(function(r){
    function go(){ openGrade(r.dataset.gsym); }
    r.addEventListener('click',go);
    r.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
}

  (D.regions||[]).forEach(function(rg){(rg.picks||[]).forEach(function(p,i){if(p.sym===sym&&!res)res={kind:'pick',p:p,region:rg.id,idx:i,cur:rg.cur||'$'};});});
  if(res)return res;
  var ci=-1,c=null; (D.candidates||[]).forEach(function(x,i){ if(x.sym===sym&&!c){c=x;ci=i;} }); if(c)return {kind:'cand',c:c,idx:ci};
  var wi=(D.watchlistIntel||{})[sym]; if(wi&&!wi.error)return {kind:'intel',wi:wi};
  return {kind:'none'};
}

    fetch(API_BASE+'/quote?sym='+encodeURIComponent(sym)+'&region='+encodeURIComponent(reg)).then(function(r){return r.ok?r.json():null;}).then(function(q){
      var slot=card.querySelector('.tsc-slot'); if(!slot||!q||q.price==null)return;
      var up=(q.change_p||0)>=0;
      slot.classList.remove('tsc-slot');
      slot.innerHTML='<span class="tsc-px">'+cur+(+q.price).toFixed(2)+'</span><span class="tsc-chg '+(up?'up':'down')+'">'+(up?'▲':'▼')+' '+(q.change_p>=0?'+':'')+(+q.change_p).toFixed(1)+'%</span>';
    }).catch(function(){});
    fetch(API_BASE+'/history?sym='+encodeURIComponent(sym)+'&region='+encodeURIComponent(reg)).then(function(r){return r.ok?r.json():null;}).then(function(h){
      var slot=card.querySelector('.tsc-sparkslot'); if(!slot||!h||!h.closes||h.closes.length<3)return;
      slot.innerHTML=sparkSVG(h.closes.slice(-30)); slot.classList.remove('tsc-sparkslot');

function timeAgo(iso){

  try{ var mins=Math.round((Date.now()-new Date(iso).getTime())/60000);
    if(mins<1) return 'just now'; if(mins<60) return mins+'m ago';
    var h=Math.floor(mins/60); return h+'h '+(mins%60)+'m ago'; }catch(e){ return ''; }
}

// ---- Accounts / cross-device sync (Cloudflare backend) ----
var API_BASE='https://stocksoup-api.defranceski.workers.dev';
var SKEY='soup_session', EKEY='soup_email';
function sessGet(){try{return localStorage.getItem(SKEY)||'';}catch(e){return'';}}
function sessSet(t){try{t?localStorage.setItem(SKEY,t):localStorage.removeItem(SKEY);}catch(e){}}
function signedIn(){return !!sessGet();}
function apiHdr(){return {'Authorization':'Bearer '+sessGet(),'Content-Type':'application/json'};}
function apiPush(method,path,body){ if(!signedIn())return; try{fetch(API_BASE+path,{method:method,headers:apiHdr(),body:body?JSON.stringify(body):undefined}).then(function(r){if(r.status===401){sessSet('');}}).catch(function(){});}catch(e){} }
// Pull the server list on sign-in; merge any device-only items up first (nothing lost), then mirror down.
function syncFromBackend(cb){
  if(!signedIn()){cb&&cb();return;}
  fetch(API_BASE+'/me/watchlist',{headers:apiHdr()}).then(function(r){ if(r.status===401){sessSet('');throw 0;} return r.ok?r.json():null; }).then(function(j){
    if(j&&j.watchlist){
      var server=j.watchlist.map(function(w){return {sym:w.sym,region:w.region,entry:w.entry};});
      var have={}; server.forEach(function(w){have[w.sym+'|'+w.region]=1;});
      var missing=wlGet().filter(function(w){return !have[w.sym+'|'+w.region];});
      if(missing.length){ apiPush('POST','/me/import',{items:missing.map(function(w){return {sym:w.sym,region:w.region,entry:wlNum(w.entry)||null};})}); server=server.concat(missing); }
      wlSet(server);
    }
    cb&&cb();
  }).catch(function(){cb&&cb();});
}
// ---- Smart watchlist (localStorage source-of-truth; write-through to backend when signed in) ----
var WLKEY='soup_watchlist';
function wlGet(){try{return JSON.parse(localStorage.getItem(WLKEY)||'[]');}catch(e){return[];}}
function wlSet(a){try{localStorage.setItem(WLKEY,JSON.stringify(a));}catch(e){}}
function wlHas(sym,region){return wlGet().some(function(w){return w.sym===sym&&w.region===region;});}
function wlAddItem(it){var a=wlGet();if(!a.some(function(w){return w.sym===it.sym&&w.region===it.region;})){a.push(it);wlSet(a);apiPush('POST','/me/watchlist',{sym:it.sym,region:it.region,entry:(wlNum(it.entry)||it.entry||null)});}}
function wlRemove(sym,region){wlSet(wlGet().filter(function(w){return !(w.sym===sym&&w.region===region);}));apiPush('DELETE','/me/watchlist/'+region+'/'+sym);}
function wlToggle(it){if(wlHas(it.sym,it.region)){wlRemove(it.sym,it.region);return false;}wlAddItem(it);return true;}
function wlNum(s){var v=(String(s==null?'':s)).match(/([\d.]+)/);return v?parseFloat(v[1]):null;}
function wlPriceMap(D){
  var m={};
  function put(sym,region,price,up,change,entry,name,spark){var p=wlNum(price);var k=sym+'|'+region;
    if(!m[k])m[k]={price:p,cur:region==='au'?'A$':'$',up:!!up,change:change,entry:(entry!=null?entry:null),name:name||null,spark:spark||null};
    else{ if(p!=null&&m[k].price==null)m[k].price=p; if(entry!=null&&m[k].entry==null)m[k].entry=entry; if(name&&!m[k].name)m[k].name=name; if(spark&&!m[k].spark)m[k].spark=spark; }}
  (D.regions||[]).forEach(function(rg){(rg.picks||[]).forEach(function(p){put(p.sym,rg.id,p.price,p.up,p.change,p.nEntry,p.name,p.spark);});});
  (D.candidates||[]).forEach(function(c){put(c.sym,c.region,c.price,c.up,c.change,null,c.name,c.spark);});
  (D.defaultWatchlist||[]).forEach(function(w){put(w.sym,w.region,w.price,w.up,w.change,null,w.name,w.spark);});
  return m;
}
// Smart overlay for a watched ticker: pull the richest intel we already hold.
// Priority: current pick (full, tappable) > scored shared-watchlist intel > candidate > none.
function wlIntel(w,D){
  var pick=null,preg=null,pidx=null,pcur='$';
  (D.regions||[]).forEach(function(rg){(rg.picks||[]).forEach(function(p,i){if(p.sym===w.sym&&rg.id===w.region){pick=p;preg=rg.id;pidx=i;pcur=rg.cur||'$';}});});
  if(pick) return {kind:'pick',region:preg,idx:pidx,cur:pcur,
    score:(pick.score&&!pick.score.pending?(pick.score.buy_now+'/100 · '+pick.score.band):null),
    target:pick.nTarget,entry:pick.nEntry,verdict:pick.verdict,vclass:pick.vclass,catalyst:(pick.catalysts||[])[0]||pick.plain};
  var wi=(D.watchlistIntel||{})[w.sym];
  if(wi && wi.region===w.region && !wi.error){
    var vclass=/get in|buy|nibble/i.test(wi.verdict||'')?'buy':/wait|late|skip|pass/i.test(wi.verdict||'')?'dont':'hold';
    return {kind:'intel',cur:wi.cur||pcur,entry:wi.entry,target:wi.target,
      score:(wi.buy_now!=null?(wi.buy_now+'/100 · '+wi.band):null),
      verdict:wi.verdict||null,vclass:vclass,trend:wi.trend,asx:!!wi.asx_limited,sent:wi.sent};
  }
  var c=(D.candidates||[]).filter(function(x){return x.sym===w.sym&&x.region===w.region;})[0];
  if(c) return {kind:'cand',note:c.note,heat:c.heat};
  return {kind:'none'};
}

  var tb=document.getElementById('trackBtn'), tc=document.getElementById('trackCta');
  if(TRACK){ if(tb)tb.onclick=openTrackRecord; if(tc)tc.onclick=openTrackRecord; }
  else { if(tb)tb.style.display='none'; if(tc)tc.style.display='none'; }
  wireInfo();
  wireThemes();
  var tabs=document.querySelectorAll('.tab[data-region]');
  tabs.forEach(function(t){t.addEventListener('click',function(){
    if(t.dataset.region===MKT)return;
    MKT=t.dataset.region;                 // global market → the whole full view follows
    var sc=window.pageYOffset;
    render(LAST.D,LAST.H);
    window.scrollTo(0,sc);
  });});
  function regionOf(id){var a=(D.regions||[]).filter(function(x){return x.id===id;});return a[0];}
  function openFromEl(el){var rg=regionOf(el.dataset.region);if(!rg)return;var p=rg.picks[+el.dataset.idx];if(p)openModal(p,rg.id,rg.cur||'$');}
  document.querySelectorAll('.card').forEach(function(c){
    c.addEventListener('click',function(e){if(e.target.closest('a'))return;openFromEl(c);});
    c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openFromEl(c);}});
  });
  document.querySelectorAll('.rucard.tappable').forEach(function(rc){
    function openRu(){var rg=regionOf(rc.dataset.region);if(rg){var p=rg.picks[+rc.dataset.idx];if(p&&p.runnerUp)openModal(p.runnerUp,rg.id,rg.cur||'$');}}
    rc.addEventListener('click',function(e){if(e.target.closest('a'))return;openRu();});
    rc.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openRu();}});
  });
  // ---- Watchlist (uses the global smart-watchlist module) ----
  var wlRegion='au';
  var wau=document.getElementById('wlAu'),wus=document.getElementById('wlUs');
  if(wau&&wus){wau.onclick=function(){wlRegion='au';wau.setAttribute('aria-pressed','true');wus.setAttribute('aria-pressed','false');};
    wus.onclick=function(){wlRegion='us';wus.setAttribute('aria-pressed','true');wau.setAttribute('aria-pressed','false');};}
  function wlAdd(){var inp=document.getElementById('wlInput');if(!inp)return;var v=(inp.value||'').trim().toUpperCase().replace(/[^A-Z0-9.]/g,'');if(!v)return;wlAddItem({sym:v,region:wlRegion});inp.value='';renderWatchlist();syncWatchButtons();}
  var ab=document.getElementById('wlAdd');if(ab)ab.onclick=wlAdd;
  var wi=document.getElementById('wlInput');if(wi)wi.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();wlAdd();}});
  // Wire every ＋Watch button (cards, modal, pot) to the shared toggle
  document.querySelectorAll('.watchbtn[data-sym]').forEach(function(b){
    b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();watchToggleFromEl(b);});
  });
  syncWatchButtons();
  // The seeded 'smart watching' list belongs to the ADMIN only — new users start with an empty watchlist.
  try{
    if(isAdmin() && !localStorage.getItem('soup_wl_seeded') && (D.defaultWatchlist||[]).length && !wlGet().length){
      var seed=D.defaultWatchlist.map(function(w){return {sym:w.sym,region:w.region};});
      wlSet(seed);
      if(signedIn()) apiPush('POST','/me/import',{items:seed});   // → David's backend account, syncs across his devices
    }
    if(isAdmin() && (D.defaultWatchlist||[]).length) localStorage.setItem('soup_wl_seeded','1');
  }catch(e){}
  renderWatchlist();

  // ---- Archive (live report index) ----
  var arch=document.getElementById('archList');
  function renderArch(items){
    if(!arch)return;
    if(!items||!items.length){arch.innerHTML='<div class="wlempty">The full archive loads on the live site.</div>';return;}
    arch.innerHTML=items.map(function(e){
      var risk=e.riskOff?'⛔ Risk-off':'⚪ Neutral';
      return '<a class="acard" href="reports/'+esc(e.file)+'" target="_blank" rel="noopener"><div class="adate">'+esc(e.label||e.timestamp||e.file)+'</div><div class="apicks">'+esc((e.picks||'').slice(0,140))+'</div><span class="arisk">'+risk+'</span></a>';
    }).join('');
    var more=document.getElementById('archMore');
    if(items.length>3){
      arch.classList.add('archcollapsed');
      if(more){ more.innerHTML='<button class="archtoggle" id="archTog">Show '+(items.length-3)+' more →</button>';
        document.getElementById('archTog').onclick=function(){ var c=arch.classList.toggle('archcollapsed'); this.textContent=c?('Show '+(items.length-3)+' more →'):'Show fewer ↑'; };
      }
    } else if(more){ more.textContent=''; }
  }
  fetch('reports/report-index.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){renderArch(j);}).catch(function(){renderArch(null);});

  var lvl=(D.risk&&D.risk.level!=null)?D.risk.level:50;
  requestAnimationFrame(function(){var n=document.getElementById('needle');if(n)n.style.left=lvl+'%';});
}

document.getElementById('overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();
  else if(e.target&&e.target.id==='mClose'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();closeModal();}});
document.getElementById('overlay').addEventListener('click',function(e){if(e.target&&e.target.id==='mClose')closeModal();});

/* ---- View mode: simple (mobile default) vs full, with toggle ---- */
var VIEW = null, SREGION = 'au', PULSES = null, TRACK = null, MKT = 'au', OUTCOMES = null, TAB = null;
function switchTab(t){
  TAB = t; try{ localStorage.setItem('soup_tab', t); }catch(e){}
  document.querySelectorAll('.tabbtn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===t); });
  document.querySelectorAll('.tabview').forEach(function(v){ v.classList.toggle('active', v.id==='tab-'+t); });
  window.scrollTo(0,0);
}
function setView(v){ VIEW = v; try{ localStorage.setItem('soup_view', v); }catch(e){} applyView(); }
function applyView(){ if(!LAST) return; window.scrollTo(0,0); if(VIEW==='simple') renderSimple(LAST.D); else render(LAST.D, LAST.H); }
function boot(D,H){
  LAST = {D:D, H:H};
  if(VIEW===null){ try{ VIEW=localStorage.getItem('soup_view'); }catch(e){} if(!VIEW) VIEW = (window.innerWidth<768?'simple':'full'); }
  applyView();
}
var BIG = {"Day":"⚡ TODAY","Week":"📅 THIS WEEK","Long":"📈 LONG GAME"};

function renderSimple(D){
  var r = D.risk||{};
  var sStamp = (D.stamp||'').replace(/,?\s*20\d\d/,'').replace(/\s*AEST\b/,'');
  var btcUp = (r.btcChange||'').indexOf('-')<0;
  var riskWhat = (r.label&&r.label.indexOf('OFF')>=0) ? "🔴 Risk-off — playing defence, smaller bets."
               : (r.label&&r.label.indexOf('ON')>=0)  ? "🟢 Risk-on — leaning into growth."
               : "⚪ Steady — we’re not dialling risk up or down tonight. The needle sits in the middle.";
  var region = (D.regions||[]).filter(function(x){return x.id===SREGION;})[0] || (D.regions||[])[0];
  var rid = region?region.id:'au';
  var regBtns = (D.regions||[]).map(function(rg){return '<button data-region="'+rg.id+'" aria-pressed="'+(rg.id===rid)+'">'+esc(rg.label)+'</button>';}).join('');
  var cards = (region?region.picks:[]).map(function(p,idx){
    var tf = (p.tf.split(' ')[1]||p.tf);
    return '<article class="scard" tabindex="0" role="button" data-region="'+rid+'" data-idx="'+idx+'" aria-label="Details for '+esc(p.sym)+'">'+
      '<div class="stf"><span>'+tfBW(p.tf)+'</span><button class="watchbtn iconwatch" data-sym="'+esc(p.sym)+'" data-region="'+esc(rid)+'" data-name="'+esc(p.name)+'"'+(p.nEntry!=null?' data-entry="'+p.nEntry+'"':'')+' aria-pressed="false" title="Add to watchlist">+</button></div>'+
      '<div class="ssym">'+esc(p.sym)+' <span class="sverd '+esc(p.vclass)+'">'+esc(p.verdict)+'</span></div>'+
      '<div class="sname">'+esc(p.name)+' · '+esc(p.price)+' <span class="'+(p.up?'up':'down')+'">'+(p.up?'▲':'▼')+' '+esc(p.change)+'</span></div>'+
      /* miniTraj removed — inconsistent (only carried-over picks had it) + confusing 'since 23:33'; the range bar shows the trend */
      '<div class="buyat'+(p.nEntry?' ba-'+buyState(p):'')+'">'+(p.nEntry?'<span class="bl">🎯 Ideal buy</span> ~'+esc(region.cur||'$')+p.nEntry+buyAction(p):'<span class="bl">Track this pick</span>')+'</div>'+
      '<div class="sline">'+esc(p.plain)+'</div>'+
      (p.spark?rangeBar(p.spark,(region.cur||'$'),p.tf,p.nEntry):'')+'</article>'+
      ((p.runnerUp && /wait|late|hold|skip|avoid|pass|don.t|steer/i.test(p.verdict||''))?ruCard(p.runnerUp,rid,idx):'');
  }).join('');
  function _grp(arr,key){var b=[],o=[],s=[];(arr||[]).forEach(function(x){var t=x.tclass,n=x[key];if(t==='t-dont')s.push(n);else if(t==='t-buy'||t==='t-hot')b.push(n);else o.push(n);});return {b:b,o:o,s:s};}
  function _line(g){var p=[];if(g.b.length)p.push('<span class="qbuy">✅ Buy: '+g.b.map(esc).join(', ')+'</span>');if(g.o.length)p.push('<span class="qmeh"><span class="qdot"></span> Watch: '+g.o.map(esc).join(', ')+'</span>');if(g.s.length)p.push('<span class="qskip">⛔ Skip: '+g.s.map(esc).join(', ')+'</span>');return p.join('<br>');}
  var quick='<div class="squick">'+
    '<div><div class="qh">🌍 Geopolitics</div><div class="qrow">'+_line(_grp(D.geo,'title'))+'</div></div>'+
    '<div><div class="qh">🍳 Sectors — buy vs skip</div><div class="qrow">'+_line(_grp(D.sectors,'title'))+'</div></div>'+
    '<div><div class="qh">🛢️ Commodities</div><div class="qrow">'+_line(_grp(D.commodities,'name'))+'</div></div>'+
    '</div>';
  document.getElementById('app').innerHTML =
    '<div class="simple"><div class="shero"><div class="brandrow"><div class="brand"><span class="bowl">🍲</span> Stock Soup</div>'+
      '<div style="display:flex;gap:8px;align-items:center"><button class="viewbtn" id="viewFull">📋 Full</button>'+
      '<button class="chip toggle" id="themeBtn2" aria-label="Toggle theme">🌗</button></div></div>'+
      '<div class="seyebrow schedlink" data-info="schedule" role="button" tabindex="0" title="How the run schedule works">'+esc(sStamp)+(D.next?' · next <b>~'+esc(D.next)+'</b>':'')+' <span class="schedi">i</span></div>'+
      '<div class="sregion" role="group" aria-label="Market">'+regBtns+'</div>'+
      '<div class="smood">Tonight: <span class="hot">'+esc(D.headline.a)+'</span> &amp; <span class="hot">'+esc(D.headline.b)+'</span></div>'+
      (D.chefShort?'<p class="schef">'+esc(D.chefShort)+'</p>':'')+
      '<div class="schips"><span class="chip mono">₿ <span class="'+(btcUp?'up':'down')+'">'+(btcUp?'▲':'▼')+'</span> '+esc(r.btcChange)+'</span>'+
      '<span class="chip mono">AUD '+esc(r.audusd)+(r.audusdChange?' <span class="'+(r.audusdUp?'up':'down')+'">'+(r.audusdUp?'▲':'▼')+esc(r.audusdChange)+'</span>':'')+'</span></div>'+
      '<div class="meter"><div class="track"><div class="needle" id="sneedle"></div></div>'+
      '<div class="lbls"><span>🔴 Hide the cash</span><span>⚪ Steady</span><span>🟢 Send it</span></div></div>'+
      '<div class="riskwhat">'+esc(riskWhat)+'</div></div>'+
    cards+
    (PULSES?renderChangeEnv(D,PULSES,SREGION):pulseBanner(D))+
    quick+
    '<div class="sbottom">'+esc(D.hotTags)+' — tap a card for the full story.</div>'+
    '<button class="sfull" id="viewFull2">Show me everything → the full menu</button>'+
    '<footer>Not financial advice — do your own research. · Stock Soup, served hot, hourly</footer></div>';
  wireSimple(D);
}
function wireSimple(D){
  var root=document.documentElement;
  var t=document.getElementById('themeBtn2'); if(t) t.onclick=function(){var c=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');root.setAttribute('data-theme',c==='dark'?'light':'dark');};
  ['viewFull','viewFull2'].forEach(function(id){var b=document.getElementById(id);if(b) b.onclick=function(){setView('full');};});
  document.querySelectorAll('.sregion button').forEach(function(b){b.onclick=function(){SREGION=b.dataset.region;renderSimple(D);};});
  function regionOf(id){return (D.regions||[]).filter(function(x){return x.id===id;})[0];}
  document.querySelectorAll('.scard').forEach(function(c){
    function open(){var rg=regionOf(c.dataset.region);if(rg){var p=rg.picks[+c.dataset.idx];if(p) openModal(p,rg.id,rg.cur||'$');}}
    c.addEventListener('click',open);
    c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  });
  document.querySelectorAll('.rucard.tappable').forEach(function(rc){
    function openRu(){var rg=regionOf(rc.dataset.region);if(rg){var p=rg.picks[+rc.dataset.idx];if(p&&p.runnerUp) openModal(p.runnerUp,rg.id,rg.cur||'$');}}
    rc.addEventListener('click',function(e){if(e.target.closest('a'))return;openRu();});
    rc.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openRu();}});
  });
  document.querySelectorAll('.watchbtn[data-sym]').forEach(function(b){
    b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();watchToggleFromEl(b);});
  });
  syncWatchButtons();
  wireInfo();
  var lvl=(D.risk&&D.risk.level!=null)?D.risk.level:50;
  requestAnimationFrame(function(){var n=document.getElementById('sneedle');if(n)n.style.left=lvl+'%';});
}

function flashToast(msg){
  var t=document.createElement('div'); t.className='toast'; t.innerHTML=msg;
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ if(t.parentNode)t.remove(); },300); }, 2400);
}
var _refreshing=false;
function refreshPrices(btn){
  if(_refreshing) return; _refreshing=true;
  if(btn){ btn.classList.add('spinning'); }
  var beforeIso=(PULSES&&PULSES.length)?PULSES[PULSES.length-1].iso:null;
  var started=Date.now();
  return new Promise(function(resolve){
    loadGated(function(b){
      var d=b&&b.latest, h=b&&b.menuHistory;
      if(b&&b.pulseHistory&&b.pulseHistory.pulses&&b.pulseHistory.pulses.length>1) PULSES=b.pulseHistory.pulses;
      if(b&&b.trackRecord&&b.trackRecord.record) TRACK=b.trackRecord;
      if(b&&b.outcomes&&b.outcomes.outcomes) OUTCOMES=b.outcomes;
      var afterIso=(PULSES&&PULSES.length)?PULSES[PULSES.length-1].iso:null;
      var fresh=afterIso&&afterIso!==beforeIso;
      setTimeout(function(){
        var sc=window.pageYOffset;
        boot(d&&d.regions?d:EMBEDDED, h&&h.menus?h:HIST_EMBED);
        window.scrollTo(0,sc);
        _refreshing=false;
        flashToast(fresh?'✓ Prices refreshed — updated just now':'Already up to date · last run '+(afterIso?timeAgo(afterIso):'—')+'<br><span style="opacity:.7;font-weight:600">New prices publish each hourly run.</span>');
        resolve();
      }, Math.max(0, 450-(Date.now()-started)));
    });
  });
}
// capture the magic-link session handed back in the redirect hash (#session=…), then sync the list
(function(){var m=(location.hash||'').match(/session=([^&]+)/);if(m){sessSet(decodeURIComponent(m[1]));try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}})();
if(signedIn()) syncFromBackend(function(){ if(document.getElementById('wlPills')){renderWatchlist();syncWatchButtons();} });
// The picks bundle is members-only — fetched from the Worker with the session token, never a public file.
function loadGated(cb){
  fetch(API_BASE+'/data',{headers:{'Authorization':'Bearer '+sessGet()},cache:'no-store'})
    .then(function(r){ if(r.status===401){ sessSet(''); location.replace('index.html'); throw 0; } return r.ok?r.json():null; })
    .then(function(b){ cb(b||null); }).catch(function(){ cb(null); });
}
function applyBundle(b){
  if(!b) return false;
  var d=b.latest, h=b.menuHistory, pu=b.pulseHistory, tr=b.trackRecord, oc=b.outcomes;
  if(pu&&pu.pulses&&pu.pulses.length>1) PULSES=pu.pulses;
  if(tr&&tr.record) TRACK=tr;
  if(oc&&oc.outcomes) OUTCOMES=oc;
  if((d&&d.regions)||(h&&h.menus)||PULSES||TRACK||OUTCOMES){ boot(d&&d.regions?d:EMBEDDED, h&&h.menus?h:HIST_EMBED); return true; }
  return false;
}
boot(EMBEDDED,HIST_EMBED);
loadGated(applyBundle);
</script>
