<title>Stock Soup — Tonight's Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ground:#14100E; --surface:#1E1815; --surface-2:#271F1A; --line:#3A2F27;
    --broth:#FF6B1A; --buy:#23C267; --dont:#FF4D4D; --hold:#FFC53D;
    --ink:#F4EDE4; --muted:#A69A8C; --faint:#6E6154;
    --shadow:0 12px 40px -12px rgba(0,0,0,.7);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:light){
    :root{ --ground:#FBF6EF; --surface:#FFFFFF; --surface-2:#F3EADF; --line:#E4D7C6;
      --ink:#1E1815; --muted:#7A6C5C; --faint:#A99A88; --shadow:0 12px 40px -16px rgba(80,50,20,.25); }
  }
  :root[data-theme="dark"]{ --ground:#14100E; --surface:#1E1815; --surface-2:#271F1A; --line:#3A2F27;
    --ink:#F4EDE4; --muted:#A69A8C; --faint:#6E6154; --shadow:0 12px 40px -12px rgba(0,0,0,.7); }
  :root[data-theme="light"]{ --ground:#FBF6EF; --surface:#FFFFFF; --surface-2:#F3EADF; --line:#E4D7C6;
    --ink:#1E1815; --muted:#7A6C5C; --faint:#A99A88; --shadow:0 12px 40px -16px rgba(80,50,20,.25); }

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ground);color:var(--ink);font-family:var(--font);line-height:1.5;
    -webkit-font-smoothing:antialiased;padding:clamp(14px,3vw,40px)}
  .wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  .display{font-weight:900;letter-spacing:-.02em;text-wrap:balance;line-height:.98;text-transform:uppercase}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  .hero{background:radial-gradient(120% 140% at 100% 0%, rgba(255,107,26,.16), transparent 55%),var(--surface);
    border:1px solid var(--line);border-radius:20px;padding:clamp(20px,3.5vw,38px);position:relative;overflow:hidden}
  .brandrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:20px;letter-spacing:-.01em}
  .bowl{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 200deg,var(--broth),#FFB061,var(--broth));
    display:grid;place-items:center;font-size:20px;box-shadow:0 0 24px -4px var(--broth)}
  .live{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--buy);box-shadow:0 0 0 0 rgba(35,194,103,.6);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(35,194,103,.55)}70%{box-shadow:0 0 0 8px rgba(35,194,103,0)}100%{box-shadow:0 0 0 0 rgba(35,194,103,0)}}
  .hero h1{font-size:clamp(34px,7vw,68px);margin:14px 0 6px}
  .hero h1 .hot{color:var(--broth)}
  .chef{font-size:clamp(15px,2.2vw,19px);color:var(--muted);max-width:60ch;text-wrap:pretty}
  .chef b{color:var(--ink)}
  .metastrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .chip{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .toggle{cursor:pointer;font-family:var(--font);color:var(--ink)}
  .toggle:focus-visible{outline:2px solid var(--broth);outline-offset:2px}
  .meter{margin-top:18px}
  .meter .track{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--dont),var(--hold),var(--buy));position:relative;opacity:.9}
  .meter .needle{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 3px var(--surface);left:50%;transition:left .8s cubic-bezier(.2,.8,.2,1)}
  .meter .lbls{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:6px;font-weight:700}

  .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:2px}
  .sec-head h2{font-size:clamp(20px,3.4vw,30px)}
  .sec-head .k{color:var(--broth)}
  .sec-sub{color:var(--muted);font-size:14px;margin-bottom:16px}

  .tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
  .tab{border:0;background:transparent;color:var(--muted);font-family:var(--font);font-weight:800;font-size:13px;
    padding:8px 16px;border-radius:9px;cursor:pointer;letter-spacing:.02em;transition:.15s}
  .tab[aria-selected="true"]{background:var(--broth);color:#1a0f06}
  .tab:disabled{opacity:.45;cursor:not-allowed}
  .tab:focus-visible{outline:2px solid var(--broth);outline-offset:2px}

  .menu{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:760px){.menu{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;
    box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease}
  .card:hover{transform:translateY(-4px);border-color:var(--broth)}
  .card .tf{display:flex;align-items:center;justify-content:space-between}
  .tf .name{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .verdict{font-size:11px;font-weight:900;padding:5px 10px;border-radius:8px;letter-spacing:.04em;text-transform:uppercase}
  .v-buy{background:rgba(35,194,103,.16);color:var(--buy);border:1px solid rgba(35,194,103,.4)}
  .v-hold{background:rgba(255,197,61,.16);color:var(--hold);border:1px solid rgba(255,197,61,.4)}
  .v-dont{background:rgba(255,77,77,.16);color:var(--dont);border:1px solid rgba(255,77,77,.4)}
  .card .tick{display:flex;align-items:baseline;gap:10px}
  .tick .sym{font-size:30px;font-weight:900;letter-spacing:-.02em}
  .tick .px{margin-left:auto;text-align:right}
  .px .p{font-weight:800;font-size:17px}
  .px .c{font-size:12px;font-weight:700}
  .up{color:var(--buy)} .down{color:var(--dont)}
  .card .plain{font-size:14px;color:var(--ink);text-wrap:pretty}
  .card .co{color:var(--broth);font-weight:800}
  .card .lvls{display:flex;gap:6px;font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;flex-wrap:wrap}
  .lvls b{color:var(--ink)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
  .panel h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:800}
  .score{display:flex;gap:18px;align-items:center;margin-bottom:14px}
  .score .big{font-size:40px;font-weight:900;line-height:1}
  .score .sub{font-size:13px;color:var(--muted)}
  .rec{display:flex;flex-direction:column;gap:8px}
  .rec .row{display:flex;align-items:center;gap:10px;font-size:13px}
  .rec .rsym{font-weight:800;width:52px}
  .rec .bar{flex:1;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
  .rec .fill{position:absolute;top:0;bottom:0;border-radius:999px}
  .rec .res{width:74px;text-align:right;font-weight:800;font-family:var(--mono)}
  .cooking .row{justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px;align-items:center}
  .cooking .row:last-child{border-bottom:0}
  .cooking .st{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .stack{display:flex;flex-direction:column;gap:9px}
  .line{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14px}
  .line .em{font-size:18px}
  .line .txt{flex:1}
  .line .txt small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .tag{font-size:11px;font-weight:900;padding:4px 9px;border-radius:7px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
  .t-buy{background:rgba(35,194,103,.16);color:var(--buy)}
  .t-dont{background:rgba(255,77,77,.16);color:var(--dont)}
  .t-watch{background:rgba(255,197,61,.16);color:var(--hold)}

  .trail .step{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
  .trail .step:last-child{border-bottom:0}
  .trail .n{font-family:var(--mono);color:var(--broth);font-weight:800;font-size:13px;min-width:22px}
  .trail .st-txt{font-size:14px}
  .trail .st-txt small{color:var(--muted);display:block;margin-top:2px}

  .cta{display:flex;justify-content:center;margin-top:4px}
  .cta a{background:var(--broth);color:#1a0f06;font-weight:900;text-decoration:none;padding:15px 30px;border-radius:12px;
    font-size:15px;letter-spacing:.02em;box-shadow:0 8px 30px -8px var(--broth);transition:transform .15s}
  .cta a:hover{transform:translateY(-2px)}
  .cta a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  footer{text-align:center;color:var(--faint);font-size:11px;line-height:1.7;padding-top:6px}
  .hidden{display:none}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>

    '<div class="cols"><div class="stack"><div class="eyebrow">🌍 Geopolitics</div>'+lines(D.geo,'title')+'</div>'+
    '<div class="stack"><div class="eyebrow">🍳 Sectors — buy vs skip</div>'+lines(D.sectors,'title')+'</div></div></section>'+

  '<section><div class="sec-head"><h2 class="display"><span class="k">04</span> Commodities — simple</h2></div>'+
    '<p class="sec-sub">No jargon. Just: worth a look, or leave it.</p>'+
    '<div class="cols"><div class="stack">'+lines((D.commodities||[]).slice(0,2),'name')+'</div>'+
    '<div class="stack">'+lines((D.commodities||[]).slice(2),'name')+'</div></div></section>'+

  '<section><div class="sec-head"><h2 class="display"><span class="k">05</span> How we got here</h2></div>'+
    '<p class="sec-sub">The recipe, in plain sight. No black box.</p>'+
    '<div class="panel trail">'+trail+'</div></section>'+

  '<div class="cta"><a href="'+esc(D.reportUrl)+'">📖 Read the full report →</a></div>'+
  '<footer>Auto-generated for information only. <b>Not financial advice</b> — do your own research.<br>'+
    'Stock Soup · served hot, hourly · next pot ~21:00 AEST</footer>';

  wire(D);
}

function wire(D){
  var root=document.documentElement;
  document.getElementById('themeBtn').addEventListener('click',function(){
    var cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    root.setAttribute('data-theme',cur==='dark'?'light':'dark');
  });
  var tabs=document.querySelectorAll('.tab[data-region]');
  tabs.forEach(function(t){t.addEventListener('click',function(){
    tabs.forEach(function(x){x.setAttribute('aria-selected','false');document.getElementById('menu-'+x.dataset.region).classList.add('hidden');});
    t.setAttribute('aria-selected','true');document.getElementById('menu-'+t.dataset.region).classList.remove('hidden');
  });});
  var lvl=(D.risk&&D.risk.level!=null)?D.risk.level:50;
  requestAnimationFrame(function(){var n=document.getElementById('needle');if(n)n.style.left=lvl+'%';});
}

/* Try live data (works on GitHub Pages); fall back to embedded (works anywhere, incl. preview). */
render(EMBEDDED);
try{
  fetch('latest.json',{cache:'no-store'}).then(function(res){return res.ok?res.json():null;})
    .then(function(j){if(j&&j.regions)render(j);}).catch(function(){});
}catch(e){}
</script>
