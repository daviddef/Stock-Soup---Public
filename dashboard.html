<meta charset="utf-8">
<title>Stock Soup — Tonight's Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<style>
  :root{
    --ground:#14100E; --surface:#1E1815; --surface-2:#271F1A; --line:#3A2F27;
    --broth:#FF6B1A; --buy:#23C267; --dont:#FF4D4D; --hold:#FFC53D;
    --ink:#F4EDE4; --muted:#A69A8C; --faint:#6E6154;
    --shadow:0 12px 40px -12px rgba(0,0,0,.7);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:light){
    :root{ --ground:#FBF6EF; --surface:#FFFFFF; --surface-2:#F3EADF; --line:#E4D7C6;
      --ink:#1E1815; --muted:#7A6C5C; --faint:#A99A88; --shadow:0 12px 40px -16px rgba(80,50,20,.25); }
  }
  :root[data-theme="dark"]{ --ground:#14100E; --surface:#1E1815; --surface-2:#271F1A; --line:#3A2F27;
    --ink:#F4EDE4; --muted:#A69A8C; --faint:#6E6154; --shadow:0 12px 40px -12px rgba(0,0,0,.7); }
  :root[data-theme="light"]{ --ground:#FBF6EF; --surface:#FFFFFF; --surface-2:#F3EADF; --line:#E4D7C6;
    --ink:#1E1815; --muted:#7A6C5C; --faint:#A99A88; --shadow:0 12px 40px -16px rgba(80,50,20,.25); }

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ground);color:var(--ink);font-family:var(--font);line-height:1.5;
    -webkit-font-smoothing:antialiased;padding:clamp(14px,3vw,40px)}
  .wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  .display{font-weight:900;letter-spacing:-.02em;text-wrap:balance;line-height:.98;text-transform:uppercase}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a.q{color:inherit;text-decoration:none;border-bottom:1px dotted transparent}
  a.q:hover{color:var(--broth);border-bottom-color:var(--broth)}
  a.q:focus-visible{outline:2px solid var(--broth);outline-offset:2px;border-radius:2px}

  .hero{background:radial-gradient(120% 140% at 100% 0%, rgba(255,107,26,.16), transparent 55%),var(--surface);
    border:1px solid var(--line);border-radius:20px;padding:clamp(20px,3.5vw,38px);position:relative;overflow:hidden}
  .brandrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:20px;letter-spacing:-.01em}
  .bowl{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 200deg,var(--broth),#FFB061,var(--broth));
    display:grid;place-items:center;font-size:20px;box-shadow:0 0 24px -4px var(--broth)}
  .live{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--buy);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(35,194,103,.55)}70%{box-shadow:0 0 0 8px rgba(35,194,103,0)}100%{box-shadow:0 0 0 0 rgba(35,194,103,0)}}
  .hero h1{font-size:clamp(34px,7vw,68px);margin:14px 0 6px}
  .hero h1 .hot{color:var(--broth)}
  .chef{font-size:clamp(15px,2.2vw,19px);color:var(--muted);max-width:60ch;text-wrap:pretty}
  .chef b{color:var(--ink)}
  .metastrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .chip{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .toggle{cursor:pointer;font-family:var(--font);color:var(--ink)}
  .toggle:focus-visible{outline:2px solid var(--broth);outline-offset:2px}
  .meter{margin-top:18px}
  .meter .track{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--dont),var(--hold),var(--buy));position:relative;opacity:.9}
  .meter .needle{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 3px var(--surface);left:50%;transition:left .8s cubic-bezier(.2,.8,.2,1)}
  .meter .lbls{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:6px;font-weight:700}

  .pulsebar{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--broth);border-radius:14px;padding:14px 16px}
  .pulsebar .ph{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .pdot{width:8px;height:8px;border-radius:50%;background:var(--broth);animation:pulse 2.4s infinite}
  .psynth{font-size:14.5px;line-height:1.5;text-wrap:pretty;color:var(--muted)}
  .celastcheck{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;font-weight:700;color:var(--muted)}
  .psynth b{color:var(--ink)}
  .pmovers{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
  .pmv{font-size:12px;font-weight:800;font-family:var(--mono);padding:3px 9px;border-radius:7px;background:var(--surface-2)}
  .pmv.up{color:var(--buy)} .pmv.down{color:var(--dont)}
  .cenv{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
  @media(max-width:760px){.cenv{grid-template-columns:1fr}}
  .cetraj,.ceprox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
  .ceh{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .cechartwrap{position:relative;padding-right:52px}
  .cechart{width:100%;height:120px;display:block}
  .celab{position:absolute;right:0;transform:translateY(-50%);font-size:11.5px;font-weight:900;white-space:nowrap;letter-spacing:.02em}
  .ceflat{text-align:right;font-size:10.5px;font-weight:800;color:var(--muted);margin-top:7px;padding-right:6px;letter-spacing:.02em}
  .celegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11px;font-weight:700}
  .celeg{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
  .celeg i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .celeg b.up{color:var(--buy)} .celeg b.down{color:var(--dont)}
  .proxrow{display:flex;align-items:center;gap:10px;padding:6px 0}
  .pxs{font-weight:800;font-size:13px;width:52px}
  .proxbar{flex:1;position:relative;height:8px;border-radius:999px;background:var(--surface-2)}
  .proxzone{position:absolute;left:0;top:0;bottom:0;width:19%;background:rgba(35,194,103,.32);border-radius:999px}
  .proxnow{position:absolute;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
  .pxg{min-width:92px;display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums}
  .pxbuy{font-size:12px;font-weight:800;color:var(--ink)}
  .pxst{font-size:10px;font-weight:800;color:var(--muted)}
  .s-in .proxnow,.s-near .proxnow{background:var(--buy)} .s-in .pxst,.s-near .pxst{color:var(--buy)}
  .s-close .proxnow{background:var(--hold)} .s-close .pxst{color:var(--hold)}
  .s-wait .proxnow{background:var(--faint)}
  .proxpct{position:absolute;bottom:14px;transform:translateX(-50%);font-size:10px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
  .s-in .proxpct,.s-near .proxpct{color:var(--buy)} .s-close .proxpct{color:var(--hold)} .s-wait .proxpct{color:var(--muted)}
  .proxkey{font-size:10px;color:var(--faint);margin-top:10px}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:2px}
  .infobtn{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);background:none;color:var(--muted);font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:12px;line-height:1;cursor:pointer;align-self:center;transition:border-color .12s,color .12s}
  .infobtn:hover{border-color:var(--broth);color:var(--broth)}
  .schedlink{cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .schedi{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1.2px solid var(--muted);font-family:Georgia,serif;font-style:italic;font-size:9.5px;font-weight:700}
  .schedlink:hover .schedi{border-color:var(--broth);color:var(--broth)}
  .infobody h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--broth);font-weight:800;margin:16px 0 6px}
  .infobody p{font-size:14px;line-height:1.55;color:var(--ink);margin:0 0 10px;text-wrap:pretty}
  .infobody .infoul{margin:0 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.5}
  .infobody .infofoot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
  .sec-head h2{font-size:clamp(20px,3.4vw,30px)}
  .sec-head .k{color:var(--broth)}
  .sec-sub{color:var(--muted);font-size:14px;margin-bottom:16px}

  .tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
  .tab{border:0;background:transparent;color:var(--muted);font-family:var(--font);font-weight:800;font-size:13px;
    padding:8px 16px;border-radius:9px;cursor:pointer;letter-spacing:.02em;transition:.15s}
  .tab[aria-selected="true"]{background:var(--broth);color:#1a0f06}
  .tab:disabled{opacity:.45;cursor:not-allowed}
  .tab:focus-visible{outline:2px solid var(--broth);outline-offset:2px}

  .menu{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:760px){.menu{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;
    box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease;cursor:pointer}
  .card:hover{transform:translateY(-4px);border-color:var(--broth)}
  .card:focus-visible{outline:2px solid var(--broth);outline-offset:3px}
  .card .tf{display:flex;align-items:center;justify-content:space-between}
  .tf .name{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .verdict{font-size:12px;font-weight:900;padding:5px 11px;border-radius:8px;letter-spacing:.04em;text-transform:uppercase}
  .v-buy{background:rgba(35,194,103,.16);color:var(--buy);border:1px solid rgba(35,194,103,.4)}
  .v-hold{background:rgba(255,197,61,.16);color:var(--hold);border:1px solid rgba(255,197,61,.4)}
  .v-dont{background:rgba(255,77,77,.16);color:var(--dont);border:1px solid rgba(255,77,77,.4)}
  .card .tick{display:flex;align-items:baseline;gap:10px}
  .tick .symwrap{display:flex;flex-direction:column}
  .tick .sym{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1}
  .tick .co{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
  .tick .px{margin-left:auto;text-align:right}
  .px .p{font-weight:800;font-size:19px}
  .px .c{font-size:12px;font-weight:700}
  .up{color:var(--buy)} .down{color:var(--dont)}
  .card .plain{font-size:14px;color:var(--ink);text-wrap:pretty}
  .card .lvls{display:flex;gap:6px;font-size:11px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;flex-wrap:wrap}
  .lvls b{color:var(--ink)}
  .card .more{font-size:11px;font-weight:800;color:var(--broth);letter-spacing:.02em}
  .buyat{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-weight:800;font-size:13px;padding:6px 8px 6px 12px;border-radius:9px;width:100%;flex-wrap:wrap}
  .buyat.ba-in{background:rgba(35,194,103,.11);border-color:rgba(35,194,103,.36);color:var(--buy)}
  .buyat.ba-close{background:rgba(240,180,0,.10);border-color:rgba(240,180,0,.34);color:var(--hold)}
  .buyat.ba-wait{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
  .baact{font-weight:800;font-size:12px}
  .tonight{display:flex;align-items:center;gap:7px;margin:2px 0 2px}
  .tnl{text-transform:uppercase;letter-spacing:.07em;font-size:9.5px;font-weight:800;color:var(--faint)}
  .tonight svg{flex:0 0 auto;display:block}
  .mtpct{font-family:var(--mono);font-weight:800;font-size:11.5px}
  .mtn{font-size:10px;color:var(--faint);font-weight:700}
  .buyat .bl{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .storyrow{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .storyrow:last-child{border-bottom:0}
  .storyrow .slbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .storyrow b{color:var(--broth)}
  .pickcol{display:flex;flex-direction:column;gap:12px}
  .rucard{background:linear-gradient(180deg,rgba(255,107,26,.10),rgba(255,107,26,.03));border:1px solid rgba(255,107,26,.4);border-left:4px solid var(--broth);border-radius:14px;padding:15px 16px}
  .rutag{font-size:13px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--broth);margin-bottom:8px}
  .rutop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .rusym{font-size:24px;font-weight:900;text-decoration:none;color:var(--ink);letter-spacing:-.02em}
  .rusym:hover{color:var(--broth)}
  .runame{font-size:13px;color:var(--muted);font-weight:700}
  .rupx{margin-left:auto;font-size:14px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .ruline{font-size:14px;color:var(--ink);margin-top:9px;text-wrap:pretty;line-height:1.5}
  .rucard.tappable{cursor:pointer;transition:transform .15s,box-shadow .15s}
  .rucard.tappable:hover{transform:translateY(-2px);box-shadow:0 8px 24px -12px var(--broth)}
  .rucard.tappable:focus-visible{outline:2px solid var(--broth);outline-offset:3px}
  .rumore{font-size:11px;font-weight:800;color:var(--broth);margin-top:9px}
  .spark{width:100%;height:46px;display:block;margin:4px 0 2px}
  .spark.up{--sc:var(--buy)} .spark.down{--sc:var(--dont)}
  .spark polyline{fill:none;stroke:var(--sc);stroke-width:1.5;vector-effect:non-scaling-stroke}
  .spark polygon{fill:var(--sc);opacity:.14}
  .spark circle{fill:var(--sc)}
  .mrange{margin-top:2px}
  .mrlbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:6px}
  .mrbar{position:relative;height:7px;border-radius:999px;background:linear-gradient(90deg,var(--buy),var(--hold) 55%,var(--dont))}
  .mrnow{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
  .mrends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;gap:8px}
  .mrends span:nth-child(2){color:var(--ink);font-weight:800}
  .mrunner{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:13px;line-height:1.5}
  .mrunner .rh{font-weight:800;color:var(--broth);margin-bottom:4px}
  .mrunner a{color:var(--ink);text-decoration:none}.mrunner a:hover{color:var(--broth)}

  /* JOURNEY */
  .chef-note{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 15px;font-size:14px;margin-bottom:14px;color:var(--ink)}
  .chef-note b{color:var(--broth)}
  .journey{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
  .jcol{min-width:196px;flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;scroll-snap-align:start}
  .jcol.now{border-color:var(--broth);box-shadow:0 0 0 1px var(--broth) inset}
  .jhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
  .jhead .when{font-weight:800;font-size:13px}
  .jhead .when small{display:block;color:var(--muted);font-weight:600;font-size:11px}
  .now-b{font-size:10px;font-weight:900;background:var(--broth);color:#1a0f06;padding:2px 7px;border-radius:6px;letter-spacing:.06em}
  .jgrp{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:800;margin:9px 0 4px}
  .jrow{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:13px}
  .jrow .jtf{width:15px;flex:0 0 auto}
  .jrow .jinfo{min-width:0;flex:1}
  .jrow .jinfo a{font-weight:800}
  .jrow .jname{color:var(--muted);font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .jrow .jb{margin-left:auto;font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;flex:0 0 auto}
  .jb-new{background:rgba(255,107,26,.18);color:var(--broth)}
  .jb-drop{color:var(--dont)}
  .jrow.keep,.jrow.drop{border-radius:7px;margin:2px -7px;padding:4px 7px}
  .jrow.keep{background:rgba(35,194,103,.13)}
  .jrow.drop{background:rgba(255,77,77,.10)}
  .jrow.drop .jinfo a{color:var(--muted);text-decoration:line-through}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
  .panel h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:800}
  .panel .panelsub{font-size:12px;color:var(--faint);margin-bottom:12px;text-wrap:pretty}
  .score .wl{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;vertical-align:middle}
  .score{display:flex;gap:18px;align-items:center;margin-bottom:14px}
  .score .big{font-size:40px;font-weight:900;line-height:1}
  .score .sub{font-size:13px;color:var(--muted)}
  .rec{display:flex;flex-direction:column;gap:8px}
  .rec .row{display:flex;align-items:center;gap:10px;font-size:13px}
  .rec .rsym{font-weight:800;width:52px}
  .rec .bar{flex:1;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
  .rec .fill{position:absolute;top:0;bottom:0;border-radius:999px}
  .rec .res{width:74px;text-align:right;font-weight:800;font-family:var(--mono)}
  .cooking .row{justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px;align-items:center}
  .cooking .row:last-child{border-bottom:0}
  .cooking .st{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .stack{display:flex;flex-direction:column;gap:9px}
  .line{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14px}
  .clickline{cursor:pointer;transition:border-color .12s,transform .1s}
  .clickline:hover{border-color:var(--broth)}
  .clickline:active{transform:scale(.995)}
  .themerow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
  .themerow:last-of-type{border-bottom:0}
  .themerow.tappable{cursor:pointer;margin:0 -8px;padding:9px 8px;border-radius:9px}
  .themerow.tappable:hover{background:var(--surface-2)}
  .trsym{font-weight:900;font-size:14px;text-decoration:none;color:var(--ink);flex:0 0 auto;min-width:48px}
  .trln{flex:1;font-size:12.5px;color:var(--ink);line-height:1.4;text-wrap:pretty}
  .trln .muted{color:var(--muted)}
  .tvd{font-weight:800;text-transform:uppercase;font-size:10.5px}
  .tvd.buy{color:var(--buy)} .tvd.hold{color:var(--hold)} .tvd.dont{color:var(--dont)}
  .trcue{color:var(--broth);font-weight:800;font-size:11px;flex:0 0 auto}
  .line .em{font-size:18px}
  .line .txt{flex:1}
  .line .txt small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .tag{font-size:11px;font-weight:900;padding:4px 9px;border-radius:7px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
  .t-buy{background:rgba(35,194,103,.16);color:var(--buy)}
  .t-dont{background:rgba(255,77,77,.16);color:var(--dont)}
  .t-watch{background:rgba(255,197,61,.16);color:var(--hold)}
  .t-hot{background:rgba(255,107,26,.18);color:var(--broth)}

  /* FULL POT — candidate heatmap */
  .potlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:12px}
  .potlegend span{display:inline-flex;align-items:center;gap:5px}
  .potlegend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .pot{display:flex;flex-wrap:wrap;gap:8px}
  .pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 13px 7px 10px;font-size:13px;
    border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .12s}
  .pill:hover{transform:translateY(-2px)}
  .pill:focus-visible{outline:2px solid var(--broth);outline-offset:2px}
  .pill .ph{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .pill .ph.no{background:none!important;width:auto;height:auto;border-radius:0;font-size:11px;line-height:1}
  .legno{font-size:11px;line-height:1}
  .pill b{font-weight:800}
  .pill small{color:var(--muted);font-size:12px}
  .pill .ppx{font-family:var(--mono);font-size:11.5px;font-weight:800}
  .pill .ppx.up{color:var(--buy)} .pill .ppx.down{color:var(--dont)}
  .pill .flag{font-size:10px;color:var(--faint);font-weight:700}
  .h-hot{background:rgba(255,107,26,.13);border-color:rgba(255,107,26,.45)} .h-hot .ph{background:var(--broth)}
  .h-good{background:rgba(35,194,103,.11);border-color:rgba(35,194,103,.4)} .h-good .ph{background:var(--buy)}
  .h-mid{background:rgba(255,197,61,.1);border-color:rgba(255,197,61,.4)} .h-mid .ph{background:var(--hold)}
  .h-cold{background:rgba(255,77,77,.1);border-color:rgba(255,77,77,.38)} .h-cold .ph{background:var(--dont)}

  .trail .step{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
  .trail .step:last-child{border-bottom:0}
  .trail .n{font-family:var(--mono);color:var(--broth);font-weight:800;font-size:13px;min-width:22px}
  .trail .st-txt{font-size:14px}
  .trail .st-txt small{color:var(--muted);display:block;margin-top:2px}
  .funnel{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--broth);border-radius:12px;padding:13px 16px;margin-bottom:14px}
  .fnrow{font-size:15px;font-weight:800;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .fnn{font-size:20px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
  .fnar{color:var(--broth);font-weight:900}
  .dvdet{margin-top:10px}
  .dvdet summary{cursor:pointer;font-size:12px;font-weight:800;color:var(--broth);width:fit-content}
  .dvlist{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .dvpill{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px}
  .dvpill small{color:var(--muted)}
  .trailjump{color:var(--broth);font-weight:800;text-decoration:none;white-space:nowrap}
  .trailjump:hover{text-decoration:underline}

  .cta{display:flex;justify-content:center;margin-top:4px}
  .cta a{background:var(--broth);color:#1a0f06;font-weight:900;text-decoration:none;padding:15px 30px;border-radius:12px;
    font-size:15px;letter-spacing:.02em;box-shadow:0 8px 30px -8px var(--broth);transition:transform .15s}
  .cta a:hover{transform:translateY(-2px)}
  .cta a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  footer{text-align:center;color:var(--faint);font-size:11px;line-height:1.7;padding-top:6px}
  .hidden{display:none}

  /* WATCHLIST / REGISTER */
  .wlbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .wlbar input{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px 13px;font-family:var(--font);font-size:14px;text-transform:uppercase}
  .wlbar input:focus-visible{outline:2px solid var(--broth);outline-offset:1px}
  .wlseg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .wlseg button{background:var(--surface);border:0;color:var(--muted);font-family:var(--font);font-weight:800;font-size:13px;padding:0 14px;cursor:pointer}
  .wlseg button[aria-pressed="true"]{background:var(--broth);color:#1a0f06}
  .wladd{background:var(--broth);color:#1a0f06;border:0;font-family:var(--font);font-weight:800;border-radius:10px;padding:0 20px;cursor:pointer;font-size:14px}
  .wlpills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:8px}
  .wlpill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 13px;font-size:13px}
  .wlpill a{font-weight:800;color:var(--ink);text-decoration:none}
  .wlpill a:hover{color:var(--broth)}
  .wlpill .rm{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:11px;line-height:1;padding:0}
  .wlempty{color:var(--faint);font-size:13px}
  .wlreg{display:inline-block;background:var(--buy);color:#04240f;font-weight:900;text-decoration:none;padding:12px 22px;border-radius:11px;font-size:14px;border:0;cursor:pointer;font-family:var(--font)}
  .wlreg:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .wlstatus{font-size:13px;font-weight:700;margin-top:10px;min-height:18px}
  .wlnote{font-size:12px;color:var(--muted);margin-top:12px;max-width:60ch}
  /* ＋Watch buttons (cards + modal) */
  .watchbtn{cursor:pointer;font-family:var(--font);font-weight:800;white-space:nowrap}
  .watchbtn.on{background:var(--broth)!important;border-color:var(--broth)!important;color:#fff!important}
  .cardwatch{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:12px;padding:5px 12px;border-radius:999px;margin-left:auto;flex:0 0 auto}
  .cardwatch:hover{border-color:var(--broth);color:var(--broth)}
  .tf-r{display:flex;align-items:center;gap:8px}
  .iconwatch{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:16px;font-weight:800;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;transition:border-color .12s,color .12s,background .12s}
  .iconwatch:hover{border-color:var(--broth);color:var(--broth)}
  .iconwatch.on{background:var(--broth);border-color:var(--broth);color:#fff}
  /* Smart-watchlist alert + rows */
  .wlalert{background:rgba(35,194,103,.13);border:1px solid rgba(35,194,103,.5);color:var(--ink);border-radius:11px;padding:11px 14px;font-size:13.5px;font-weight:700;margin-bottom:14px;text-wrap:pretty}
  #wlPills{display:flex;flex-direction:column;gap:18px}
  .wlgroup{}
  .wlgh{font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:8px}
  .wlgn{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--muted)}
  .wlgs{font-size:12px;color:var(--muted);margin:3px 0 11px}
  .wlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;align-items:stretch}
  .wrow{display:flex;flex-direction:column;gap:7px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--faint);border-radius:12px;padding:12px 13px;height:100%}
  .wrow.wclick{cursor:pointer;transition:border-color .12s,transform .12s}
  .wrow.wclick:hover{border-color:var(--broth)}
  .wrow.wt-in{border-left-color:var(--buy);background:rgba(35,194,103,.06)}
  .wrow.wt-close{border-left-color:var(--hold)} .wrow.wt-wait{border-left-color:var(--faint)} .wrow.wt-none{border-left-color:var(--line)}
  .wc-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .wsym{font-weight:900;font-size:15px;text-decoration:none;color:var(--ink)}
  .wsym .wflag{font-size:9px;color:var(--faint);font-weight:700}
  .wrm{background:none;border:0;color:var(--faint);cursor:pointer;font-size:14px;padding:2px 4px;line-height:1}
  .wrm:hover{color:var(--dont)}
  .wc-px{display:flex;align-items:baseline;gap:10px}
  .wpx{font-family:var(--mono);font-weight:900;font-size:16px}
  .wpx.up{color:var(--buy)} .wpx.down{color:var(--dont)} .wpx.muted{color:var(--muted)}
  .wst{margin-left:auto;font-size:11.5px;font-weight:800}
  .wt-in .wst{color:var(--buy)} .wt-close .wst{color:var(--hold)} .wt-wait .wst{color:var(--muted)}
  .wc-lv{font-size:11.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .wc-tag{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line);font-size:11px}
  .wc-tag.none{color:var(--faint);font-style:italic;font-weight:600}
  .wic{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-weight:800;white-space:nowrap}
  .wic.sc{border-color:rgba(255,122,26,.4);color:var(--broth)}
  .wic.vd{text-transform:uppercase;font-size:9.5px;letter-spacing:.03em}
  .wic.vd.buy{color:var(--buy);border-color:rgba(35,194,103,.4)} .wic.vd.hold{color:var(--hold)} .wic.vd.dont{color:var(--dont)}
  .wic.tr{color:var(--muted);font-weight:600;white-space:normal;flex:1 1 100%;background:none;border:0;padding:3px 0}
  .wview{margin-left:auto;background:var(--broth);border:0;color:#fff;font-family:var(--font);font-weight:800;font-size:10.5px;padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .wview:hover{filter:brightness(1.08)}

  /* ARCHIVE */
  .arch{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .acard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s}
  .acard:hover{transform:translateY(-3px);border-color:var(--broth)}
  .acard:focus-visible{outline:2px solid var(--broth);outline-offset:2px}
  .acard .adate{font-weight:800;font-size:13px;margin-bottom:6px}
  .acard .apicks{font-size:12px;color:var(--muted);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
  .acard .arisk{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--broth);margin-top:8px;display:inline-block}
  .archmore{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
  .arch.archcollapsed .acard:nth-child(n+4){display:none}
  .archtoggle{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-family:var(--font);font-weight:800;font-size:12px;padding:8px 16px;border-radius:999px;cursor:pointer}
  .archtoggle:hover{border-color:var(--broth);color:var(--broth)}
  .pulselog{display:flex;flex-direction:column;max-height:280px;overflow-y:auto}
  .plrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:baseline}
  .plrow:last-child{border-bottom:0}
  .pltime{font-weight:800;width:74px;flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .plmv{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:8px}
  .plmv .up{color:var(--buy)} .plmv .down{color:var(--dont)}
  .plquiet{color:var(--faint);font-style:italic}

  /* SIMPLE (mobile-first) VIEW */
  .simple{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .shero{background:radial-gradient(120% 140% at 100% 0%, rgba(255,107,26,.18), transparent 55%),var(--surface);
    border:1px solid var(--line);border-radius:20px;padding:22px}
  .shero .brand{margin-bottom:14px}
  .shero .smood{font-size:clamp(26px,8vw,38px);font-weight:900;letter-spacing:-.02em;text-transform:uppercase;line-height:1;margin-bottom:10px}
  .shero .smood .hot{color:var(--broth)}
  .shero .schef{font-size:14.5px;color:var(--muted);margin:2px 0 12px;text-wrap:pretty;line-height:1.45}
  .shero .meter{margin-top:14px}
  .shero .riskwhat{font-size:13px;color:var(--muted);margin-top:10px;font-weight:600;text-wrap:pretty}
  .shero .schips{display:flex;gap:6px;flex-wrap:wrap}
  .shero .schips .chip{padding:5px 9px;font-size:11px;white-space:nowrap}
  .shero .schips .chip .dot{width:7px;height:7px}
  .sregion{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px;margin:2px 0}
  .sregion button{border:0;background:transparent;color:var(--muted);font-family:var(--font);font-weight:800;font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer}
  .sregion button[aria-pressed="true"]{background:var(--broth);color:#1a0f06}
  .scard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .15s}
  .scard:hover{border-color:var(--broth)} .scard:active{transform:scale(.99)}
  .scard:focus-visible{outline:2px solid var(--broth);outline-offset:3px}
  .stf{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
  .ssym{font-size:clamp(30px,8vw,36px);font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:12px;flex-wrap:wrap;line-height:1}
  .sverd{font-size:13px;font-weight:900;padding:5px 11px;border-radius:9px;text-transform:uppercase;letter-spacing:.03em}
  .sname{color:var(--muted);font-size:15px;font-weight:700;margin:8px 0 12px}
  .sname .up{color:var(--buy)} .sname .down{color:var(--dont)}
  .sline{font-size:16px;line-height:1.45;text-wrap:pretty}
  .stap{font-size:11px;font-weight:800;color:var(--broth);margin-top:12px;letter-spacing:.02em}
  .squick{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .squick .qh{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}
  .squick .qrow{font-size:13px;line-height:1.5;text-wrap:pretty}
  .squick .qbuy{color:var(--buy);font-weight:700}
  .squick .qmeh{color:var(--muted);font-weight:600}
  .squick .qskip{color:var(--dont);font-weight:700}
  .squick .qdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--hold);vertical-align:middle;margin-right:3px}
  .shero .seyebrow{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:12px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shero .seyebrow b{color:var(--broth)}
  .sbottom{font-size:14px;color:var(--muted);text-align:center;text-wrap:pretty;padding:2px 6px}
  .viewbtn{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-family:var(--font);
    font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;line-height:1.5;height:34px;display:inline-flex;align-items:center}
  .viewbtn:focus-visible{outline:2px solid var(--broth);outline-offset:2px}
  .sfull{display:block;width:100%;text-align:center;background:transparent;border:1px dashed var(--line);color:var(--muted);
    font-family:var(--font);font-weight:800;font-size:14px;padding:14px;border-radius:14px;cursor:pointer}
  .sfull:hover{color:var(--broth);border-color:var(--broth)}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(8,5,3,.74);backdrop-filter:blur(4px);display:none;
    align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;z-index:50}
  .overlay.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;max-width:560px;width:100%;
    box-shadow:0 30px 90px -20px rgba(0,0,0,.85);overflow:hidden;margin:auto 0;transform:translateY(12px);opacity:0;transition:transform .22s ease,opacity .22s ease}
  .overlay.open .modal{transform:none;opacity:1}
  .mhead{padding:22px 22px 18px;position:relative}
  .mhead.v-buy{background:linear-gradient(135deg,rgba(35,194,103,.24),transparent 70%)}
  .mhead.v-hold{background:linear-gradient(135deg,rgba(255,197,61,.24),transparent 70%)}
  .mhead.v-dont{background:linear-gradient(135deg,rgba(255,77,77,.26),transparent 70%)}
  .mtf{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted)}
  .mtop{display:flex;align-items:flex-end;gap:12px;margin-top:8px}
  .mtop .msym{font-size:38px;font-weight:900;letter-spacing:-.03em;line-height:.9}
  .mtop .mco{font-size:13px;color:var(--muted);font-weight:700}
  .mtop .mpx{margin-left:auto;text-align:right}
  .mpx .mp{font-size:22px;font-weight:900}
  .mclose{position:absolute;top:14px;right:14px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:16px;font-weight:800;line-height:1}
  .mclose:focus-visible{outline:2px solid var(--broth);outline-offset:2px}
  .mverd{display:inline-block;margin-top:12px;font-size:12px;font-weight:900;padding:6px 12px;border-radius:9px;text-transform:uppercase;letter-spacing:.04em}
  .mbody{padding:20px 22px 24px;display:flex;flex-direction:column;gap:18px}
  .viz{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px}
  .viz h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:16px}
  .ladder{position:relative;height:8px;border-radius:999px;background:linear-gradient(90deg,rgba(255,77,77,.5),rgba(255,197,61,.4),rgba(35,194,103,.55));margin:26px 0 8px}
  .ladder .mk{position:absolute;top:50%;transform:translate(-50%,-50%)}
  .ladder .now{width:16px;height:16px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--surface);z-index:2}
  .ladder .ent{width:3px;height:18px;background:var(--muted);border-radius:2px}
  .ladder .cap{position:absolute;top:-22px;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--muted);white-space:nowrap}
  .ladder .cap.now{color:var(--ink);width:auto;height:auto;border-radius:0;background:none;box-shadow:none}
  .lends{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);margin-top:6px}
  .lends .g{color:var(--buy)} .lends .r{color:var(--dont)}
  .rsibar{position:relative;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--buy),var(--hold) 55%,var(--dont));margin:24px 0 8px}
  .rsibar .rn{position:absolute;top:50%;transform:translate(-50%,-50%);width:4px;height:18px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 3px var(--surface)}
  .rsibar .rcap{position:absolute;top:-22px;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--ink);white-space:nowrap}
  .rsimeta{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}

function renderChangeEnv(D, pulses){

  });
  var allp=[]; series.forEach(function(s){s.pct.forEach(function(v){if(v!=null)allp.push(v);});});
  var mx=Math.max.apply(null,allp),mn=Math.min.apply(null,allp),rng=(mx-mn)||1;
  function X(i){return (i/(n-1))*W;}
  function Y(v){return H-((v-mn)/rng)*(H-10)-5;}
  var zero='<line x1="0" y1="'+Y(0).toFixed(1)+'" x2="'+W+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="2 3"/>';

  var _all=series.map(function(s){var lv=s.pct[s.pct.length-1];return {sym:s.sym,color:s.color,last:s.last,y:lv!=null?(Y(lv)/H*100):null};}).filter(function(x){return x.y!=null;});
  var _labs=_all.filter(function(l){return Math.abs(l.last)>=0.15;});
  var _flatL=_all.filter(function(l){return Math.abs(l.last)<0.15;});
  _labs.sort(function(a,b){return a.y-b.y;});
  var MINGAP=12;
  for(var _i=1;_i<_labs.length;_i++){ if(_labs[_i].y-_labs[_i-1].y<MINGAP) _labs[_i].y=_labs[_i-1].y+MINGAP; }
  var _over=(_labs.length?_labs[_labs.length-1].y:0)-96;
  if(_over>0){ for(_i=0;_i<_labs.length;_i++) _labs[_i].y-=_over; }

  var prox=picks.filter(function(pk){return pk.nEntry&&pk.now;}).sort(function(a,b){return (a.now/a.nEntry)-(b.now/b.nEntry);}).map(function(pk){

function themeTickers(item){
  if(item.tickers) return item.tickers;

  var STOP={ASX:1,AI:1,US:1,EU:1,UK:1,BUY:1,SKIP:1,WATCH:1,THE:1,AND:1,AUKUS:1,ETF:1,IPO:1,CEO:1,USD:1,AUD:1,RSI:1,NYSE:1,FDA:1,GDP:1,NEW:1,LOW:1,HIGH:1,BTC:1,EV:1};
  var found=(text.match(/\b[A-Z]{2,5}\b/g)||[]).filter(function(t){return !STOP[t];});
  var seen={},out=[]; found.forEach(function(t){if(!seen[t]){seen[t]=1;out.push(t);}}); return out;
}

// ---- Smart watchlist (per-browser localStorage; global so cards, modal & section all share it) ----
var WLKEY='soup_watchlist';
function wlGet(){try{return JSON.parse(localStorage.getItem(WLKEY)||'[]');}catch(e){return[];}}
function wlSet(a){try{localStorage.setItem(WLKEY,JSON.stringify(a));}catch(e){}}
function wlHas(sym,region){return wlGet().some(function(w){return w.sym===sym&&w.region===region;});}
function wlAddItem(it){var a=wlGet();if(!a.some(function(w){return w.sym===it.sym&&w.region===it.region;})){a.push(it);wlSet(a);}}
function wlRemove(sym,region){wlSet(wlGet().filter(function(w){return !(w.sym===sym&&w.region===region);}));}
function wlToggle(it){if(wlHas(it.sym,it.region)){wlRemove(it.sym,it.region);return false;}wlAddItem(it);return true;}
function wlNum(s){var v=(String(s==null?'':s)).match(/([\d.]+)/);return v?parseFloat(v[1]):null;}
function wlPriceMap(D){
  var m={};
  function put(sym,region,price,up,change,entry){var p=wlNum(price);if(p==null)return;var k=sym+'|'+region;
    if(!m[k])m[k]={price:p,cur:region==='au'?'A$':'$',up:!!up,change:change,entry:(entry!=null?entry:null)};
    else if(entry!=null&&m[k].entry==null)m[k].entry=entry;}
  (D.regions||[]).forEach(function(rg){(rg.picks||[]).forEach(function(p){put(p.sym,rg.id,p.price,p.up,p.change,p.nEntry);});});
  (D.candidates||[]).forEach(function(c){put(c.sym,c.region,c.price,c.up,c.change,null);});
  (D.defaultWatchlist||[]).forEach(function(w){put(w.sym,w.region,w.price,w.up,w.change,null);});
  return m;
}
// Smart overlay for a watched ticker: pull the richest intel we already hold.
// Priority: current pick (full, tappable) > scored shared-watchlist intel > candidate > none.
function wlIntel(w,D){
  var pick=null,preg=null,pidx=null,pcur='$';
  (D.regions||[]).forEach(function(rg){(rg.picks||[]).forEach(function(p,i){if(p.sym===w.sym&&rg.id===w.region){pick=p;preg=rg.id;pidx=i;pcur=rg.cur||'$';}});});
  if(pick) return {kind:'pick',region:preg,idx:pidx,cur:pcur,
    score:(pick.score&&!pick.score.pending?(pick.score.buy_now+'/100 · '+pick.score.band):null),
    target:pick.nTarget,entry:pick.nEntry,verdict:pick.verdict,vclass:pick.vclass,catalyst:(pick.catalysts||[])[0]||pick.plain};
  var wi=(D.watchlistIntel||{})[w.sym];
  if(wi && wi.region===w.region && !wi.error){
    var vclass=/get in|buy|nibble/i.test(wi.verdict||'')?'buy':/wait|late|skip|pass/i.test(wi.verdict||'')?'dont':'hold';
    return {kind:'intel',cur:wi.cur||pcur,entry:wi.entry,target:wi.target,
      score:(wi.buy_now!=null?(wi.buy_now+'/100 · '+wi.band):null),
      verdict:wi.verdict||null,vclass:vclass,trend:wi.trend,asx:!!wi.asx_limited,sent:wi.sent};
  }
  var c=(D.candidates||[]).filter(function(x){return x.sym===w.sym&&x.region===w.region;})[0];
  if(c) return {kind:'cand',note:c.note,heat:c.heat};
  return {kind:'none'};
}
function renderWatchlist(){
  var el=document.getElementById('wlPills'); if(!el) return;
  var D=(LAST&&LAST.D)||{}, pm=wlPriceMap(D);
  var rows=wlGet().map(function(w){
    var info=pm[w.sym+'|'+w.region]||null;
    var it=wlIntel(w,D);
    var entry=(w.entry!=null?w.entry:(info&&info.entry!=null?info.entry:(it.entry!=null?it.entry:null)));
    var price=info?info.price:null, cur=info?info.cur:(it.cur||(w.region==='au'?'A$':'$'));
    var gap=(entry&&price)?(price/entry-1)*100:null;
    return {w:w,price:price,cur:cur,up:info?info.up:null,change:info?info.change:null,entry:entry,gap:gap,intel:it};
  });
  var triggered=rows.filter(function(r){return r.gap!=null&&r.gap<=0.5;});
  rows.sort(function(x,y){var gx=x.gap==null?9999:x.gap,gy=y.gap==null?9999:y.gap;return gx-gy;});
  var banner=document.getElementById('wlAlert');
  if(banner){var t=triggered.map(function(r){return esc(r.w.sym);}).join(', ');
    banner.innerHTML=triggered.length?('🎯 '+triggered.length+' watched '+(triggered.length===1?'stock is':'stocks are')+' at or below your buy price: <b>'+t+'</b> — go look.'):'';
    banner.style.display=triggered.length?'':'none';}
  if(!rows.length){el.innerHTML='<span class="wlempty">No tickers yet — add one above, or tap <b>＋ Watch</b> on any pick.</span>';return;}
  var HEAT={hot:'🔥',good:'✅',mid:'➖',cold:'⛔'};
  function card(r){
    var w=r.w, it=r.intel;
    var cls = r.gap==null?'wt-none':(r.gap<=0.5?'wt-in':(r.gap<=4?'wt-close':'wt-wait'));
    var lbl = r.gap==null?'':(r.gap<=0.5?'at buy ✓':(r.gap<=4?Math.round(r.gap)+'% to buy':Math.round(r.gap)+'% above'));
    var px = r.price!=null?'<span class="wpx '+(r.up?'up':'down')+'">'+r.cur+r.price+'</span>':'<span class="wpx muted">—</span>';
    var lv = (r.entry!=null||it.target!=null)?'<div class="wc-lv">'+(r.entry!=null?'🎯 buy '+r.cur+r.entry:'')+(it.target!=null?(r.entry!=null?'  ·  ':'')+'target '+r.cur+it.target:'')+'</div>':'';
    var tag='';
    if(it.kind==='pick'){
      tag='<div class="wc-tag">'+(it.score?'<span class="wic sc">🧮 '+esc(it.score)+'</span>':'')+'<span class="wic vd '+esc(it.vclass)+'">'+esc(it.verdict)+'</span></div>';
    } else if(it.kind==='intel'){

        (it.asx&&it.trend?'<span class="wic tr">'+esc(it.trend)+'</span>':'')+'</div>';
    } else if(it.kind==='cand'){
      tag='<div class="wc-tag"><span class="wic">'+(HEAT[it.heat]||'•')+' on our radar</span>'+(it.note?'<span class="wic tr">'+esc(it.note)+'</span>':'')+'</div>';
    } else {
      tag='<div class="wc-tag none">Not scanned yet — we’ll assess it next time it surfaces.</div>';
    }
    var clk = it.kind==='pick' ? ' wclick" data-region="'+esc(it.region)+'" data-idx="'+it.idx+'" role="button" tabindex="0' : '';
    return '<div class="wrow '+cls+clk+'">'+
      '<div class="wc-head"><a class="wsym" href="'+yf(w.sym,w.region)+'" target="_blank" rel="noopener">'+esc(w.sym)+' <span class="wflag">'+(w.region==='au'?'AU':'US')+'</span></a>'+
        '<button class="wrm" data-sym="'+esc(w.sym)+'" data-region="'+esc(w.region)+'" aria-label="Remove '+esc(w.sym)+'">✕</button></div>'+
      '<div class="wc-px">'+px+(lbl?'<span class="wst">'+lbl+'</span>':'')+'</div>'+lv+tag+'</div>';
  }

  function group(title,sub,list){ return list.length?'<div class="wlgroup"><div class="wlgh">'+title+' <span class="wlgn">'+list.length+'</span></div>'+(sub?'<div class="wlgs">'+sub+'</div>':'')+'<div class="wlgrid">'+list.map(card).join('')+'</div></div>':''; }
  el.innerHTML=group('🧠 Smart watching','We have a live read on these — buy zone, target, verdict.',smart)+
               group('📌 Also on your list','Tracked — we\'ll assess each when it next surfaces in a scan.',plain);
  el.querySelectorAll('.wrm').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();wlRemove(b.dataset.sym,b.dataset.region);renderWatchlist();syncWatchButtons();});});

    rc.addEventListener('click',function(e){if(e.target.closest('a'))return;openRu();});

  function wlAdd(){var inp=document.getElementById('wlInput');if(!inp)return;var v=(inp.value||'').trim().toUpperCase().replace(/[^A-Z0-9.]/g,'');if(!v)return;wlAddItem({sym:v,region:wlRegion});inp.value='';renderWatchlist();syncWatchButtons();}
  var ab=document.getElementById('wlAdd');if(ab)ab.onclick=wlAdd;

  // Wire every ＋Watch button (cards, modal, pot) to the shared toggle
  document.querySelectorAll('.watchbtn[data-sym]').forEach(function(b){
    b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();watchToggleFromEl(b);});
  });
  syncWatchButtons();
  // Seed the watchlist once from the user's published watchlist.json (their previously-advised tickers)
  try{
    if(!localStorage.getItem('soup_wl_seeded') && (D.defaultWatchlist||[]).length && !wlGet().length){
      wlSet(D.defaultWatchlist.map(function(w){return {sym:w.sym,region:w.region};}));
    }
    if((D.defaultWatchlist||[]).length) localStorage.setItem('soup_wl_seeded','1');
  }catch(e){}
  renderWatchlist();

  // ---- Archive (live report index) ----
  var arch=document.getElementById('archList');
  function renderArch(items){
    if(!arch)return;
    if(!items||!items.length){arch.innerHTML='<div class="wlempty">The full archive loads on the live site.</div>';return;}
    arch.innerHTML=items.map(function(e){
      var risk=e.riskOff?'⛔ Risk-off':'⚪ Neutral';
      return '<a class="acard" href="reports/'+esc(e.file)+'" target="_blank" rel="noopener"><div class="adate">'+esc(e.label||e.timestamp||e.file)+'</div><div class="apicks">'+esc((e.picks||'').slice(0,140))+'</div><span class="arisk">'+risk+'</span></a>';
    }).join('');
    var more=document.getElementById('archMore');
    if(items.length>3){
      arch.classList.add('archcollapsed');
      if(more){ more.innerHTML='<button class="archtoggle" id="archTog">Show '+(items.length-3)+' more →</button>';
        document.getElementById('archTog').onclick=function(){ var c=arch.classList.toggle('archcollapsed'); this.textContent=c?('Show '+(items.length-3)+' more →'):'Show fewer ↑'; };
      }

  }
  fetch('reports/report-index.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){renderArch(j);}).catch(function(){renderArch(null);});

  var lvl=(D.risk&&D.risk.level!=null)?D.risk.level:50;
  requestAnimationFrame(function(){var n=document.getElementById('needle');if(n)n.style.left=lvl+'%';});
}

      (D.chefShort?'<p class="schef">'+esc(D.chefShort)+'</p>':'')+
